// ===== 指で拡大・縮小・移動(地図と捜査ボードで共通に使う) =====
// wrap=外のわく(はみ出しをかくす)、inner=中身(動かす)。
// ・2本指でひろげる/つまむ=拡大縮小、2本指でなぞる=移動
// ・大きくしているときだけ1本指でも移動できる(等倍のときはページをふつうにスクロールさせる)
// ・ダブルタップで拡大、もう一度で元にもどる。＋ − ⟲ のボタンでも動かせる
function zoomable(wrap,inner,opt){
  if(!wrap||!inner) return null;
  const o=opt||{}, MIN=o.min||1, MAX=o.max||6;
  let s=1,tx=0,ty=0,moved=false,lastTap=0,ZC=null;
  const pts=new Map(); let g0=null;
  wrap.classList.add("zwrap"); inner.classList.add("zin");
  const clamp=()=>{ s=Math.max(MIN,Math.min(MAX,s));
    const w=wrap.clientWidth,h=wrap.clientHeight;
    const mx=Math.max(0,(w*s-w)/2), my=Math.max(0,(h*s-h)/2);
    tx=Math.max(-mx,Math.min(mx,tx)); ty=Math.max(-my,Math.min(my,ty)); };
  const apply=()=>{ clamp(); inner.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
    wrap.classList.toggle("zoomed",s>1.01);
    if(ZC){ const zi=ZC.querySelector("[data-zin]"), zo=ZC.querySelector("[data-zout]");
      if(zi) zi.disabled=s>=MAX-.001; if(zo) zo.disabled=s<=MIN+.001; } };
  // (cx,cy)=わくの中での位置。そこを動かさずに倍率を ns にする
  const zoomAt=(ns,cx,cy)=>{ const w=wrap.clientWidth,h=wrap.clientHeight;
    const px=cx-w/2, py=cy-h/2, o1=s; ns=Math.max(MIN,Math.min(MAX,ns));
    tx=px-(px-tx)*ns/o1; ty=py-(py-ty)*ns/o1; s=ns; apply(); };
  const reset=()=>{ s=1;tx=0;ty=0;apply(); };
  const rel=e=>{ const r=wrap.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };

  wrap.addEventListener("pointerdown",e=>{
    if(o.skip&&o.skip(e)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    moved=false;
    if(pts.size===1){
      const t=Date.now(); if(t-lastTap<320){ const [cx,cy]=rel(e); s>1.01?reset():zoomAt(2.6,cx,cy); lastTap=0; e.preventDefault(); return; } lastTap=t; }
    if(pts.size===2){ const [a,b]=[...pts.values()];
      g0={d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,s,tx,ty}; }
    try{ wrap.setPointerCapture(e.pointerId); }catch(_){}
  });
  wrap.addEventListener("pointermove",e=>{
    const p=pts.get(e.pointerId); if(!p) return;
    const px=p.x,py=p.y; p.x=e.clientX; p.y=e.clientY;
    if(pts.size>=2&&g0){ const [a,b]=[...pts.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      const r=wrap.getBoundingClientRect();
      s=g0.s; tx=g0.tx+(mx-g0.mx); ty=g0.ty+(my-g0.my);
      zoomAt(g0.s*d/g0.d, g0.mx-r.left, g0.my-r.top);
      moved=true; e.preventDefault(); return; }
    if(pts.size===1&&s>1.01){ tx+=e.clientX-px; ty+=e.clientY-py;
      if(Math.abs(e.clientX-px)+Math.abs(e.clientY-py)>1) moved=true; apply(); e.preventDefault(); }
  });
  // 指をはなしたら「動かした」をすぐ消す(次のタップを飲みこまないように。click はこのあとに来る)
  const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) g0=null; if(!pts.size) setTimeout(()=>{ moved=false; },0); };
  wrap.addEventListener("pointerup",up); wrap.addEventListener("pointercancel",up); wrap.addEventListener("pointerleave",up);
  // 動かしたあとの指はなしを「押した」と数えない(＋−⟲のボタンは別)
  wrap.addEventListener("click",e=>{ if(moved&&!e.target.closest(".zc")){ e.stopPropagation(); e.preventDefault(); } moved=false; },true);
  // パソコン: Ctrl(⌘)+ホイールで拡大縮小。ふつうのホイールはページのスクロールのまま
  wrap.addEventListener("wheel",e=>{ if(!e.ctrlKey&&!e.metaKey) return; e.preventDefault();
    const [cx,cy]=rel(e); zoomAt(s*(e.deltaY<0?1.12:1/1.12),cx,cy); },{passive:false});

  // ボタンは地図の「下」に出す(地図の上に置くと、沖縄などの表示にかぶるため)
  const zc=document.createElement("div"); zc.className="zc";
  zc.innerHTML='<span class="zt">'+(o.hint||"🔍 2本指でひろげると大きくなります")+'</span>'
    +'<button type="button" data-zin aria-label="大きくする">＋</button>'
    +'<button type="button" data-zout aria-label="小さくする">−</button>'
    +'<button type="button" class="zre" data-zre aria-label="元の大きさにもどす">元の大きさ</button>';
  (o.into||wrap.parentNode).insertBefore(zc, o.into?null:wrap.nextSibling);
  ZC=zc;
  zc.querySelector("[data-zin]").onclick=()=>zoomAt(s*1.5,wrap.clientWidth/2,wrap.clientHeight/2);
  zc.querySelector("[data-zout]").onclick=()=>zoomAt(s/1.5,wrap.clientWidth/2,wrap.clientHeight/2);
  zc.querySelector("[data-zre]").onclick=reset;
  apply();
  return {reset,zoomAt,get scale(){return s;}};
}

// ===== 捜査ボード(コルク板の上で、ニュースを赤い糸でつなぐ。自分のメモと糸も貼れる) =====

function renderBoard(recentDays){

  const JP=[0,139.75,36.2,"日本"]; const G={}; const inJP=pp=>pp[1]>122&&pp[1]<147&&pp[2]>24&&pp[2]<46; const isJ=BD.area==="japan";

    const proj=isJ?d3.geoMercator().fitExtent([[30,30],[BW-30,BH-30]],{type:"MultiPoint",coordinates:[[123.5,24],[146,45.6]]}):d3.geoNaturalEarth1().fitExtent([[20,20],[BW-20,BH-20]],{type:"Sphere"}); const path=d3.geoPath(proj);
    const notes=groups.map(g=>{ const [x,y]=proj([g.p[1],g.p[2]]); return {id:"p:"+g.p[3],g,px:x,py:y,x:x-66,y:y-100,w:140,h:88}; });
    for(let it=0;it<300;it++){ notes.forEach((a,i)=>notes.forEach((b,j)=>{ if(i>=j) return; const dx=(a.x+a.w/2)-(b.x+b.w/2), dy=(a.y+a.h/2)-(b.y+b.h/2); const ox=(a.w+18)-Math.abs(dx), oy=(a.h+22)-Math.abs(dy); if(ox>0&&oy>0){ if(ox<oy){ const m=(dx>=0?1:-1)*ox/2; a.x+=m; b.x-=m; } else { const m=(dy>=0?1:-1)*oy/2; a.y+=m; b.y-=m; } } }));
      notes.forEach(a=>{ a.x=Math.max(8,Math.min(BW-a.w-8,a.x)); a.y=Math.max(14,Math.min(BH-a.h-8,a.y)); }); }
    const auto=[]; for(let i=0;i<notes.length;i++) for(let j=i+1;j<notes.length;j++){ const sh=[...notes[i].g.th].filter(t=>notes[j].g.th.has(t)); if(sh.length) auto.push({a:notes[i].id,b:notes[j].id,t:sh[0]}); }
    if(isJ){ for(let i=0;i<notes.length;i++) for(let j=i+1;j<notes.length;j++){ if(auto.some(e=>(e.a===notes[i].id&&e.b===notes[j].id))) continue; const gi=new Set(notes[i].g.list.map(n=>n.g)); const sg=[...new Set(notes[j].g.list.map(n=>n.g))].find(g=>gi.has(g)); if(sg) auto.push({a:notes[i].id,b:notes[j].id,t:GN[sg],weak:1}); } }
    const jp=isJ?null:notes.find(n=>n.g.p[3]==="日本");
    if(jp) notes.forEach(n=>{ if(n===jp) return; [...n.g.th].forEach(T=>{ if(auto.some(e=>[e.a,e.b].includes(n.id)&&[e.a,e.b].includes(jp.id))) return;
      const ex=Object.values(D.explainers).find(e=>gdScore(gdQuery(T),e.name+" "+(e.now||"")+" "+e.kid)>=0.5); if(ex&&(ex.flow||[]).some(f=>/日本|暮らし|ガソリン|家計/.test(f.t))) auto.push({a:n.id,b:jp.id,t:T+"→日本"}); }); });
    const all=()=>[...notes, ...B.notes.map(u=>({id:u.id,u,x:u.x,y:u.y,w:130,h:78}))];
    const find=id=>all().find(n=>n.id===id);

    const sag=(x1,y1,x2,y2)=>{ const mx=(x1+x2)/2,my=(y1+y2)/2+Math.min(70,Math.hypot(x2-x1,y2-y1)*.14); return {d:`M${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`,lx:(x1+2*mx+x2)/4,ly:(y1+2*my+y2)/4}; };
    function drawStrings(){ const svg=bd.querySelector(".bd-str"); const L=[...auto.map(e=>({...e,k:"auto"})),...B.links.map((e,i)=>({...e,k:"mine",i}))];
      svg.innerHTML=L.map(e=>{ const A=find(e.a),Bn=find(e.b); if(!A||!Bn) return ""; const [x1,y1]=ctr(A),[x2,y2]=ctr(Bn); const q=sag(x1,y1,x2,y2); const hot=BD.sel&&(e.a===BD.sel||e.b===BD.sel); const dim=BD.sel&&!hot;
        return `<g class="str ${e.k}${e.weak?" weak":""}${hot?" hot":""}${dim?" dim":""}"><path d="${q.d}"/>${e.t?`<text x="${q.lx}" y="${q.ly}" text-anchor="middle">${esc(e.t)}</text>`:""}</g>`; }).join(""); }
    function drawNotes(){ const layer=bd.querySelector(".bd-notes");
      layer.innerHTML=notes.map((n,i)=>{ const top=n.g.list[0]; return `<button class="note${BD.sel===n.id?" on":""}" data-id="${esc(n.id)}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px;--tape:var(--g-${top.g});--r:${((i*37)%7)-3}deg"><i class="pinhead"></i><b>${esc(n.g.p[3])}</b><span>${esc(top.h)}</span><small>${n.g.list.length}件${n.g.th.size?" ・ "+esc([...n.g.th][0]):""}</small></button>`; }).join("")
        + B.notes.map(u=>`<div class="note mine${BD.sel===u.id?" on":""}" data-id="${esc(u.id)}" role="button" tabindex="0" style="left:${u.x}px;top:${u.y}px;width:130px;height:78px;--r:${u.r||0}deg"><i class="pinhead blue"></i><span class="mtx">${esc(u.text||"(タップして書く)")}</span><small>あなたのメモ ・ 動かせます</small></div>`).join(""); }
    bd.innerHTML=`<svg class="bd-map" viewBox="0 0 ${BW} ${BH}" width="${BW}" height="${BH}" aria-hidden="true"><g>${(isJ?world.features.filter(f=>["392","410","408","156","643","158"].includes(f.id)):world.features).map(f=>`<path d="${path(f)}"/>`).join("")}</g>${notes.map(n=>`<line x1="${n.px}" y1="${n.py}" x2="${n.x+n.w/2}" y2="${n.y+n.h}" class="tie"/><circle cx="${n.px}" cy="${n.py}" r="4" class="spot"/>`).join("")}</svg>
      <div class="bd-notes"></div><svg class="bd-str" viewBox="0 0 ${BW} ${BH}" width="${BW}" height="${BH}" aria-hidden="true"></svg>`;
    bd.style.width=BW+"px"; bd.style.height=BH+"px";
    const wrap=document.getElementById("bdWrap"), sizer=document.getElementById("bdSizer"), msg=document.getElementById("bdMsg"), det=document.getElementById("bdDetail");
    const BZMIN=0.3, BZMAX=2.2;
    // (ax,ay)=わくの中のどこを動かさずに大きさを変えるか。ふだんは真ん中
    const setZ=(z,ax,ay)=>{ z=Math.max(BZMIN,Math.min(BZMAX,z));
      if(ax==null){ ax=wrap.clientWidth/2; ay=wrap.clientHeight/2; }
      const cx=(wrap.scrollLeft+ax)/BD.z, cy=(wrap.scrollTop+ay)/BD.z;
      BD.z=z; bd.style.transform=`scale(${z})`; sizer.style.width=BW*z+"px"; sizer.style.height=BH*z+"px";
      wrap.scrollLeft=cx*z-ax; wrap.scrollTop=cy*z-ay;
      document.querySelectorAll("#bdTools [data-z]").forEach(b=>b.setAttribute("aria-pressed",String(Math.abs(+b.dataset.z-z)<.02))); };
    document.querySelectorAll("#bdTools [data-z]").forEach(b=>b.onclick=()=>setZ(+b.dataset.z));
    // 2本指でひろげる/つまむ(メモを指で動かすのとぶつからないよう、2本指のときだけ)
    (()=>{ const pts=new Map(); let g0=null;
      wrap.addEventListener("pointerdown",e=>{ pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
        if(pts.size===2){ const [a,b]=[...pts.values()]; const r=wrap.getBoundingClientRect();
          g0={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:BD.z,ax:(a.x+b.x)/2-r.left,ay:(a.y+b.y)/2-r.top}; } },{passive:true});
      wrap.addEventListener("pointermove",e=>{ const p=pts.get(e.pointerId); if(!p) return; p.x=e.clientX; p.y=e.clientY;
        if(pts.size>=2&&g0){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
          setZ(g0.z*d/g0.d,g0.ax,g0.ay); e.preventDefault(); } },{passive:false});
      const up=e=>{ pts.delete(e.pointerId); if(pts.size<2) g0=null; };
      wrap.addEventListener("pointerup",up); wrap.addEventListener("pointercancel",up); wrap.addEventListener("pointerleave",up);
      wrap.addEventListener("wheel",e=>{ if(!e.ctrlKey&&!e.metaKey) return; e.preventDefault(); const r=wrap.getBoundingClientRect();
        setZ(BD.z*(e.deltaY<0?1.12:1/1.12), e.clientX-r.left, e.clientY-r.top); },{passive:false});
      })(); // 大きさのボタンは上の「小・中・大」がそのまま使える(ボタンを増やさない)

    function centerOn(n){ wrap.scrollTo({left:(n.x+n.w/2)*BD.z-wrap.clientWidth/2, top:(n.y+n.h/2)*BD.z-wrap.clientHeight/2, behavior:"smooth"}); }

      else { det.innerHTML=`<div class="bd-card"><b>📝 あなたのメモ</b><textarea class="memo" id="bdTxt" rows="3" maxlength="120" placeholder="気づいたこと・つながりそうなこと">${esc(n.u.text||"")}</textarea>${linkHTML}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="fchip" data-linkfrom="${esc(n.id)}">🧵 ここから糸を引く</button><button class="fchip" id="bdDel">🗑 はがす</button><button class="fchip" data-clear="1">✕ とじる</button></div></div>`;
        const t=document.getElementById("bdTxt"); t.oninput=()=>{ n.u.text=t.value.slice(0,120); saveMe(); const el=bd.querySelector(`[data-id="${CSS.escape(n.id)}"] .mtx`); if(el) el.textContent=n.u.text||"(タップして書く)"; };
        document.getElementById("bdDel").onclick=()=>{ B.notes=B.notes.filter(x=>x.id!==n.id); B.links=B.links.filter(e=>e.a!==n.id&&e.b!==n.id); saveMe(); BD.sel=null; show(); }; }
      det.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ BD.sel=b.dataset.go; show(); centerOn(find(BD.sel)); });
      det.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{ BD.sel=null; show(); });
      det.querySelectorAll("[data-linkfrom]").forEach(b=>b.onclick=()=>{ BD.mode="link"; BD.from=b.dataset.linkfrom; msg.innerHTML="🧵 つなぎたいメモをタップしてね <button class=\"fchip\" id=\"bdCancel\">やめる</button>"; msg.classList.add("on"); document.getElementById("bdCancel").onclick=endLink; }); }
    function endLink(){ BD.mode=""; BD.from=null; msg.classList.remove("on"); msg.textContent="メモをタップすると、その糸が光ります。"; }
    function tapNote(id){ if(BD.mode==="link"){ if(!BD.from){ BD.from=id; msg.innerHTML="🧵 つぎに、つなぎたい相手のメモをタップ <button class=\"fchip\" id=\"bdCancel\">やめる</button>"; document.getElementById("bdCancel").onclick=endLink; return; }
        if(BD.from!==id && !B.links.some(e=>(e.a===BD.from&&e.b===id)||(e.a===id&&e.b===BD.from))){ B.links.push({a:BD.from,b:id}); saveMe(); toast("🧵 糸でつなぎました"); } endLink(); BD.sel=id; show(); return; }

    function bindNotes(){ bd.querySelectorAll(".note").forEach(el=>{ const id=el.dataset.id; const u=B.notes.find(x=>x.id===id);

      el.onkeydown=e=>{ if(e.key==="Enter") tapNote(id); }; }); }
    document.getElementById("bdAdd").onclick=()=>{ const x=Math.max(4,Math.min(BW-134,(wrap.scrollLeft+wrap.clientWidth/2)/BD.z-65)), y=Math.max(14,Math.min(BH-82,(wrap.scrollTop+wrap.clientHeight/2)/BD.z-39));
      const u={id:"u:"+Date.now().toString(36),x,y,text:"",r:Math.round(Math.random()*6-3)}; B.notes.push(u); saveMe(); BD.sel=u.id; show(); setTimeout(()=>{ const t=document.getElementById("bdTxt"); if(t) t.focus(); },50); };
    document.getElementById("bdLink").onclick=()=>{ if(BD.mode==="link"){ endLink(); return; } BD.mode="link"; BD.from=null; msg.innerHTML="🧵 つなぎたいメモを2つ、順にタップしてね <button class=\"fchip\" id=\"bdCancel\">やめる</button>"; msg.classList.add("on"); document.getElementById("bdCancel").onclick=endLink; };

    const petEl=document.getElementById("bdPet"); let hintI=0;

    RT.lt=setTimeout(()=>{ loadAlerts().then(()=>{ if(m.code===552){ if(AL.tsunami) toast("🌊 津波の情報が届きました(気象庁発表)"); return; }

    (j.features||[]).forEach(f=>{ const c=(f.geometry||{}).coordinates; if(!c) return; const pr=f.properties||{}; all.push({name:pr.name||pr["名称"]||"避難場所",addr:pr.address||pr["住所"]||"",la:c[1],lo:c[0]}); }); }));
