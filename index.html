<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* 朝の掲示板: 1列のカード紙面 + 下のタブ。重要な数字だけ太い見出し書体で */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#141b2d; --muted:#5a6478; --line:#d9dee6;
  --accent:#2747c9; --accent-soft:#e3e8fb; --warn:#c2410c; --warn-soft:#fdeee6; --ok:#15803d; --ok-soft:#e5f4ea;
  --g-pol:#2563c9; --g-eco:#17803f; --g-soc:#c25a0c; --g-it:#7c3aed; --g-intl:#c42b2b; --g-spo:#8a5a2b; --g-ent:#c0367a; --g-pred:#475569;
  --g-pol-s:#e4ecfa; --g-eco-s:#e4f3e9; --g-soc-s:#fbeadb; --g-it-s:#efe7fd; --g-intl-s:#fbe5e5; --g-spo-s:#f3eadf; --g-ent-s:#fbe4ef; --g-pred-s:#e9edf2;
  --g-fas:#c026a3; --g-sci:#52677d; --g-home:#8a6416; --g-food:#d0451b; --g-life:#0e7490; --g-trip:#4f46e5;
  --g-fas-s:#f9e0f4; --g-sci-s:#e3eaf1; --g-home-s:#f4ead3; --g-food-s:#fbe3d8; --g-life-s:#d8eff5; --g-trip-s:#e4e3fc;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --fs:16px; --radius:14px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#171d2c; --surface2:#1d2436; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2a3247;
  --accent:#8ea4ff; --accent-soft:#232c4d; --warn:#fb923c; --warn-soft:#3a2416; --ok:#4ade80; --ok-soft:#163222;
  --g-pol:#7aa7ff; --g-eco:#5fd18a; --g-soc:#f59e5b; --g-it:#b794ff; --g-intl:#ff7b7b; --g-spo:#d6a46e; --g-ent:#ff8cc0; --g-pred:#a3b0c2;
  --on-accent:#0b1020; --g-pol-s:#1b2a48; --g-eco-s:#16301f; --g-soc-s:#352314; --g-it-s:#2a1f45; --g-intl-s:#3a1a1d; --g-spo-s:#33271b; --g-ent-s:#3b1a2b; --g-pred-s:#232a36;
  --g-fas:#f07ad8; --g-sci:#9fb6cc; --g-home:#e0b860; --g-food:#ff9573; --g-life:#67d3ec; --g-trip:#a5a1ff;
  --g-fas-s:#3a1636; --g-sci-s:#1f2a36; --g-home-s:#33291a; --g-food-s:#3a1d14; --g-life-s:#12303a; --g-trip-s:#24224a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171d2c; --surface2:#1d2436; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2a3247;
  --accent:#8ea4ff; --accent-soft:#232c4d; --warn:#fb923c; --warn-soft:#3a2416; --ok:#4ade80; --ok-soft:#163222;
  --g-pol:#7aa7ff; --g-eco:#5fd18a; --g-soc:#f59e5b; --g-it:#b794ff; --g-intl:#ff7b7b; --g-spo:#d6a46e; --g-ent:#ff8cc0; --g-pred:#a3b0c2;
  --on-accent:#0b1020; --g-pol-s:#1b2a48; --g-eco-s:#16301f; --g-soc-s:#352314; --g-it-s:#2a1f45; --g-intl-s:#3a1a1d; --g-spo-s:#33271b; --g-ent-s:#3b1a2b; --g-pred-s:#232a36;
  --g-fas:#f07ad8; --g-sci:#9fb6cc; --g-home:#e0b860; --g-food:#ff9573; --g-life:#67d3ec; --g-trip:#a5a1ff;
  --g-fas-s:#3a1636; --g-sci-s:#1f2a36; --g-home-s:#33291a; --g-food-s:#3a1d14; --g-life-s:#12303a; --g-trip-s:#24224a;
  color-scheme:dark}
:root[data-size="l"]{--fs:18px} :root[data-size="xl"]{--fs:20px} :root[data-size="xxl"]{--fs:23px}
*{box-sizing:border-box}
/* ボタン・札・見出しは、ことばの途中で折り返さない(「1本ガ/チャ」「読み上/げ」のようにならない)。折り返すのは空白のところだけ。それでも入らないときだけ、ことばの途中で折る(2026-10-27) */
.seg button,.fchip,.chip,.sub,.jmp,.sbtn,.iconbtn,.tabs button,.ttl,.wx-sky,[class^="res-"],[class*=" res-"]{word-break:keep-all;overflow-wrap:break-word}
.fchip,.chip,.jmp{max-width:100%}
[hidden]{display:none!important}
body{margin:0}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)} /* rem で書いた文字も「文字の大きさ」の設定で大きくなるように(2026-10-27) */
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.7;margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{line-height:1.35;margin:0;word-break:auto-phrase;text-wrap:pretty;line-break:strict}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:16px 0 0 var(--g-intl),32px 0 0 var(--g-eco);margin-right:34px}
.top .upd{font-size:.84rem;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-width:40px;height:40px;cursor:pointer;font-size:.9rem;padding:0 10px;white-space:nowrap;flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-block:6px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.82rem;min-width:0}
.tab .ti{font-size:1.25rem;line-height:1}
.tabs .wrap[data-n="5"] .tab,.tabs .wrap[data-n="4"] .tab,.tabs .wrap[data-n="3"] .tab{font-size:.88rem;font-weight:700;padding:7px 0}.tabs .wrap[data-n="5"] .tab .ti,.tabs .wrap[data-n="4"] .tab .ti{font-size:1.45rem}
.tab[aria-selected="true"]{color:var(--accent-ink,var(--accent));background:var(--accent-soft);font-weight:700}
@media (min-width:900px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);z-index:19}
  .tab{flex-direction:row;justify-content:center;gap:6px;font-size:.88rem}
  .tab .ti{font-size:1rem}
}

main{padding-block:18px 32px}
.view{display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;justify-content:space-between}
.sec-h h2{font-size:1.2rem}
.sec-h .sub{font-size:.86rem;color:var(--muted)}
.hint{font-size:.88rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;background:var(--g-pred-s);color:var(--g-pred-t,var(--g-pred))}
.chip.pol{background:var(--g-pol-s);color:var(--g-pol-t,var(--g-pol))} .chip.eco{background:var(--g-eco-s);color:var(--g-eco-t,var(--g-eco))} .chip.soc{background:var(--g-soc-s);color:var(--g-soc-t,var(--g-soc))}
.chip.it{background:var(--g-it-s);color:var(--g-it-t,var(--g-it))} .chip.intl{background:var(--g-intl-s);color:var(--g-intl-t,var(--g-intl))} .chip.spo{background:var(--g-spo-s);color:var(--g-spo-t,var(--g-spo))} .chip.ent{background:var(--g-ent-s);color:var(--g-ent-t,var(--g-ent))}
.chip.fas{background:var(--g-fas-s);color:var(--g-fas-t,var(--g-fas))} .chip.sci{background:var(--g-sci-s);color:var(--g-sci-t,var(--g-sci))} .chip.home{background:var(--g-home-s);color:var(--g-home-t,var(--g-home))} .chip.food{background:var(--g-food-s);color:var(--g-food-t,var(--g-food))} .chip.life{background:var(--g-life-s);color:var(--g-life-t,var(--g-life))} .chip.trip{background:var(--g-trip-s);color:var(--g-trip-t,var(--g-trip))}
.badge-ok{color:var(--ok);font-size:.84rem;font-weight:700;white-space:nowrap}
.badge-one{color:var(--warn);font-size:.84rem;font-weight:700;white-space:nowrap}

/* hero row */
.hero{display:grid;grid-template-columns:1fr;gap:12px}
.hero2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.play.sm{padding:10px 12px;gap:10px}.play.sm .pi{width:34px;height:34px;font-size:1rem}.play.sm b{font-size:1rem}
.play.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.play.alt .pi{background:var(--accent-soft)}
.play{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;border-radius:var(--radius);padding:16px 18px;background:var(--accent-btn,var(--accent));color:var(--on-accent)}
.play .pi{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.2rem;flex:none}
.play b{display:block;font-size:1.08rem;color:inherit}
.play span{color:inherit}
.play span{font-size:.88rem;opacity:.9}

/* 天気(いちばん上にコンパクトに) */
.wx{display:flex;flex-direction:column;gap:8px}
.wx .wx-more{display:none}.wx.open .wx-more{display:flex;flex-direction:column;gap:8px}
.wx-sum{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.wx-tg{align-self:flex-start}
.wm-svg{display:block;width:100%;height:auto}
/* 指で拡大縮小・移動できる入れもの */
.zwrap{position:relative;overflow:hidden;touch-action:pan-y}
.zwrap.zoomed{touch-action:none;cursor:grab}
.zwrap > .zin{transform-origin:50% 50%;will-change:transform}
.zc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.zc .zt{font-size:.82rem;color:var(--muted);flex:1;min-width:120px}
.zc button{min-width:42px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zc button.zre{font-size:.86rem}
.zc button[disabled]{opacity:.4;cursor:default}
.wx-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.wx-ic{font-size:2.6rem;line-height:1}
.wx-place{font-size:.88rem;color:var(--muted);font-weight:700}
.wx-sky{font-size:1.2rem;font-weight:800;line-height:1.3}
.wx-t{text-align:right;line-height:1.1}.wx-t b{display:block;font-size:min(2rem,38px);color:#e5484d}.wx-t span{font-size:1.1rem;color:#3b82f6;font-weight:700}
.wx-um{font-weight:700;font-size:1.02rem;background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.wx-kit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.92rem}
.wx-kit b{font-weight:800}
.badge-ok.tap,.badge-one.tap{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;min-height:40px;padding:0 6px;margin:-8px 0}
.ten.short li>button>span>p,.ten.short .srcl,.ten.short .pt,.ten.short .ill,.ten.short .enb{display:none}
/* 「短く」= 見出しの1行の表(写真・送る行は「くわしく」のときだけ)。1件 約200px → 約80px */
.ten.short{gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.ten.short li{border:0;border-radius:0;border-top:1px solid var(--line);background:none}
.ten.short li:first-child{border-top:0}
.ten.short .row{padding:8px 12px 8px 10px;gap:8px;grid-template-columns:26px 1fr!important}
.ten.short .th,.ten.short .ten-ft,.ten.short .th-cr{display:none!important}
.ten.fy.short .row{grid-template-columns:1fr!important;display:block}.ten.fy.short .row p{display:none}
.ten.short .rank{font-size:1rem}
.ten.short .meta{margin-bottom:0;gap:6px}
.ten.short .meta .chip{font-size:.82rem;padding:1px 7px}
.ten.short h3{font-size:1rem;line-height:1.45}
.ten .tl-s{display:none}.ten.short .tl-s{display:inline}.ten.short h3:has(.tl-s) .tl-long{display:none}
.ten.short li:not(.exp) h3:not(:has(.tl-s)){display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.ten.short li.exp h3 .tl-long{display:inline}.ten.short li.exp h3 .tl-s{display:none}
.ten h3{word-break:normal}
.ten.short li.w2 .row{padding-top:8px;padding-bottom:8px}
.ten.short li.big h3{font-size:1.05rem}
.ten.short li.mytown{border-left:4px solid var(--accent)}
.ten.short li{position:relative}.ten.short .row{padding-right:50px!important}
.len-seg{margin-left:auto}
.badge-info{display:inline-flex;align-items:center;gap:2px;font-size:.82rem;font-weight:800;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:0 8px}
.set-toc{margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.set-toc-l{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.set-toc:empty{display:none}
[id^="setsec"]{scroll-margin-top:84px}
.pin-t{display:none}
:root[data-mode="easy"] .pin-btn.abs{width:52px!important;height:52px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border-radius:12px!important;opacity:1;background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important;top:8px!important;right:8px!important}
:root[data-mode="easy"] .pin-btn.abs .pin-t{display:block;font-size:.82rem;font-weight:700;line-height:1.1}
:root[data-mode="easy"] .ten.short .row{padding-right:66px!important}
:root[data-mode="easy"] .ten .row:has(> .th){padding-right:14px}
:root[data-mode="easy"] .linkish{display:inline-flex;align-items:center;min-height:44px}
:root[data-mode="easy"] .wx-notes>summary,:root[data-mode="easy"] details.faq>summary,:root[data-mode="easy"] .cd-i,:root[data-mode="easy"] .season-card button,:root[data-mode="easy"] .fw-h{min-height:44px}
:root[data-mode="easy"] .wx-notes>summary,:root[data-mode="easy"] .cd-i,:root[data-mode="easy"] .fw-h{display:flex;align-items:center}
.top::after,.tabs::after{transition:opacity .2s}
:root.scrolled .top::after,:root.scrolled .tabs::after{opacity:0!important}
/* 季節の飾りの帯: パソコン幅ではタブがヘッダーの下に並ぶので、帯はタブの下に出す(タブに重ならないように) */
.tabs::after{display:none}
@media (min-width:900px){.top::after{display:none}.tabs::after{display:block}}
.fw-h{color:var(--accent-on-surface,var(--accent))!important;font-weight:800}
.fw-h::after{content:" ›"}
.wk5-l{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.wk5-f{display:flex;flex-direction:column;gap:4px;margin-top:4px;padding-left:10px;border-left:3px solid var(--accent-soft)}
.wk5-f span{line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.wk5-f i{font-style:normal;font-weight:800;font-size:.85rem;color:var(--muted);margin-right:6px}
.chip.me-rel{background:#fff1c2;color:#6b4a00;font-weight:800}
:root[data-theme="dark"] .chip.me-rel{background:#4a3a0c;color:#ffe08a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.me-rel{background:#4a3a0c;color:#ffe08a}}
.linkish{border:0;background:none;padding:0;color:inherit;font-weight:800;text-decoration:underline;font:inherit;font-weight:800;cursor:pointer}
.lf-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lf-g .tpk{min-height:64px}
.away{border:2px solid var(--accent);}
.aw-l{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;line-height:1.55}.aw-l i{font-style:normal;font-weight:800;color:var(--muted);margin-right:6px;font-size:.88rem}.aw-l b{font-weight:600;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.aw-l small{display:block;color:var(--muted);font-size:.85rem}
.aw-b{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.cd-c{padding:10px 12px}.cd-t{display:block;font-size:.95rem;margin-bottom:6px}.cd-row{display:flex;flex-direction:column;gap:6px}
.cd-i{display:flex;gap:10px;align-items:center;border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.cd-i b{flex:none;min-width:4.6em;text-align:center;padding:4px 6px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink,var(--accent));font-size:.95rem}
.cd-i span{line-height:1.5}
.cd-g{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cd-g li{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface2)}
.cd-g li>b{font-size:1.6rem;color:var(--accent-on-surface,var(--accent))}.cd-g li>small{margin-left:2px;font-weight:700}.cd-g li>span{display:block;font-size:.88rem;line-height:1.45;margin-top:2px}
.wd-gl{display:none;font-size:7px;font-weight:800;fill:#fff;pointer-events:none}
:root[data-cvd="1"] .wd-gl{display:inline}
:root[data-cvd="1"] .wd-e{r:6}
.wd-dot{color:#fff;font-size:9px;font-weight:800;text-align:center;line-height:12px;font-style:normal}

.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip[aria-pressed="true"] b,.fchip[aria-pressed="true"] .num,.fchip[aria-pressed="true"] small,.fchip[aria-pressed="true"] i{color:inherit}
.fchip .c{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.hist{display:flex;align-items:flex-end;gap:2px;height:46px;padding-top:4px}
.hist i{flex:1;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;min-height:2px}
.hist-l{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:14px}
.day h3{font-size:.9rem;color:var(--muted);margin-bottom:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);background:var(--bg);padding-block:4px;z-index:2}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .h{font-weight:700;font-size:.97rem}
.item .s{font-size:.84rem;color:var(--muted);margin-top:2px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
mark{background:#ffe066;color:#141b2d;border-radius:3px;padding:0 1px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.quick button{flex:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* personal */
:root{--map-sea:#dce8f3;--map-land:#f4f1ea;--map-jp:#fff;--map-line:#b9c4d2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--map-sea:#0f1a2c;--map-land:#26304a;--map-jp:#3a4766;--map-line:#41507a}}
:root[data-theme="dark"]{--map-sea:#0f1a2c;--map-land:#26304a;--map-jp:#3a4766;--map-line:#41507a}
.me-strip{display:flex;gap:6px;flex-wrap:wrap}
.ms{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;min-width:0;font-size:.88rem;line-height:1.2;color:var(--ink)}
.ms b{font-size:.95rem}
.ms .mi{font-size:1.35rem}
.ms.new{border-color:var(--accent);background:var(--accent-soft)}
.newchip{background:var(--accent-soft);color:var(--accent-ink,var(--accent))}
.result{border-color:var(--ok);background:var(--ok-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(76px + env(safe-area-inset-top,0px));bottom:auto;z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .4s ease both;max-width:calc(100% - 32px);text-align:center}
.toast.out{opacity:0;transition:opacity .5s}
/* かんたんモード: ボタンに言葉・押しやすく */
.listen-big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;border-radius:var(--radius);padding:14px 16px;background:var(--accent-btn,var(--accent));color:var(--on-accent)}
.listen-big .li{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.5rem;flex:none}
.listen-big b{display:block;font-size:1.15rem}.listen-big small{display:block;font-size:.88rem;opacity:.92}
.listen-big.on{background:#c62828}
:root[data-mode="easy"] .gd-fab{width:auto;border-radius:999px;padding:0 18px;font-size:1.05rem;font-weight:800;gap:6px}
:root[data-mode="easy"] .gd-fab::after{content:"しつもん";font-size:1rem}
:root[data-mode="easy"] .fchip{min-height:44px}
:root[data-mode="easy"] .lang-seg{display:none}
:root[data-mode="easy"] .ten .pt{display:none}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-c{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--surface);color:var(--ink);cursor:pointer}
.mode-c b{font-size:1.1rem}.mode-c small{font-size:.86rem;color:var(--muted);line-height:1.5}.mode-c .mi{font-size:1.8rem}
.mode-c[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.tabprev{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;margin:8px 0}
.tabprev span{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.82rem;font-weight:700;padding:4px 0;border-radius:10px}
.tabprev span i{font-style:normal;font-size:1.3rem}
.tabpick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tabpick li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tabpick li.off{opacity:.55}
.tabpick .nm{flex:1;font-weight:700}
.tabpick .tg{min-width:84px;min-height:40px;border-radius:999px;border:2px solid var(--accent);background:var(--accent-btn,var(--accent));color:var(--on-accent);font-weight:800;cursor:pointer}
.tabpick li.off .tg{background:var(--surface);color:var(--accent)}
.tabpick .mv{min-width:44px;min-height:40px;white-space:nowrap}

.jump{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jmp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:700;font-size:.9rem;cursor:pointer}.jmp span{font-size:1.4rem}
.srcl{display:block;font-size:.84rem;color:var(--muted);margin-top:4px}
.kw-chips .fchip b{color:var(--accent)}
.kw-new{font-size:.82rem}
.kw-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.kw-list li{border-top:1px solid var(--line);padding-top:8px;line-height:1.5}
.kw-list mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.kw-add{display:flex;gap:6px;margin-top:10px}
.kw-add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--surface);color:var(--ink);font-size:1rem}
.kw-edit{margin-top:8px}
.pk-tabs{margin-top:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.pk-tabs .fchip{flex:none;white-space:nowrap}
.pk-empty{margin:8px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.pk-ed{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.pk-ttl{font-size:1rem;margin:10px 0 0}
.pk-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.pk-list li{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.5}
.pk-k{margin-right:6px}.pk-n{font-size:1.04rem}
.pk-d{display:block;font-size:.88rem;color:var(--muted);margin-top:2px}
.pk-list p{margin:4px 0 2px;font-size:.95rem}
.wgoal{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.wgoal li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}.wgoal li .tp{grid-column:1/-1}
.wgoal li.ok span:first-child::after{content:" ✅"}
.letter{background:#fffaf0;color:#3a2a14;border:1px solid #ecd9b0;border-radius:12px;padding:12px 14px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;line-height:28px;background-image:repeating-linear-gradient(transparent 0 27px,#f1e3c4 27px 28px)}
.letter p{margin:0}.lt-h{font-weight:800}.lt-f{text-align:right;font-size:.84rem;color:#8a7350}
.ct{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ct-b{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.ct-b span{font-weight:700}.ct-b small{color:var(--muted);font-size:.86rem}
.cont{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qk{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.qk li{display:flex;gap:8px;align-items:flex-start;line-height:1.5}.qk li span{font-size:1.2rem}.qk b{font-size:1.05rem}
.more-btn{display:flex;justify-content:center;width:100%;margin-top:10px;padding:12px;font-weight:700}
/* 4コマでわかる(自作SVG・吹き出しはふつうの文字)。横長のコマで、左にペット・右にホー先生 */
.manga{display:grid;gap:6px;margin-top:8px}
.mg-p{position:relative;display:grid;grid-template-columns:50px 1fr 50px;gap:6px;align-items:end;border:2.5px solid #1d1d1f;border-radius:8px;overflow:hidden;background:#fffdf7;color:#1d1d1f;padding:8px 6px 4px;min-height:96px}
.mg-p .mg-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.55}
.mg-n{position:absolute;left:4px;top:4px;background:#1d1d1f;color:#fff;font-weight:800;font-size:.82rem;border-radius:5px;padding:0 6px;z-index:3}
.mg-cap{position:absolute;right:4px;top:4px;z-index:3;background:#ffe8a3;border:1.5px solid #1d1d1f;font-size:.82rem;font-weight:700;padding:0 6px;border-radius:4px}
.mg-c{position:relative;z-index:1;line-height:0;align-self:end}
.mg-c svg{width:50px;height:auto}
.mg-mark{position:absolute;top:-10px;font-size:1rem;line-height:1;font-style:normal}
.mg-c.l .mg-mark{right:-2px}.mg-c.r .mg-mark{left:-2px}
.mg-mid{position:relative;z-index:2;display:flex;flex-direction:column;gap:6px;padding-top:14px;align-self:center}
.mg-b{position:relative;max-width:94%;background:#fff;border:2px solid #1d1d1f;border-radius:14px;padding:5px 11px;font-size:1.05rem;line-height:1.4;font-weight:800}
.mg-e{align-self:center;font-size:2.4rem;line-height:1.1;letter-spacing:.05em}
.mg-b.l{align-self:flex-start;border-bottom-left-radius:4px}.mg-b.r{align-self:flex-end;border-bottom-right-radius:4px}
.mg-b::after{content:"";position:absolute;bottom:4px;width:9px;height:9px;background:#fff;border:2px solid #1d1d1f;transform:rotate(45deg)}
.mg-b.l::after{left:-6px;border-top:0;border-right:0}.mg-b.r::after{right:-6px;border-bottom:0;border-left:0}
.mg-big{align-self:center;background:#fff;border:2.5px solid #e5484d;color:#c62828;border-radius:8px;padding:2px 12px;font-weight:900;font-size:1.25rem;text-align:center;line-height:1.35;white-space:pre-line;box-shadow:2px 2px 0 #1d1d1f}
.mg-cast{font-size:.84rem;color:var(--muted);margin-top:4px}


/* 地震・津波・特別警報(気象庁発表)の帯 */
#alertBand{padding-top:10px}
.sos-go{width:100%;margin-top:8px;padding:12px;border-radius:14px;border:2px solid var(--g-intl);background:var(--g-intl-s);color:var(--g-intl);font-weight:800;font-size:1.02rem;cursor:pointer}
.sos .sos-b{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.sos .sos-b>summary{cursor:pointer;font-weight:800;font-size:1.06rem;display:flex;gap:8px;align-items:center}
.sos .sos-b p{margin:8px 0 0;line-height:1.75}
.sos .sos-b a{display:block;margin-top:8px;font-weight:700}
.al-band{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-radius:14px;padding:12px 14px;cursor:pointer;color:#fff;background:#c62828;box-shadow:0 4px 14px rgba(198,40,40,.3);font-size:1rem;line-height:1.45}
.al-band.mid{background:#fff4d6;color:#5a3d00;box-shadow:none;border:1px solid #f0c75e}
.al-band .ai{font-size:1.5rem}
.al-band small{display:block;opacity:.9;font-size:.9rem}
.al-band + .al-band{margin-top:8px}
.al-x{background:none;border:0;color:inherit;font-size:1.1rem;padding:6px;cursor:pointer}
:root[data-theme="dark"] .al-band.mid{background:#3a2e10;color:#ffe3a3;border-color:#7a5d1a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .al-band.mid{background:#3a2e10;color:#ffe3a3;border-color:#7a5d1a}}
.qk-list{list-style:none;margin:8px 0 0;padding:0}
.qk-list li{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.qk-s{display:grid;place-items:center;width:58px;height:58px;border-radius:12px;font-weight:800;font-size:1.25rem;background:var(--surface2);color:var(--ink)}
.qk-s small{font-size:.82rem;font-weight:700;display:block;margin-bottom:-4px}
.qk-s.l3{background:#e3f2fd;color:#0d47a1}.qk-s.l4{background:#fff3c4;color:#6b4e00}.qk-s.l5{background:#ffcc80;color:#5d2a00}.qk-s.l6{background:#e53935;color:#fff}.qk-s.l7{background:#7b1fa2;color:#fff}
.qk-links{display:grid;gap:8px;margin-top:10px}
.qk-links a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700}
.qk-links a small{display:block;font-weight:400;color:var(--muted)}
.qk-open{margin-top:8px}

.gd-box{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.gd-on{display:inline-block;margin-left:6px;font-size:.84rem;background:var(--accent-btn,var(--accent));color:#fff;border-radius:999px;padding:1px 8px;vertical-align:middle}
.gd-resume{border-color:var(--accent);font-weight:700}
.gd-bar{display:flex;align-items:center;gap:6px;padding-top:10px}
.gd-bar .gd-resume{flex:1;justify-content:center}
.gd-bar .al-x{color:var(--muted)}
.bak.warn{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bak-st{font-size:.92rem;color:var(--muted)}
.mytabs button{position:relative}
.bak-ta{width:100%;min-height:140px;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:13px/1.4 ui-monospace,monospace;word-break:break-all;box-sizing:border-box}
.lvrow{display:flex;gap:14px;align-items:center}
.lvbig{font-family:var(--f-display);font-size:2rem;color:var(--accent)}
.lvcard .bar{height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.lvcard .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 6px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.cal i.on{background:var(--ok);border-color:var(--ok)}
.cal i.today{outline:2px solid var(--accent);outline-offset:1px}
.tiers{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tier{display:flex;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tier .tm{font-size:1.9rem;line-height:1;flex:none;width:2.2rem;text-align:center}
.tier:not(.got) .tm{opacity:.5}
.tier .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tier .tb b{font-size:.98rem}.tier small{font-size:.84rem;color:var(--muted)}
.tlv{display:inline-block;background:var(--accent-btn,var(--accent));color:var(--on-accent);border-radius:999px;padding:0 8px;font-size:.82rem;margin-left:2px}
.tp{display:block;height:6px;border-radius:999px;background:var(--line);overflow:hidden}.tp i{display:block;height:100%;background:var(--accent);border-radius:999px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;background:var(--surface2);filter:grayscale(1);opacity:.45;text-align:center}
.bd span{font-size:1.6rem}.bd small{font-size:.82rem}
.bd.got{filter:none;opacity:1;background:var(--accent-soft)}
.vote{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.ics{margin-top:6px;font-size:.84rem;padding:3px 10px}
.mapbox{padding:8px}
.mapsvg{max-width:430px;margin:0 auto}
.mapsvg svg{display:block;border-radius:10px;width:100%;height:auto}
.pin .pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.35);opacity:.05}}
.photo{margin:0}
.photo img{display:block;width:100%;aspect-ratio:12/6;object-fit:cover;border-radius:var(--radius);background:var(--surface2)}
.photo figcaption{font-size:.82rem;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion: reduce){.pin .pulse{animation:none}}

.lsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.lsum>div{background:var(--surface2);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.lsum b{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask .sbox{border-width:1px}

.ten li,.item{position:relative}
.pin-btn.abs{position:absolute;top:6px;right:6px;z-index:2;border:0;background:transparent;font-size:1.15rem;width:40px;height:40px;border-radius:10px;cursor:pointer;opacity:.55}
.pin-btn.abs[aria-pressed="true"]{opacity:1}
.ten .row,.item{padding-right:44px}
.pins{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pinitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.pinitem .h{font-weight:700}
.memo{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}

/* install */
.install{display:grid;grid-template-columns:48px 1fr;gap:10px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.install img{width:48px;height:48px;border-radius:12px}
.install b{display:block}
.install .hint{display:block}
.offline{background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:.88rem}

/* illustrations */
.ill{border-radius:var(--radius);overflow:hidden;aspect-ratio:12/5;max-width:100%;border:1px solid var(--line)}
.excard .ico.ill{aspect-ratio:auto;width:56px;height:56px;border-radius:14px}
.ten .big .ill{margin:0 0 10px;aspect-ratio:12/4}
.story .ill{border:0;border-radius:16px;max-height:30vh}
.credit{font-size:.82rem;color:var(--muted);margin-top:4px}

/* quiz */
.quiz .qq{font-weight:700;font-size:1.02rem;margin:4px 0 10px}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz .opt{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;cursor:pointer;font-weight:700;text-align:center}
.quiz .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz .opt.wrong{border-color:var(--g-intl);background:var(--g-intl-s)}
.quiz .exp{margin-top:10px;font-size:.92rem;background:var(--surface2);border-radius:10px;padding:8px 12px}
.quiz .qn{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;color:var(--muted)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.r{background:var(--ok)}.dots i.w{background:var(--g-intl)}.dots i.c{outline:2px solid var(--accent)}

/* explainers */
.exgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.exgrid{grid-template-columns:1fr 1fr}}
.excard{display:grid;grid-template-columns:56px 1fr;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;cursor:pointer;align-items:start}
.excard .ico{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;background:var(--surface2)}
.excard h3{font-size:1.02rem}

.tp-bar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}

/* story player */
.story{position:fixed;inset:0;z-index:80;background:#0b1020;color:#f2f4fa;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}

@keyframes drift{from{transform:translate(-6%,-4%) scale(1)}to{transform:translate(6%,5%) scale(1.15)}}

.lg-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.lg-head .lg-av{flex:none;width:72px;height:72px}
.lg-head .lg-av svg{width:100%;height:100%}
.lg-head .lg-say{background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:.95rem;position:relative;flex:1}
.lg-head .lg-say::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:var(--accent-soft);border-left:0}
.lg-pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.lg-pick .fchip[aria-pressed="true"]{background:var(--accent-btn,var(--accent));color:var(--on-accent);border-color:var(--accent-btn,var(--accent))}
.lg-row{border-bottom:1px solid var(--line);padding:10px 0}
.lg-row .lg-ja{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lg-row .lg-ja small{font-weight:400;color:var(--muted);font-size:.82rem}
.lg-row .lg-ja .lg-from{font-weight:600;font-size:.82rem;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 8px}
.lg-tr{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:6px}
.lg-tr .lg-l{font-size:.82rem;color:var(--muted);white-space:nowrap}
.lg-tr .lg-w{font-size:1.05rem;font-weight:700}
.lg-tr .lg-w small{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.lg-tr .lg-sp{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.05rem}
.lg-tr .lg-sp.on{background:var(--accent-btn,var(--accent));color:var(--on-accent);border-color:var(--accent-btn,var(--accent))}
.lg-q{margin-top:12px;padding:12px;border-radius:12px;background:var(--surface2)}
.lg-q .lg-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.lg-q .lg-opts button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:1rem}
.lg-q .lg-opts button.ok{background:var(--g-eco-s);border-color:var(--g-eco)} .lg-q .lg-opts button.ng{background:var(--g-intl-s);border-color:var(--g-intl)}
.lg-av.talk svg{animation:lgtalk .6s ease-in-out 2}
@keyframes lgtalk{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.enlist{list-style:none;margin:0;padding:0}.enlist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
/* はじめての案内 */
.ob{position:fixed;inset:0;z-index:95;background:rgba(10,14,30,.55);display:grid;place-items:center;padding:16px;animation:rise .3s ease both}
.ob-card{background:var(--surface);color:var(--ink);border-radius:20px;max-width:380px;width:100%;padding:20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ob-pet svg{animation:petIdle 2.6s ease-in-out infinite;transform-origin:50% 90%}
.ob-card h2{font-size:1.2rem;margin:6px 0}.ob-card p{text-align:left;margin:0 0 14px}
.ob-dots{display:flex;gap:6px;justify-content:center}.ob-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.ob-dots i.on{background:var(--accent)}
.ob-bt{display:flex;justify-content:space-between;position:sticky;bottom:-20px;margin:8px -20px -20px;padding:10px 20px 20px;background:var(--surface);box-shadow:0 -8px 12px -8px rgba(0,0,0,.18)}
.ob-card{max-height:calc(100vh - 32px);overflow:auto}
.ob-step{font-size:.85rem;color:var(--muted);font-weight:700}
.obp{text-align:left;margin:0 0 12px;font-size:1rem;line-height:1.7}
.ob-bt .fchip{min-height:48px;padding:8px 18px;font-size:1.02rem}.ob-next{font-weight:800}
.ob-card .mode-c{min-height:120px}
.obm{border:2px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;font-size:.88rem;margin-bottom:10px;background:var(--bg)}
.obm-top{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--surface);border-bottom:1px solid var(--line);font-weight:800}.obm-top span:first-child{flex:1}
.obm-b{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.82rem}
.obm-row{display:flex;align-items:center;gap:6px;margin:6px 8px;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-weight:700}
.obm-row.acc{background:var(--accent-btn,var(--accent));color:var(--on-accent)}
.obm-row i,.obl i,.obm-n{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#e5484d;color:#fff;font-size:.82rem;font-weight:800;flex:none}
.obm-tabs{position:relative;display:flex;gap:2px;padding:6px 8px 6px 34px;background:var(--surface);border-top:1px solid var(--line)}
.obm-tabs .obm-n{position:absolute;left:8px;top:50%;margin-top:-11px}
.obm-tabs span{flex:1;display:flex;flex-direction:column;align-items:center;font-size:1.05rem}.obm-tabs small{font-size:.82rem}
.obl{list-style:none;margin:0 0 12px;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.obl li{display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.obh{list-style:none;margin:0 0 10px;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.obh li{display:flex;gap:10px;align-items:center;line-height:1.5}
.obk{flex:none;min-width:84px;text-align:center;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;font-weight:800;background:var(--surface)}

/* 予想ノート・カード・ランキング */
.mp-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:.9rem}.mp-row label{display:flex;align-items:center;gap:6px}
.mp-row input[type=date]{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.mp-row input[type=range]{accent-color:var(--accent)}
.mp-due{margin-top:10px;background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.mp-i{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.mp-b{display:flex;gap:4px;flex:none}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wcard{position:relative;height:134px;border:0;border-radius:12px;padding:0;cursor:pointer;perspective:600px;background:none}
.wcard>span{position:absolute;inset:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;backface-visibility:hidden;transition:transform .45s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.wc-f{background:linear-gradient(150deg,#fff,#e9eef9);color:#1b2340}.wc-f b{font-size:1rem;text-align:center;padding:0 6px}.wc-f small{position:absolute;top:6px;left:8px;font-weight:900;font-size:.82rem}.wc-f i{font-style:normal;color:#f5a400;font-size:.86rem}
.wcard.r2 .wc-f{background:linear-gradient(150deg,#fff,#d8ecff)}.wcard.r3 .wc-f{background:linear-gradient(150deg,#fff7d6,#ffd36b,#ffb0d0);}
.wc-b{background:#1b2340;color:#fff;font-size:.82rem;line-height:1.4;transform:rotateY(180deg);overflow:hidden;justify-content:flex-start;gap:3px;padding:8px 7px;text-align:center}
.wc-b u{font-weight:900;font-size:.84rem;text-decoration:none;opacity:.7;letter-spacing:.02em;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.wc-b .wc-t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.wc-b em{font-style:normal;color:#ffd36b;font-size:.82rem;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.wcard.flip .wc-f{transform:rotateY(180deg)}.wcard.flip .wc-b{transform:rotateY(360deg)}
.rank{list-style:none;margin:0;padding:0}.rank li{display:grid;grid-template-columns:3em 1fr auto;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}.rank li.me{background:var(--accent-soft);border-radius:8px}
/* 横の年表 */
.htl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 0 4px;margin:6px 0}
.htl{display:flex;position:relative;min-width:max-content;padding:0 6px}
.htl::before{content:"";position:absolute;left:0;right:0;top:34px;height:3px;background:var(--accent);opacity:.5}
.htl-i{position:relative;width:132px;flex:none;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:0 6px}
.htl-d{font-weight:800;font-size:.9rem;height:22px;color:var(--accent)}
.htl-dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);z-index:1}
.htl-i.now .htl-dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.htl-i.fut .htl-dot{border-style:dashed;border-color:var(--muted)}.htl-i.fut .htl-d{color:var(--muted)}.htl-i.fut .htl-t{color:var(--muted)}
.htl-t{font-size:.9rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
/* 着せかえ・部屋・日記 */
.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:6px 0}
.wd-i{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;cursor:pointer;color:var(--ink)}
.wd-i small{font-size:.82rem;text-align:center;line-height:1.3}
.wd-i.on{border:2px solid var(--accent);background:var(--accent-soft)}
.wd-i:disabled{opacity:.6;cursor:default}
.wd-svg{height:46px;display:grid;place-items:center}.wd-lock{font-size:1.3rem}
.pet-big{position:relative}.pet-fr{position:absolute;right:calc(50% - 130px);bottom:0}
.room{position:relative;height:190px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.rm-wall{position:absolute;inset:0 0 35% 0;background:linear-gradient(#fde9c8,#f7dcae)}
.rm-floor{position:absolute;inset:65% 0 0 0;background:repeating-linear-gradient(90deg,#c9915a 0 34px,#bf8650 34px 36px)}
.rm-it{position:absolute;font-size:1.5rem;line-height:1}.rm-it.off{opacity:.35;font-size:1rem;color:#8a6a43}
.rm-pet{position:absolute;left:50%;bottom:4px;margin-left:-42px}
.rm-fr{position:absolute;left:calc(50% + 40px);bottom:6px}
.rm-win{position:absolute;right:10px;top:8px;font-size:1.6rem}
.diary{background:#fffdf3;color:#2a2116;border:1px solid #e9dcb6;border-radius:10px;padding:10px 12px;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;background-image:repeating-linear-gradient(transparent 0 27px,#efe4c4 27px 28px)}
.diary p{margin:4px 0}.dy-h{font-weight:800}.dy-h small{font-weight:400;color:#7a6a55}
/* ページのペット */
.mascot{display:flex;align-items:center;gap:8px}
.mascot-av{border:0;background:none;padding:0;cursor:pointer;flex:none}
.mascot-av svg{animation:petIdle 2.6s ease-in-out infinite;transform-origin:50% 90%}
.mascot-b{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:.88rem}
.mascot-b::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--line);border-left:0}
@media (max-width:420px){.top .wrap{gap:6px}.brand{font-size:1rem}.brand .dot{margin-right:30px;width:10px;height:10px;box-shadow:13px 0 0 var(--g-intl),26px 0 0 var(--g-eco)}.top .upd{font-size:.82rem}.top .iconbtn{min-width:36px;height:36px;padding:0 6px}}
/* お知らせ */
.bell{position:relative}
.bell .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px var(--surface)}
.newtag{display:inline-block;background:#e5484d;color:#fff;font-size:.82rem;font-weight:800;border-radius:999px;padding:0 7px;vertical-align:middle}
.upd.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* 捜査ボード */
.bd-pet{display:flex;align-items:center;gap:8px}
.bd-pet-av{border:0;background:none;padding:0;cursor:pointer;flex:none}
.bd-pet-av svg{animation:petIdle 2.6s ease-in-out infinite;transform-origin:50% 90%}
.bd-bubble{position:relative;background:#fffbe8;color:#2a2116;border:2px solid #6b4a2b;border-radius:14px;padding:6px 10px;font-size:.88rem;display:flex;flex-direction:column}
.bd-bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#6b4a2b;border-left:0}
.bd-bubble b{font-size:.84rem;color:#6b4a2b}
.boardbox{padding:10px;display:flex;flex-direction:column;gap:8px}
.board-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:6;background:var(--surface);padding:4px 0}
.bd-msg{font-size:.9rem;color:var(--muted)}
.bd-msg.on{color:var(--ink);background:#fff4c2;border:1px solid #e9cf6a;border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#3a2a00}
.board-wrap{overflow:auto;touch-action:pan-x pan-y;max-height:62vh;border-radius:10px;-webkit-overflow-scrolling:touch;box-shadow:inset 0 0 0 6px #6b4a2b, inset 0 0 18px rgba(0,0,0,.45);overscroll-behavior:contain}
.bd-sizer{position:relative}
.board{position:absolute;left:0;top:0;transform-origin:0 0;background:#c49a62;background-image:radial-gradient(rgba(90,55,20,.35) 1px,transparent 1.6px),radial-gradient(rgba(255,240,210,.25) 1px,transparent 1.8px),radial-gradient(circle at 30% 20%,#d2a96f,#b88a52);background-size:9px 9px,13px 13px,100% 100%;background-position:0 0,4px 6px,0 0}
.bd-map,.bd-str{position:absolute;inset:0;pointer-events:none}
.bd-map path{fill:rgba(90,58,25,.16);stroke:rgba(90,58,25,.28);stroke-width:.6}
.bd-map .tie{stroke:rgba(40,30,20,.45);stroke-width:1;stroke-dasharray:3 3}.bd-map .spot{fill:#8b1d1d}
.bd-str{z-index:3}
.bd-str path{fill:none;stroke:#c1121f;stroke-width:2.6;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));transition:opacity .2s}
.bd-str .weak path{stroke:#7a4a1f;stroke-width:1.6;stroke-dasharray:5 4}.bd-str .weak text{stroke:#5a3410;font-size:10px}
.bd-str .mine path{stroke:#f5c400;stroke-width:3;stroke-dasharray:1 0}
.bd-str text{font-size:12px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#7a0e14;stroke-width:3px}
.bd-str .dim{opacity:.15}.bd-str .hot path{stroke-width:4.2}.bd-str .auto.hot path{stroke:#ff2d3d}
.bd-notes{position:absolute;inset:0;z-index:2}
.bd-notes .note{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;background:#fffbe8;color:#2a2116;border:0;border-top:6px solid var(--tape);border-radius:2px;padding:10px 8px 6px;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;font-size:12px;line-height:1.35;font-family:var(--f-body);transform:rotate(var(--r));overflow:hidden;touch-action:none}
.bd-notes .note b{font-size:13px}.bd-notes .note small{color:#7a6a55;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:auto}
.bd-notes .note span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd-notes .note.mine{background:#fff59d;border-top:0;cursor:grab}
.bd-notes .note.mine .mtx{-webkit-line-clamp:3;font-weight:700}
.bd-notes .note.on{outline:3px solid #ff2d3d;z-index:4;transform:rotate(0) scale(1.06)}
.bd-notes .note.mine.on{outline-color:#1e63d6}
.pinhead{position:absolute;top:-1px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#c1121f 60%,#7a0e14);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.pinhead.blue{background:radial-gradient(circle at 35% 35%,#8ab4ff,#1e63d6 60%,#0d3a85)}
.bd-detail .bd-card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bd-detail .memo{margin-top:6px}
/* 案内係 */
.gd-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
@media (min-width:900px){.gd-fab{bottom:24px}}
.gd-msg{display:flex;flex-direction:column;gap:8px}
.gd-msg.me{align-items:flex-end}
.gd-q{background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:16px 16px 4px 16px;max-width:85%;font-weight:700}
.gd-a{background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:4px 16px 16px 16px;max-width:100%}
.gd-out{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.gd-out:empty{display:none}
.gd-lk{border:0;background:none;color:var(--accent-on-surface,var(--accent));font-weight:700;cursor:pointer;padding:0 2px;font-size:.88rem}
.gd-deep{align-self:flex-start}
.gd-in{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 16px rgba(0,0,0,.12)}
/* 新しい読ませ方(連載・穴うめ・立場・計算機・検定) */
.sr-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sr-chips button:disabled{opacity:.55;cursor:default}
.sr-ttl small{color:var(--muted);font-size:.86rem}.sr-ttl h2{margin:2px 0 8px;font-size:1.3rem}
.sr-body p{margin:0 0 8px;line-height:1.8}
.sr-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0;flex-wrap:wrap}
.sr-wait{font-weight:700;color:var(--muted);font-size:.92rem}
.sr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sr-pick{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:52px;font:inherit}
.sr-pick small{display:block;color:var(--muted);font-size:.84rem}.sr-ic{font-size:1.5rem}
.sr-new{margin-left:auto;font-style:normal;font-size:.82rem;font-weight:700;background:var(--accent-soft);color:var(--accent-ink,var(--accent));border-radius:99px;padding:2px 8px;white-space:nowrap}
.fill-h{font-size:1.12rem;line-height:1.7;letter-spacing:.02em}
.role .role-r{margin-top:8px}.role .role-r b{font-size:.95rem}.role .us{margin-top:4px}
.role-me{font-size:.82rem;background:var(--accent-soft);color:var(--accent-ink,var(--accent));border-radius:99px;padding:1px 8px;margin-left:4px}
.hh-r{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.hh-n{grid-column:1/-1;font-weight:700}
.hh-f{display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--muted)}
.hh-f>span:first-child{min-width:5.6em}
.hh-f input,.hh-f select{flex:1;min-width:0;width:0;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:44px}
.hh-o{grid-column:1/-1;font-weight:700;color:var(--accent-on-surface,var(--accent))}
.hh-o:empty{display:none}
.hh-sum{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:.95rem}
.hh-chip{display:block;width:100%;text-align:left;margin-top:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;font-size:.9rem;min-height:44px}
.hh-chip small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
.kt-lv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kt-b{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface2);display:flex;flex-direction:column;gap:2px}
.kt-b small{font-size:.82rem;color:var(--muted)}
.kt-b.now{border:2px solid var(--accent)}.kt-b.ok{background:var(--ok-soft);border-color:var(--ok)}

const SRC_CACHE={};
function srcOf(n){ const k=n.title; if(k in SRC_CACHE) return SRC_CACHE[k]; let best=null,bs=0; const since=new Date(Date.parse(TODAY)-4*864e5).toISOString().slice(0,10);
  try{ const q=gdQuery(n.title); NEWS.forEach(x=>{ if(x.d<since) return; const sc=gdScore(q,x.h); if(sc>bs){ bs=sc; best=x; } }); }catch(_){}
  if(!best||bs<0.3) return SRC_CACHE[k]=null;
  const outs=[]; String(best.s||"").split(/[、,，]/).forEach(p=>{ let nm=p.replace(/[(（].*$/,"").replace(/\s*\d{1,2}\/\d{1,2}.*$/,"").replace(/\s*\d{1,2}:\d{2}.*$/,"").replace(/\s*\d{1,2}日.*$/,"").trim(); if(nm&&nm.length<=14&&!outs.includes(nm)) outs.push(nm); });
  return SRC_CACHE[k]={d:best.d,outs}; }
function srcLine(n){ const r=srcOf(n); if(!r) return ""; const o=r.outs.slice(0,3).join("・")+(r.outs.length>3?" ほか":""); const rd=relDay(r.d); return `<span class="srcl">🕒 ${/[0-9]/.test(rd)?"":esc(rd)+" "}${esc(mdLabel(r.d))}${o?` ・ ${esc(o)}`:""}</span>`; }

function lastVal(i){ for(let k=D.markets.length-1;k>=0;k--){ if(D.markets[k][i]!=null){ let prev=null; for(let j=k-1;j>=0;j--){ if(D.markets[j][i]!=null){prev=D.markets[j][i];break;} } return {v:D.markets[k][i],d:D.markets[k][0],prev}; } } return null; }
// 大きなお金の数字を「日本に住む1人あたり」に直す(人口は国勢調査の確定値。計算上の目安)
const JP_POP=122970000;
function perPerson(){ try{ const v=String(D.number.value||"").replace(/,/g,"")+String(D.number.unit||"");
    const m=/^([0-9.]+)(兆|億|万)?円/.exec(v); if(!m) return "";
    const unit={"兆":1e12,"億":1e8,"万":1e4}[m[2]]; if(!unit) return "";
    const yen=parseFloat(m[1])*unit; if(!isFinite(yen)||yen<1e9) return "";
    const per=Math.round(yen/JP_POP);
    return `<p class="pp-line">👤 日本に住む1人あたりにすると <b>約${per.toLocaleString("ja-JP")}円</b> <span class="hint">(人口1億2297万人で割った計算上の目安)</span></p>`; }catch(_){ return ""; } }
function marketsMini(){

  const diff=(a,dec)=>{ if(!a||a.prev==null) return ""; const d=a.v-a.prev; const s=(d>=0?"▲":"▼")+Math.abs(d).toLocaleString("ja-JP",{maximumFractionDigits:dec}); return `<span class="${d>=0?'up':'dn'}">${s}</span>`; };

function quizWrongAdd(q){ ME.quizWrong=ME.quizWrong||[]; if(ME.quizWrong.some(x=>x.q===q.q)) return; ME.quizWrong.push({q:q.q,o:q.o,a:q.a,e:q.e,d:TODAY}); ME.quizWrong=ME.quizWrong.slice(-20); saveMe(); }
function drawReview(i){ const box=document.getElementById("quiz"); if(!box) return; const W=ME.quizWrong||[];
  if(!W.length||i>=W.length){ box.innerHTML=`<div class="qn"><span>🔁 まちがえた問題</span></div><div class="qq" style="font-size:1.1rem">${W.length?"ひととおり見ました。":"ぜんぶ正解ずみ! 🎉"}</div><button class="fchip" id="qback" style="margin-top:10px">← 今日のクイズにもどる</button>`; document.getElementById("qback").onclick=()=>{ const sc=+(store.get("nw-quiz-"+D.updated.slice(0,10))||0); drawQuiz(D.quiz.length,D.quiz.map((_,i)=>i<sc)); }; return; }
  const q=W[i];
  box.innerHTML=`<div class="qn"><span>🔁 まちがえた問題 ${i+1}/${W.length}</span><small class="hint">${esc(mdLabel(q.d))}の問題</small></div><div class="qq">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="qexp"></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; const ok=k===q.a;
    box.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.k===q.a) x.classList.add("right"); }); if(!ok) b.classList.add("wrong");

function countUp(el){ const target=parseFloat(el.dataset.count); const dec=(el.dataset.count.split(".")[1]||"").length; const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; if(reduce){el.textContent=target.toFixed(dec);return;} const t0=performance.now(); const f=t=>{const p=Math.min(1,(t-t0)/1400); const e=1-Math.pow(1-p,3); el.textContent=(target*e).toFixed(dec); if(p<1) requestAnimationFrame(f);}; requestAnimationFrame(f); }

const GTERMS = D.glossary.map(w=>({key:w[0].replace(/\(.*?\)/,""),w})).sort((a,b)=>b.key.length-a.key.length);
function glossify(html){
  const used=new Set();
  return html.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,text)=>{ if(tag) return tag; let t=text;
    GTERMS.forEach(({key},i)=>{ if(used.has(key)) return; const idx=t.indexOf(key); if(idx<0) return; used.add(key);
      t=t.slice(0,idx)+`\u0000${i}\u0001`+t.slice(idx+key.length); });
    return t.replace(/\u0000(\d+)\u0001/g,(_,i)=>`<button class="gl" data-gi="${i}">${rubyOn()?rubyHTML(GTERMS[i]):esc(GTERMS[i].key)}</button>`); });
}

// ===== 長い期間のグラフ(history.json: FREDなどから毎日自動で取得) =====
let HIST=null, lsState={s:"nikkei",r:"365"};
async function loadHist(){ if(HIST) return HIST; const r=await fetch("history.json",{cache:"no-cache"}); if(!r.ok) throw new Error("no"); HIST=await r.json(); return HIST; }
function longChart(){

  box.querySelectorAll("#lsRng [data-r]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.r===lsState.r)));
  let chart=null;

    if(lsState.r==="tick"){ drawTicks(); return; }
    loadHist().then(H=>{
      let S=(H.series||{})[lsState.s]; if(!S||!(S.daily||S.monthly)){ const ix={nikkei:1,yen:2,oil:3}[lsState.s]; const own=D.markets.filter(m=>m[ix]!=null).map(m=>[m[0],m[ix]]); if(own.length>=2) S={label:{nikkei:"日経平均株価(終値)",yen:"1ドルあたりの円",oil:"NY原油 WTI"}[lsState.s],unit:{nikkei:"円",yen:"円",oil:"ドル"}[lsState.s],src:"このサイトの記録(長い期間のデータは準備中)",daily:own,monthly:[]}; }

      const useMonthly = (lsState.r==="all" || lsState.r==="1825") && (S.monthly||[]).length>0;
      let rows = ((useMonthly ? S.monthly : S.daily)||[]).slice();
      if(lsState.r!=="all"){ const from=new Date(Date.parse(TODAY)-(+lsState.r)*864e5).toISOString().slice(0,useMonthly?7:10); rows=rows.filter(r=>r[0]>=from); }
      // このサイトで記録した最新の値もつなげる(FREDは数日遅れのため)
      if(!useMonthly){ const idx={nikkei:1,yen:2,oil:3}[lsState.s]; const last=rows.length?rows[rows.length-1][0]:""; D.markets.forEach(m=>{ if(m[idx]!=null && m[0]>last) rows.push([m[0],m[idx]]); }); }
      if(!rows.length){ document.getElementById("lsNote").textContent="この期間のデータがありません。"; return; }
      const first=rows[0][1], lastV=rows[rows.length-1][1], diff=lastV-first, pct=first?diff/first*100:0;
      const hi=rows.reduce((a,r)=>r[1]>a[1]?r:a), lo=rows.reduce((a,r)=>r[1]<a[1]?r:a);
      const f=v=> lsState.s==="nikkei"? Math.round(v).toLocaleString("ja-JP")+"円" : v.toFixed(2)+(S.unit);
      const lab=d=> d.length===7? d.replace("-","/") : `${+d.slice(5,7)}/${+d.slice(8,10)}`;
      document.getElementById("lsSum").innerHTML=`<div><span class="hint">期間の変化</span><b class="${diff>=0?'up':'dn'}" style="font-size:1.1rem">${diff>=0?"▲":"▼"}${Math.abs(pct).toFixed(1)}%</b></div><div><span class="hint">いちばん高い</span><b>${f(hi[1])}</b><small class="hint">${lab(hi[0])}</small></div><div><span class="hint">いちばん安い</span><b>${f(lo[1])}</b><small class="hint">${lab(lo[0])}</small></div>`;
      const col=css({nikkei:"--g-pol",yen:"--g-eco",oil:"--g-soc"}[lsState.s]);
      const cfg={type:"line",data:{labels:rows.map(r=>useMonthly?r[0].replace("-","/"):r[0].slice(5).replace("-","/")),datasets:[{data:rows.map(r=>r[1]),borderColor:col,backgroundColor:col+"22",fill:true,tension:.2,pointRadius:rows.length>60?0:2,pointHoverRadius:6,borderWidth:2}]},
        options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>{const r=rows[c[0].dataIndex][0]; return r.length===7? r.replace("-","年")+"月(月平均)" : r;},label:c=>f(c.raw)}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,autoSkip:true}},y:{grid:{color:css("--line")},ticks:{callback:v=>f(v)}}}}};
      if(chart){ chart.destroy(); } chart=new Chart(document.getElementById("cl"),cfg); charts.push(chart);
      document.getElementById("lsNote").innerHTML=`${esc(S.label)}。${useMonthly?"5年以上は月ごとの平均。":"1日ごとの値。"}出典: ${esc(S.src||"FRED")}・毎日自動で取得(数日遅れることがあります)。いちばん新しい数日はこのサイトの記録でつないでいます。${lsState.s==="yen"?"円の値は取得先の1日の値で、東京の夕方5時の値と少しちがいます。":""}`;
    }).catch(()=>{ document.getElementById("lsNote").textContent="長い期間のデータは準備中です(毎朝7時ごろに自動で取得します)。"; });
  }
  function drawTicks(){
    const note=document.getElementById("lsNote"), sum=document.getElementById("lsSum");
    if(lsState.s!=="yen"){ sum.innerHTML=""; if(chart){chart.destroy();chart=null;} note.textContent="数時間ごとの値は、いまは「1ドル(円)」だけです。日経平均と原油は、無料で確かなデータが1日1回分しか取れないためです。"; return; }
    const T=(D.ticks||[]).filter(t=>Date.parse(t[0])>Date.now()-7*864e5);
    if(T.length<2){ sum.innerHTML=""; if(chart){chart.destroy();chart=null;} note.textContent="数時間ごとの記録を集めはじめたところです。1日5回(サイトの更新のたび)1点ずつ増えていきます。"; return; }
    const lab=t=>{ const d=new Date(Date.parse(t)+9*3600e3); return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${d.getUTCHours()}時`; };
    const first=T[0][1], last=T[T.length-1][1], diff=last-first;
    sum.innerHTML=`<div><span class="hint">この間の変化</span><b class="${diff>=0?'up':'dn'}">${diff>=0?"▲":"▼"}${Math.abs(diff).toFixed(2)}円</b></div><div><span class="hint">いま</span><b>${last.toFixed(2)}円</b><small class="hint">${lab(T[T.length-1][0])}</small></div><div><span class="hint">記録した点</span><b>${T.length}点</b><small class="hint">直近7日</small></div>`;
    const col=css("--g-eco");
    if(chart) chart.destroy();
    chart=new Chart(document.getElementById("cl"),{type:"line",data:{labels:T.map(t=>lab(t[0])),datasets:[{data:T.map(t=>t[1]),borderColor:col,backgroundColor:col+"22",fill:true,tension:.2,pointRadius:3,borderWidth:2}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.toFixed(2)+"円"}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:5}},y:{grid:{color:css("--line")},ticks:{callback:v=>v.toFixed(1)+"円"}}}}}); charts.push(chart);
    note.textContent="1ドルあたりの円(日本時間)。出典: Alpha Vantage(その時点の為替レート)。サイトの更新(1日5回)のたびに1点ずつ記録しています。";
  }
  draw();
}

// ===== AIに聞く(Claudeを開いて質問) =====
function askAI(context,q){

}
function askBlock(k){ const e=D.explainers[k]; const ex=[e.faq[0]&&e.faq[0][0],"わたしの生活にはどう関係する?","これから先、どうなりそう?"].filter(Boolean);

    <div id="askOut" class="gd-out" aria-live="polite"></div></div>`; }

// ===== 案内係(サイトの中の情報から答える。外には何も送らない) =====
const GD_STOP = /(ってなに|って何|でしょうか|ですか|教えて|おしえて|について|知りたい|ください|どういうこと|って|とは|なの|なに|何|は$|の$|か$)/g;
const gdNorm = s => String(s||"").normalize("NFKC").toLowerCase().replace(/\*\*/g,"").replace(/[?？!！。、,.・「」『』()\s　:：〜~]/g,"");
function gdGrams(s){ const t=gdNorm(s).replace(GD_STOP," ").replace(/\s+/g," ").trim(); const g=new Set(); t.split(" ").forEach(w=>{ if(w.length===1 && /[一-鿿゠-ヿA-Za-z0-9]/.test(w)) g.add(w); for(let i=0;i<w.length-1;i++) g.add(w.slice(i,i+2)); }); return [...g]; }
function gdScore(qg,text){ if(!qg.length) return 0; const t=gdNorm(text); let hit=0; qg.forEach(x=>{ if(t.includes(x)) hit++; }); let ex=0; (qg.ex||[]).forEach(x=>{ if(t.includes(x)) ex++; }); return Math.min(1,(hit+Math.min(ex,2)*0.5)/qg.length); }
const GD_SYN=[[/いつ/,"月から 始まる 日に 年"],[/安く|安い|下が/,"下げる 軽く 減"],[/高く|高い|上が|値上/,"上がる 高値 値上がり"],[/なぜ|どうして|なんで|理由/,"ため 原因 理由"],[/だれ|誰/,"首相 選手 氏 政権"],[/どこ/,"場所 市 県 国 球場"],[/どうなる|これから|今後/,"次 予定 見通し 予測"]];
function gdQuery(q){ const g=gdGrams(q); const ex=new Set(); GD_SYN.forEach(([re,w])=>{ if(re.test(q)) w.split(" ").forEach(x=>{ if(x.length>=2) for(let i=0;i<x.length-1;i++) ex.add(x.slice(i,i+2)); }); }); g.ex=[...ex].filter(x=>!g.includes(x)); return g; }
let GD_DOCS=null;
function gdDocs(){ if(GD_DOCS) return GD_DOCS; const L=[];
  Object.entries(D.explainers).forEach(([k,e])=>{
    (e.faq||[]).forEach(([q,a])=>L.push({t:"faq",k,g:e.g,q,a,key:q+" "+q+" "+e.name,body:a}));
    const sent=[e.kid,...(e.more||[]),...(e.us||[]).map(u=>String(u).replace(/\*\*/g,"")),...(e.timeline||[]).map(t=>t.join(" ")),...(e.next||[]).map(t=>Array.isArray(t)?t.join(" "):String(t))].filter(Boolean).flatMap(x=>String(x).split(/(?<=。)/)).map(x=>x.trim()).filter(x=>x.length>4);
    L.push({t:"ex",k,g:e.g,q:e.name,a:e.kid,key:e.name+" "+e.name+" "+(e.now||""),body:"",sent});
  });
  D.glossary.forEach(w=>L.push({t:"word",g:w[4],q:w[0],a:w[2]+(w[3]?` (たとえば: ${w[3]})`:""),key:w[0]+" "+w[1],body:w[2],w:w[0].replace(/\(.*?\)/,"")}));
  GD_DOCS=L; return L; }
function gdIntent(q){ const n=gdNorm(q); return {
  today:/(今日|きょう).*(ニュース|話題|なに|何)|ニュース.*(今日|きょう)|いちばん|一番|トップ/.test(n),
  weather:/天気|傘|雨|気温|寒|暑|服/.test(n),
  market:/日経|株|円相場|ドル|原油|ガソリン/.test(n),
  when:/いつ|何日|予定|日程/.test(n) }; }
function guideFind(q,focus){
  const qg=gdQuery(q); const nq=gdNorm(q); const docs=gdDocs();
  const sc=docs.map(d=>{ let s=gdScore(qg,d.key)*1.0 + (d.body?gdScore(qg,d.body)*0.45:0);
    if(d.sent){ let bs=0,bx=null; const when=/いつ|何日|何月/.test(q); d.sent.forEach(x=>{ const v=gdScore(qg,x)+(when&&/\d+(月|年)/.test(x)?0.2:0); if(v>bs){bs=v;bx=x;} }); s+=bs*0.8; d.hit=bs>=0.3?bx:null; }
    if(d.t==="word" && d.w && d.w.length>=2 && nq.includes(gdNorm(d.w))){ const core=gdNorm(q).replace(GD_STOP,""); const r=d.w.length/Math.max(1,core.length); s+= r>=0.5 ? 1.2 : 0.3; }
    if(focus && d.k===focus) s+=0.25; if(d.t==="faq") s+=0.05; return {d,s}; }).sort((a,b)=>b.s-a.s);
  const I=gdIntent(q); const th=(I.weather||I.market||I.today)?0.75:0.45;
  const best = sc[0] && sc[0].s>=th ? sc[0] : null;
  const words = sc.filter(x=>x.d.t==="word" && x.s>=0.6 && (!best||x.d!==best.d) && nq.includes(gdNorm(x.d.w))).slice(0,2).map(x=>x.d);
  const news = NEWS.map(n=>({n,s:gdScore(qg,n.h+" "+(n.th||"")+" "+(n.s||""))})).filter(x=>x.s>=0.34).sort((a,b)=>b.s-a.s||b.n.d.localeCompare(a.n.d)).slice(0,3).map(x=>x.n);
  const plans = D.schedule.filter(s=>(s[1]||s[0])>=TODAY).map(s=>({s,v:gdScore(qg,s[3]+" "+(s[5]||""))})).filter(x=>x.v>=0.34).sort((a,b)=>b.v-a.v).slice(0,3).map(x=>x.s);
  return {best: best&&best.d, words, news, plans, intent:I};
}
function guideAnswerHTML(q,focus){
  const r=guideFind(q,focus); const parts=[];
  const I=r.intent;
  if(I.today){ parts.push(`<div class="gd-a"><b>今日のニュース 上位3つ</b><ol class="us" style="margin:4px 0 0">${D.top10.slice(0,3).map(n=>`<li>${n.icon} ${esc(n.title)}${n.ex?` <button class="gd-lk" data-gex="${n.ex}">解説 →</button>`:""}</li>`).join("")}</ol></div>`); }
  if(I.weather && D.weather){ const w=D.weather; parts.push(`<div class="gd-a"><b>🌤️ ${esc(relDay(w.iso))}の${esc(w.place)}</b><br>${esc(w.sky)} ・ 最高${w.hi}° / 最低${w.lo}° ・ ☔ ${esc(w.umbrella)}<div class="hint">出典: ${esc(w.source)}</div>${/明日|あした/.test(q)&&relDay(w.iso)!=="明日"?'<div class="hint">明日の天気は、夜9時ごろの更新で入ります。</div>':""}</div>`); }
  if(I.market){ const n=lastVal(1), y=lastVal(2), o=lastVal(3); parts.push(`<div class="gd-a"><b>📈 いちばん新しい数字</b><br>日経平均 ${n?n.v.toLocaleString("ja-JP")+"円("+mdLabel(n.d)+")":"—"} ・ 1ドル ${y?y.v.toFixed(2)+"円":"—"} ・ NY原油 ${o?o.v.toFixed(2)+"ドル":"—"} <button class="gd-lk" data-gtab="numbers">グラフ →</button></div>`); }
  if(r.best){ const d=r.best; const e=d.k&&D.explainers[d.k];
    const from = d.t==="faq" ? `解説「${esc(e.name)}」のQ&Aより` : d.t==="ex" ? `解説「${esc(e.name)}」より` : "ことば辞典より";
    parts.push(`<div class="gd-a"><b>${d.t==="word"?"📖 "+esc(d.q):d.t==="faq"?"Q. "+esc(d.q):"💡 "+esc(d.q)}</b><br>${esc(d.t==="ex"&&d.hit?d.hit:d.a)}<div class="hint">${from}${d.k&&d.k!==focus?` <button class="gd-lk" data-gex="${d.k}">解説を読む →</button>`:""}</div></div>`); }
  r.words.forEach(w=>parts.push(`<div class="gd-a"><b>📖 ${esc(w.q)}</b><br>${esc(w.a)}</div>`));
  if(r.plans.length && (I.when||!r.best)) parts.push(`<div class="gd-a"><b>📅 これからの予定</b><ul class="us" style="margin:4px 0 0">${r.plans.map(s=>`<li>${esc(mdLabel(s[0]))} ${esc(s[3])}</li>`).join("")}</ul></div>`);
  if(r.news.length) parts.push(`<div class="gd-a"><b>📰 関係するニュース</b><ul class="us" style="margin:4px 0 0">${r.news.map(n=>`<li>${esc(mdLabel(n.d))} ${esc(n.h)} ${n.info?"📌":n.ok?"✅":"⚠️"}</li>`).join("")}</ul></div>`);
  if(!parts.length) parts.push(`<div class="gd-a">このアプリの中には、ぴったりの答えが見つかりませんでした。ことばを短くして聞きなおすか、下のボタンでClaudeに聞いてみてください。</div>`);
  if(r.best&&r.best.g) learn(r.best.g,1);
  track("/ask/"+(r.best?(r.best.k||"word"):(I.today?"today":I.weather?"weather":I.market?"market":"none")),"案内係");
  return parts.join("")+`<button class="fchip gd-deep" data-deep="1">🤖 Claudeでもっと深く聞く(アプリの外で開きます)</button>`;
}
function bindGuideOut(el,q,focus){
  el.querySelectorAll("[data-gex]").forEach(b=>b.onclick=()=>{ const k=b.dataset.gex; closeGuide(); openEx(k); });
  el.querySelectorAll("[data-gtab]").forEach(b=>b.onclick=()=>{ closeGuide(); go(b.dataset.gtab); });

let closeGuide=()=>{};
function openGuide(){
  const sh=document.getElementById("sheet");

const PRED = D.predictions.map(r=>({no:r[0],t:r[1],c:r[2],d:r[3],r:r[4],now:r[5],m:r[6]}));
const RL={hit:["✅ 当たり","res-hit"],miss:["❌ 外れ","res-miss"],part:["🔶 一部当たり","res-part"],wait:["⏳ 判定待ち","res-wait"]};

function nextTxt(t){ return String(t).replace(/🎯\s*N(\d+)\s*確度[:：]\s*/g,"予測ノート$1番・当たりそう度: "); }
function planLi(s){ const dd=daysFrom(s[0]); const x=md(s[0]); const left= dd<=0? (s[1]&&s[1]>=TODAY?"いま":"今日") : dd===1?"明日":`あと${dd}日`;

let pLim=5;

  const near=up.filter(s=>daysFrom(s[0])<=7); const upNear=near.length>=3?near:up.slice(0,Math.min(up.length,5)); const upFar=up.slice(upNear.length);
  const n={hit:0,miss:0,part:0,wait:0}; PRED.forEach(p=>n[p.r]++);
  const judged=n.hit+n.miss+n.part; const rate=judged?Math.round((n.hit*100+n.part*50)/judged):0;
  main.innerHTML=`<div class="view">

    ${upFar.length?`<details class="faq plain"><summary>その先の予定(${upFar.length}件)</summary><ul class="plan" style="margin:10px 0 12px">${upFar.map(planLi).join("")}</ul></details>`:""}
    ${past.length?`<details class="faq plain"><summary>終わった予定(${past.length}件)</summary><ul class="us" style="margin:10px 0 12px">${past.map(s=>`<li>${mdLabel(s[0])} ${esc(s[3])}</li>`).join("")}</ul></details>`:""}
    <button class="lookcard" id="paperBtn"><span style="font-size:1.8rem" aria-hidden="true">📰</span><span><b>未来の新聞(予想版)</b><span class="hint" style="display:block">Claudeの予測とあなたの予想を、未来の新聞の紙面に</span></span></button>
    ${followListHTML()}
    ${myPredHTML()}
    <div class="sec-h" style="margin-top:6px"><h2>🎯 予測と、あなたの予想</h2><span class="sub">当たり100点・一部50点・外れ0点</span></div>

      <div class="tally"><span class="res-hit">✅ 当たり ${n.hit}</span><span class="res-miss">❌ 外れ ${n.miss}</span><span class="res-part">🔶 一部 ${n.part}</span><span class="res-wait">⏳ 判定待ち ${n.wait}</span><span class="hint" style="grid-column:1/-1">予測は「当たったかどうか」を後で正直に記録するためのものです。</span></div>
    </section>
    <div class="chips" id="pf"><button class="fchip" data-f="wait" aria-pressed="true">⏳ 判定待ち</button><button class="fchip" data-f="done" aria-pressed="false">決着した予測</button></div>
    <div class="pred" id="plist"></div>
    ${footer()}
  </div>`;
  document.getElementById("paperBtn").onclick=openPaper; bindMyPred();
  bindFooter();
  const drawP=f=>{ const L=PRED.filter(p=>f==="wait"?p.r==="wait":p.r!=="wait").sort((a,b)=>(a.d||"9").localeCompare(b.d||"9"));
    document.getElementById("plist").innerHTML=L.slice(0,pLim).map(p=>`<div class="pr"><span class="no">${esc(p.no)}</span><span><b>${esc(p.t)}</b></span>${p.r==="wait"?voteRow(p):ME.votes[p.no]?`<span class="r">あなたの予想: ${ME.votes[p.no].v==="yes"?"当たる":"外れる"}</span>`:""}<span class="r"><span class="${RL[p.r][1]}">${RL[p.r][0]}</span> ・ 確度: ${esc(p.c)} ・ 判定日: ${p.d?mdLabel(p.d)+(p.r==="wait"&&daysFrom(p.d)>=0?`(あと${daysFrom(p.d)}日)`:""):"次の発表時"}${p.now?" ・ いま "+esc(p.now):""}${p.m?`<br>${esc(p.m)}`:""}</span></div>`).join("")+(L.length>pLim?`<button class="fchip more-btn" id="pMore">もっと見る(あと${L.length-pLim}件)</button>`:""); const pm=document.getElementById("pMore"); if(pm) pm.onclick=()=>{ pLim+=10; drawP(f); }; };
  main.querySelectorAll("#pf [data-f]").forEach(b=>b.onclick=()=>{ pLim=5; main.querySelectorAll("#pf [data-f]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); drawP(b.dataset.f); });
  drawP("wait");

}

// 日本語の折り返し(「。」「、」「」」などを行の頭に置かない)
function wrapJa(x,t,max,f){ x.font=f; const NOHEAD="、。,.)」』】〕!?！？ー〜ぁぃぅぇぉっゃゅょァィゥェォッャュョ%℃"; const lines=[]; let cur="";
  for(const ch of t){ if(ch==="\n"){ lines.push(cur); cur=""; continue; }
    if(x.measureText(cur+ch).width>max && cur){ if(NOHEAD.includes(ch)){ cur+=ch; continue; } lines.push(cur); cur=ch; } else cur+=ch; }
  if(cur) lines.push(cur); return lines; }

function icsFor(s){
  const d=s[0].replace(/-/g,""); const endIso=s[1]||s[0]; const e=new Date(Date.parse(endIso)+864e5).toISOString().slice(0,10).replace(/-/g,"");
  const clean=t=>String(t).replace(/[\;,]/g,m=>"\\"+m).replace(/\n/g," ");
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//mainichi-news//JA","BEGIN:VEVENT",`UID:${d}-${Math.abs([...s[3]].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))}@news`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,`SUMMARY:${clean(s[3])}`,`DESCRIPTION:${clean((s[5]||"")+" (まいにちニュース帳)")}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob=new Blob([body],{type:"text/calendar"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`yotei-${d}.ics`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
}

const MOOD_BAD=/死亡|死者|けが|攻撃|戦闘|紛争|空爆|災害|台風|大雨|地震|噴火|事故|墜落|火災|下落|急落|安値|逮捕|起訴|事件|不正|流出|漏えい|被害|拘束|値上がり|高騰|中止|延期|否決|反発|批判|懸念|警報|猛烈|辞任|殺/;

function fillQs(){ const rx=/[一-龠々]{2,}|[ァ-ヴー]{3,}/g; const r=seeded("fill"+TODAY); const GW=D.glossary.map(g=>g[0].replace(/\(.*?\)/g,""));
  const kata=t=>/^[ァ-ヴー]+$/.test(t);
  const all=[...new Set([...D.top10.map(n=>n.s||n.title||""),...D.three.map(t=>t.t||t.title||"")].flatMap(h=>h.match(rx)||[]))];
  const Q=[]; const order=D.top10.map((n,i)=>[n,i]).filter(([n])=>n.title).sort(()=>r()-.5);
  for(const [n,i] of order){ if(Q.length>=3) break; const h=n.s||n.title;
    const toks=(h.match(rx)||[]).filter(t=>t.length<=8&&h.split(t).length===2); if(!toks.length) continue;
    const ans=toks.find(t=>GW.some(g=>g&&(g===t||(t.length>=3&&g.includes(t)))))||[...toks].sort((a,b)=>b.length-a.length)[0];
    const pool=all.filter(t=>t!==ans&&!h.includes(t)&&!t.includes(ans)&&!ans.includes(t)&&kata(t)===kata(ans)&&Math.abs(t.length-ans.length)<=2);
    if(pool.length<3) continue; const o=[...pool].sort(()=>r()-.5).slice(0,3); const a=Math.floor(r()*4); o.splice(a,0,ans);
    Q.push({h:h.replace(ans,"□".repeat(Math.min(ans.length,4))),o,a,i}); }
  return Q; }

function hhNews(){ const rx=/([0-9０-９]+(?:[.．][0-9０-９]+)?)\s*[%％](?:ほど|程度|前後)?(?:の)?(値上げ|値下げ|引き上げ|引き下げ|上昇|下落|上が|下が|増え|減)/g; const out=[]; const seen=new Set();
  const z=s=>s.replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const scan=(t,h,d)=>{ let m; rx.lastIndex=0; while((m=rx.exec(t))){ const p=parseFloat(z(m[1])); if(!(p>0&&p<=100)) continue; const up=/値上げ|引き上げ|上昇|上が|増え/.test(m[2]); const key=h+p; if(seen.has(key)) continue; seen.add(key); out.push({p:up?p:-p,w:m[0],h,d}); } };
  D.top10.forEach(n=>scan((n.title||"")+" "+(n.text||""),n.s||n.title,TODAY));
  NEWS.filter(n=>n.d>=dayShift(TODAY,-7)).forEach(n=>scan(n.h||"",n.h,n.d));
  return out.slice(0,6); }
function dayShift(iso,dd){ const t=new Date(iso+"T12:00:00"); t.setDate(t.getDate()+dd); return t.toISOString().slice(0,10); }

function ktQs(lv){ const W=D.glossary.filter(w=>w[0]&&w[2]); if(W.length<8) return []; const r=seeded("kt"+lv+TODAY);
  const nm=w=>w[0].replace(/\(.*?\)/g,"").trim(); const cut=t=>{ const x=String(t).split("。")[0]; return x.length>44?x.slice(0,42)+"…":x; };
  let pool=[...W].sort(()=>r()-.5); if(lv===2) pool=pool.sort((a,b)=>wordRarity(b[0])-wordRarity(a[0]));
  return pool.slice(0,Math.min(10,pool.length)).map((w,i)=>{ const type=lv===0?0:lv===1?1:i%2; const others=W.filter(o=>o!==w&&nm(o)!==nm(w)).sort(()=>r()-.5).slice(0,3); const a=Math.floor(r()*4);
    if(type===0){ const o=others.map(x=>cut(x[2])); o.splice(a,0,cut(w[2])); return {q:`「${nm(w)}」の意味は?`,o,a,one:true,e:`${nm(w)}: ${w[2]}`}; }
    const o=others.map(nm); o.splice(a,0,nm(w)); return {q:`「${cut(w[2]).split(nm(w)).join("〇〇")}」ということばは?`,o,a,one:false,e:`${nm(w)}: ${w[2]}`}; }); }

const TREND_STOP=new Set(["日本","政府","発表","開始","予定","今日","明日","前年","全国","東京","方針","検討","可能","影響","問題","発生","対応","記録","結果","会見","関係","今年","来年","世界","大会","選手","試合","公開","発売","億円","兆円","万円","以上","以下","最大","初め","見通","会社","企業","国内","海外","市場","状況","理由","必要","一部","全体","前日","午前","午後","時点","注意","確認","呼びかけ","ニュース","オンライン"]);
function trendWords(n){ const rx=/[一-龠々]{1,4}[ァ-ヴー]{3,9}|[一-龠々]{2,6}|[ァ-ヴー]{3,9}|(?<![A-Za-z])[A-Z]{2,5}(?![A-Za-z])/g; const d2=dayShift(TODAY,-1), d9=dayShift(TODAY,-8);
  const R={},B={}; NEWS.forEach(x=>{ if(x.d<d9) return; const T=new Set((x.h||"").match(rx)||[]); T.forEach(t=>{ if(TREND_STOP.has(t)) return; if(x.d>=d2) R[t]=(R[t]||0)+1; else B[t]=(B[t]||0)+1; }); });
  let L=Object.keys(R).filter(t=>R[t]>=2&&R[t]/2>=1.5*((B[t]||0)/7)+.5).map(t=>[t,R[t]/2-(B[t]||0)/7,R[t]]).sort((a,b)=>b[1]-a[1]||b[2]-a[2]);
  const out=[]; for(const x of L){ if(out.some(o=>o[0].includes(x[0])||x[0].includes(o[0]))) continue; out.push(x); if(out.length>=(n||8)) break; } return out; }
