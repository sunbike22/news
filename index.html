<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2747c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ニュース帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="毎日のニュースを、1分の動くスライド・検索・グラフ・解説・クイズで">
<title>まいにちニュース帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* 朝の掲示板: 1列のカード紙面 + 下のタブ。重要な数字だけ太い見出し書体で */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#141b2d; --muted:#5a6478; --line:#d9dee6;
  --accent:#2747c9; --accent-soft:#e3e8fb; --warn:#c2410c; --warn-soft:#fdeee6; --ok:#15803d; --ok-soft:#e5f4ea;
  --g-pol:#2563c9; --g-eco:#17803f; --g-soc:#c25a0c; --g-it:#7c3aed; --g-intl:#c42b2b; --g-spo:#8a5a2b; --g-ent:#c0367a; --g-pred:#475569;
  --g-pol-s:#e4ecfa; --g-eco-s:#e4f3e9; --g-soc-s:#fbeadb; --g-it-s:#efe7fd; --g-intl-s:#fbe5e5; --g-spo-s:#f3eadf; --g-ent-s:#fbe4ef; --g-pred-s:#e9edf2;
  --g-fas:#c026a3; --g-home:#8a6416; --g-food:#d0451b; --g-life:#0e7490; --g-trip:#4f46e5;
  --g-fas-s:#f9e0f4; --g-home-s:#f4ead3; --g-food-s:#fbe3d8; --g-life-s:#d8eff5; --g-trip-s:#e4e3fc;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --fs:16px; --radius:14px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#171d2c; --surface2:#1d2436; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2a3247;
  --accent:#8ea4ff; --accent-soft:#232c4d; --warn:#fb923c; --warn-soft:#3a2416; --ok:#4ade80; --ok-soft:#163222;
  --g-pol:#7aa7ff; --g-eco:#5fd18a; --g-soc:#f59e5b; --g-it:#b794ff; --g-intl:#ff7b7b; --g-spo:#d6a46e; --g-ent:#ff8cc0; --g-pred:#a3b0c2;
  --on-accent:#0b1020; --g-pol-s:#1b2a48; --g-eco-s:#16301f; --g-soc-s:#352314; --g-it-s:#2a1f45; --g-intl-s:#3a1a1d; --g-spo-s:#33271b; --g-ent-s:#3b1a2b; --g-pred-s:#232a36;
  --g-fas:#f07ad8; --g-home:#e0b860; --g-food:#ff9573; --g-life:#67d3ec; --g-trip:#a5a1ff;
  --g-fas-s:#3a1636; --g-home-s:#33291a; --g-food-s:#3a1d14; --g-life-s:#12303a; --g-trip-s:#24224a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171d2c; --surface2:#1d2436; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2a3247;
  --accent:#8ea4ff; --accent-soft:#232c4d; --warn:#fb923c; --warn-soft:#3a2416; --ok:#4ade80; --ok-soft:#163222;
  --g-pol:#7aa7ff; --g-eco:#5fd18a; --g-soc:#f59e5b; --g-it:#b794ff; --g-intl:#ff7b7b; --g-spo:#d6a46e; --g-ent:#ff8cc0; --g-pred:#a3b0c2;
  --on-accent:#0b1020; --g-pol-s:#1b2a48; --g-eco-s:#16301f; --g-soc-s:#352314; --g-it-s:#2a1f45; --g-intl-s:#3a1a1d; --g-spo-s:#33271b; --g-ent-s:#3b1a2b; --g-pred-s:#232a36;
  --g-fas:#f07ad8; --g-home:#e0b860; --g-food:#ff9573; --g-life:#67d3ec; --g-trip:#a5a1ff;
  --g-fas-s:#3a1636; --g-home-s:#33291a; --g-food-s:#3a1d14; --g-life-s:#12303a; --g-trip-s:#24224a;
  color-scheme:dark}
:root[data-size="l"]{--fs:18px} :root[data-size="xl"]{--fs:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.7;margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:16px 0 0 var(--g-intl),32px 0 0 var(--g-eco);margin-right:34px}
.top .upd{font-size:.78rem;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-width:40px;height:40px;cursor:pointer;font-size:.9rem;padding:0 10px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-block:6px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.7rem;min-width:0}
.tab .ti{font-size:1.25rem;line-height:1}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
@media (min-width:900px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);z-index:19}
  .tab{flex-direction:row;justify-content:center;gap:6px;font-size:.88rem}
  .tab .ti{font-size:1rem}
}

main{padding-block:18px 32px}
.view{display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.sec-h h2{font-size:1.2rem}
.sec-h .sub{font-size:.8rem;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--g-pred-s);color:var(--g-pred)}
.chip.pol{background:var(--g-pol-s);color:var(--g-pol)} .chip.eco{background:var(--g-eco-s);color:var(--g-eco)} .chip.soc{background:var(--g-soc-s);color:var(--g-soc)}
.chip.it{background:var(--g-it-s);color:var(--g-it)} .chip.intl{background:var(--g-intl-s);color:var(--g-intl)} .chip.spo{background:var(--g-spo-s);color:var(--g-spo)} .chip.ent{background:var(--g-ent-s);color:var(--g-ent)}
.chip.fas{background:var(--g-fas-s);color:var(--g-fas)} .chip.home{background:var(--g-home-s);color:var(--g-home)} .chip.food{background:var(--g-food-s);color:var(--g-food)} .chip.life{background:var(--g-life-s);color:var(--g-life)} .chip.trip{background:var(--g-trip-s);color:var(--g-trip)}
.badge-ok{color:var(--ok);font-size:.78rem;font-weight:700;white-space:nowrap}
.badge-one{color:var(--warn);font-size:.78rem;font-weight:700;white-space:nowrap}

/* hero row */
.hero{display:grid;grid-template-columns:1fr;gap:12px}
.play{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;border-radius:var(--radius);padding:16px 18px;background:var(--accent);color:var(--on-accent)}
.play .pi{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.2rem;flex:none}
.play b{display:block;font-size:1.08rem;color:inherit}
.play span{color:inherit}
.play span{font-size:.82rem;opacity:.9}

.weather{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.weather .big{font-family:var(--f-display);font-size:2rem;line-height:1;white-space:nowrap}
.weather .big small{font-size:.9rem;font-family:var(--f-body);color:var(--muted)}
.rainbar{display:flex;gap:6px;flex-wrap:wrap}
.rain{font-size:.8rem;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.weather .notes{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:8px 10px}

.three{display:grid;gap:10px}
.three .t{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px 16px;cursor:pointer;border-left:6px solid var(--g-pred)}
.three .t.pol{border-left-color:var(--g-pol)} .three .t.intl{border-left-color:var(--g-intl)} .three .t.spo{border-left-color:var(--g-spo)} .three .t.eco{border-left-color:var(--g-eco)}
.three .lab{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.three h3{font-size:1.08rem;margin:2px 0 4px}
.three p{margin:0;font-size:.9rem;color:var(--muted)}
.more{font-size:.82rem;color:var(--accent);font-weight:700}
@media (min-width:760px){.three{grid-template-columns:repeat(3,1fr)}}

.ten{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ten li{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ten .row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:12px 14px;width:100%;text-align:left;border:0;background:none;cursor:default}
.ten .row.link{cursor:pointer}
.rank{font-family:var(--f-display);font-size:1.25rem;line-height:1.2;color:var(--muted);text-align:center}
.ten .big .rank{color:var(--accent);font-size:1.6rem}
.ten h3{font-size:1rem;font-weight:700}
.ten .big h3{font-size:1.1rem}
.ten .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.ten p{margin:4px 0 0;font-size:.92rem}
.ten .pt{margin-top:6px;font-size:.88rem;background:var(--surface2);border-radius:8px;padding:6px 10px}

.bignum{display:flex;flex-direction:column;gap:6px}
.bignum .v{font-family:var(--f-display);font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.05;color:var(--g-eco)}
.bignum .v small{font-size:1.1rem}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mk .m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.mk .m .k{font-size:.74rem;color:var(--muted)}
.mk .m .val{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn{color:var(--g-intl);font-size:.8rem} .up{color:var(--g-eco);font-size:.8rem}

/* search */
.sbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px}
.sbox:focus-within{border-color:var(--accent)}
.sbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1.05rem;color:var(--ink);padding:10px 0;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .c{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.hist{display:flex;align-items:flex-end;gap:2px;height:46px;padding-top:4px}
.hist i{flex:1;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;min-height:2px}
.hist-l{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:14px}
.day h3{font-size:.9rem;color:var(--muted);margin-bottom:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);background:var(--bg);padding-block:4px;z-index:2}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .h{font-weight:700;font-size:.97rem}
.item .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
mark{background:#ffe066;color:#141b2d;border-radius:3px;padding:0 1px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.quick button{flex:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* personal */
:root{--map-sea:#dce8f3;--map-land:#f4f1ea;--map-jp:#fff;--map-line:#b9c4d2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--map-sea:#0f1a2c;--map-land:#26304a;--map-jp:#3a4766;--map-line:#41507a}}
:root[data-theme="dark"]{--map-sea:#0f1a2c;--map-land:#26304a;--map-jp:#3a4766;--map-line:#41507a}
.me-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ms{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;min-width:0;font-size:.78rem;line-height:1.25}
.ms b{display:block;font-size:.98rem}
.ms .mi{font-size:1.35rem}
.ms.new{border-color:var(--accent);background:var(--accent-soft)}
.newchip{background:var(--accent-soft);color:var(--accent)}
.result{border-color:var(--ok);background:var(--ok-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .4s ease both;max-width:calc(100% - 32px);text-align:center}
.toast.out{opacity:0;transition:opacity .5s}
.lvrow{display:flex;gap:14px;align-items:center}
.lvbig{font-family:var(--f-display);font-size:2rem;color:var(--accent)}
.lvcard .bar{height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.lvcard .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 6px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.cal i.on{background:var(--ok);border-color:var(--ok)}
.cal i.today{outline:2px solid var(--accent);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;background:var(--surface2);filter:grayscale(1);opacity:.45;text-align:center}
.bd span{font-size:1.6rem}.bd small{font-size:.72rem}
.bd.got{filter:none;opacity:1;background:var(--accent-soft)}
.vote{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.ics{margin-top:6px;font-size:.78rem;padding:3px 10px}
.mapbox{padding:8px}
.mapsvg svg{display:block;border-radius:10px}
.pin .pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.35);opacity:.05}}
.photo{margin:0}
.photo img{display:block;width:100%;aspect-ratio:12/6;object-fit:cover;border-radius:var(--radius);background:var(--surface2)}
.photo figcaption{font-size:.72rem;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion: reduce){.pin .pulse{animation:none}}

.lsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.lsum>div{background:var(--surface2);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.lsum b{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask .sbox{border-width:1px}

.ten li,.item{position:relative}
.pin-btn.abs{position:absolute;top:6px;right:6px;z-index:2;border:0;background:transparent;font-size:1.15rem;width:40px;height:40px;border-radius:10px;cursor:pointer;opacity:.55}
.pin-btn.abs[aria-pressed="true"]{opacity:1}
.ten .row,.item{padding-right:44px}
.pins{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pinitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.pinitem .h{font-weight:700}
.memo{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}

/* install */
.install{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.install img{width:48px;height:48px;border-radius:12px}
.install b{display:block}
.install .hint{display:block}
.offline{background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:.88rem}

/* illustrations */
.ill{border-radius:var(--radius);overflow:hidden;aspect-ratio:12/5;max-width:100%;border:1px solid var(--line)}
.excard .ico.ill{aspect-ratio:auto;width:56px;height:56px;border-radius:14px}
.ten .big .ill{margin:0 0 10px;aspect-ratio:12/4}
.story .ill{border:0;border-radius:16px;max-height:30vh}
.credit{font-size:.72rem;color:var(--muted);margin-top:4px}

/* quiz */
.quiz .qq{font-weight:700;font-size:1.02rem;margin:4px 0 10px}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz .opt{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;cursor:pointer;font-weight:700;text-align:center}
.quiz .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz .opt.wrong{border-color:var(--g-intl);background:var(--g-intl-s)}
.quiz .exp{margin-top:10px;font-size:.92rem;background:var(--surface2);border-radius:10px;padding:8px 12px}
.quiz .qn{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.r{background:var(--ok)}.dots i.w{background:var(--g-intl)}.dots i.c{outline:2px solid var(--accent)}

/* explainers */
.exgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.exgrid{grid-template-columns:1fr 1fr}}
.excard{display:grid;grid-template-columns:56px 1fr;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;cursor:pointer;align-items:start}
.excard .ico{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;background:var(--surface2)}
.excard h3{font-size:1.02rem}
.excard p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.st{font-size:.72rem;font-weight:700}
.st.live{color:var(--warn)} .st.done{color:var(--ok)}

.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bar{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet .bar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.sheet .bar .ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{padding-block:16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.kid{background:#fff6cc;color:#2a2410;border-radius:var(--radius);padding:16px 18px}
.kid .l{font-size:.78rem;font-weight:700;letter-spacing:.06em;opacity:.75}
.kid h2{font-size:1.25rem;margin-top:4px}
.blk h3{font-size:1.08rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.blk p{margin:0}
.flow{display:flex;flex-direction:column;align-items:stretch;gap:0}
.fstep{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;transition:opacity .45s ease, transform .45s ease, border-color .3s}
.fstep .fi{font-size:1.6rem;text-align:center}
.fstep b{display:block;font-size:1.02rem}
.fstep small{display:block;color:var(--muted);font-size:.85rem}
.farrow{text-align:center;color:var(--muted);font-size:.85rem;padding:4px 0;transition:opacity .45s ease}
.flow.anim .fstep,.flow.anim .farrow{opacity:.12;transform:translateY(8px)}
.flow.anim .on{opacity:1;transform:none}
.flow .fstep.now{border-color:var(--accent)}
.fplay{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer;margin-left:auto}
ul.us{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
details.faq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.faq+details.faq{margin-top:8px}
details.faq summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none;display:flex;gap:8px}
details.faq.plain summary::before{content:"▸"}
details.faq summary::before{content:"Q";color:var(--accent);font-family:var(--f-display)}
details.faq[open] summary{border-bottom:1px dashed var(--line)}
details.faq p{margin:10px 0 12px}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tl li{position:relative}
.tl li::before{content:"";position:absolute;left:-21px;top:.55em;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl b{font-size:.85rem;color:var(--accent);margin-right:6px}
.src{font-size:.8rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-family:var(--f-display);font-size:1.8rem;line-height:1.1;color:var(--g-spo)}
.stat .k{font-size:.78rem;color:var(--muted)}
.calc label{font-size:.9rem;display:block;margin-bottom:6px}
.calc input[type=range]{width:100%}
.calc .out{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.calc .o{background:var(--g-eco-s);border-radius:12px;padding:10px;text-align:center}
.calc .o .v{font-family:var(--f-display);font-size:1.5rem;color:var(--g-eco);line-height:1.2}
.gl{border:0;background:none;padding:0;color:inherit;text-decoration:underline dotted var(--accent) 2px;text-underline-offset:3px;cursor:help}
.pop{position:fixed;z-index:70;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.pop b{font-size:1.05rem}

/* numbers */
.chartbox{position:relative;height:220px}
.legend-note{font-size:.78rem;color:var(--muted);margin-top:6px}

/* plan */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:center}
.plan .d{text-align:center;line-height:1.2}
.plan .d .md{font-family:var(--f-display);font-size:1.15rem}
.plan .d .wd{font-size:.72rem;color:var(--muted)}
.plan .left{font-size:.75rem;font-weight:700;color:var(--accent)}
.plan .tx{font-weight:700;font-size:.95rem}
.plan .mm{font-size:.8rem;color:var(--muted)}
.score{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.donut{position:relative;width:140px;height:140px}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.donut .c b{font-family:var(--f-display);font-size:1.7rem}
.donut .c span{font-size:.72rem;color:var(--muted)}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.9rem}
.pred{display:flex;flex-direction:column;gap:8px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.pr .no{font-family:var(--f-display);color:var(--muted)}
.pr .r{grid-column:2;font-size:.78rem;color:var(--muted)}
.res-hit{color:var(--ok);font-weight:700} .res-miss{color:var(--g-intl);font-weight:700} .res-part{color:var(--warn);font-weight:700} .res-wait{color:var(--muted);font-weight:700}

/* words */
.words{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:640px){.words{grid-template-columns:1fr 1fr}}
.w{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.w .wt{font-weight:700;font-size:1.05rem}
.w .wy{font-size:.75rem;color:var(--muted)}
.w p{margin:4px 0 0;font-size:.92rem}
.w .ex{margin-top:6px;font-size:.85rem;background:var(--surface2);border-radius:8px;padding:6px 10px}

/* story player */
.story{position:fixed;inset:0;z-index:80;background:#0b1020;color:#f2f4fa;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
.story .bars{display:flex;gap:4px;padding:10px max(14px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.story .bars i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.story .bars i b{display:block;height:100%;width:0;background:#fff}
.story .ctl{display:flex;align-items:center;gap:8px;padding:4px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.story .ctl .lbl{font-size:.8rem;opacity:.75;margin-right:auto}
.story .sbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;height:36px;min-width:36px;padding:0 12px;cursor:pointer;font-size:.85rem}
.story .stage{flex:1;position:relative;overflow:hidden}
.story .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px max(26px,env(safe-area-inset-right,0px)) 24px max(26px,env(safe-area-inset-left,0px));max-width:680px;margin:0 auto}
.story .kick{font-size:.85rem;letter-spacing:.12em;opacity:.75;font-weight:700}
.story h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,6.4vw,2.6rem);line-height:1.3}
.story p{font-size:1.08rem;line-height:1.75;margin:0;opacity:.92}
.story .huge{font-family:var(--f-display);font-size:clamp(3.4rem,16vw,6rem);line-height:1}
.story .tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.85rem;font-weight:700;background:rgba(255,255,255,.14);align-self:flex-start}
.story .tapl,.story .tapr{position:absolute;top:0;bottom:0;width:32%;z-index:2;border:0;background:none;cursor:pointer}
.story .tapl{left:0} .story .tapr{right:0}
.story .an{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.story .an.d1{animation-delay:.15s} .story .an.d2{animation-delay:.35s} .story .an.d3{animation-delay:.6s} .story .an.d4{animation-delay:.85s}
.story .glow{position:absolute;inset:-30%;z-index:0;opacity:.55;filter:blur(60px);animation:drift 12s ease-in-out infinite alternate}
.story .slide>*:not(.glow){position:relative;z-index:1}
.story ol.mini{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:1rem}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translate(-6%,-4%) scale(1)}to{transform:translate(6%,5%) scale(1.15)}}
@media (prefers-reduced-motion: reduce){.story .an,.story .glow{animation:none}.fstep,.farrow{transition:none}}

.foot{font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
.setrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* 着せかえ(詰め具合) */
:root[data-density="compact"] .view{gap:12px}
:root[data-density="compact"] .card{padding:12px}
:root[data-density="compact"] .ten{gap:5px}
:root[data-density="compact"] .ten .row{padding:8px 12px}
:root[data-density="compact"] .ten .ill,:root[data-density="compact"] .ten .pt,:root[data-density="compact"] .ten li:not(.big) p{display:none}
:root[data-density="compact"] body{line-height:1.6}
:root[data-density="roomy"] .view{gap:30px}
:root[data-density="roomy"] .card{padding:20px}
:root[data-density="roomy"] .ten{gap:12px}
:root[data-density="roomy"] .ten .row{padding:16px 16px}
:root[data-density="roomy"] body{line-height:1.85}
/* 着せかえ画面 */
.lk-sec{display:flex;flex-direction:column;gap:10px}
.lk-sec>h3{font-size:1.05rem}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.lk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lk-list li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.lk-list li.off .nm{opacity:.45;text-decoration:line-through}
.lk-list .nm{flex:1;min-width:0;font-weight:700}
.lk-list .mv{width:40px;height:40px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;cursor:pointer;font-size:1rem}
.lk-list .mv:disabled{opacity:.3;cursor:default}
.lk-list .sw2{min-width:64px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:.82rem;font-weight:700}
.lk-list .sw2[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lk-list .lock{min-width:64px;text-align:center;font-size:.78rem;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.presets button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.presets button b{display:block}
.presets button span{font-size:.8rem;color:var(--muted)}
.lookcard{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;width:100%;text-align:left;cursor:pointer}
.lookcard .pal{display:flex;flex:none}
.lookcard .pal i{width:18px;height:18px;border-radius:50%;margin-left:-5px;border:2px solid var(--surface)}
/* 季節 */
#snow{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
#snow i{position:absolute;top:-20px;color:#cfe6ff;opacity:.85;font-style:normal;animation:snowfall linear infinite}
@keyframes snowfall{to{transform:translate(30px,105vh) rotate(180deg)}}
:root[data-season="xmas"] .season-card{background:linear-gradient(120deg,#14532d,#b91c1c);color:#fff;border-color:#14532d}
:root[data-season="newyear"] .season-card{background:linear-gradient(120deg,#c8102e,#e8b04a);color:#fff;border-color:#c8102e}
:root[data-season="xmas"] .season-card .fchip,:root[data-season="newyear"] .season-card .fchip{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.season-card{display:flex;align-items:center;gap:12px;border-radius:var(--radius);padding:12px 12px 12px 16px;background:linear-gradient(120deg,var(--accent-soft),var(--surface));border:1px solid var(--line)}
.season-card .si{font-size:2rem;line-height:1}
:root[data-season="halloween"] .season-card{background:linear-gradient(120deg,#2b1840,#4a2470);color:#fff;border-color:#4a2470}
:root[data-season="halloween"] .season-card .fchip{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
/* ペット */
.pet-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.pet-av{border:0;background:none;padding:0;cursor:pointer;flex:none}
.pet-tx{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:.9rem}
.pet-bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pet-feed{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.pet-feed:disabled{opacity:.45}
.pet-big{display:flex;justify-content:center}
.pet-card svg,.pet-big svg{animation:petIdle 2.6s ease-in-out infinite;transform-origin:50% 90%}
svg.eat{animation:petEat .7s ease both!important}
@keyframes petIdle{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.02,.98)}}
@keyframes petEat{0%{transform:scale(1)}30%{transform:translateY(-14px) scale(1.08,.92)}60%{transform:translateY(0) scale(.95,1.05)}100%{transform:scale(1)}}
.pet-heart{position:absolute;z-index:95;font-size:1.3rem;pointer-events:none;animation:petHeart 1.4s ease-out both}
@keyframes petHeart{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px) scale(1.4)}}
.quiz .opts.one{grid-template-columns:1fr}
.quiz .opts.one .opt{text-align:left;font-weight:500;font-size:.92rem}
@media (prefers-reduced-motion: reduce){.pet-card svg,.pet-big svg,svg.eat,.pet-heart{animation:none!important}}
/* 天気図 */
.mood-all{display:flex;gap:12px;align-items:center;margin:8px 0 10px}
.mood-all .mi{font-size:2.4rem;line-height:1}
.mood-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.mood-c{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--cs);border-radius:12px;padding:8px 4px;cursor:pointer;color:var(--ink)}
.mood-c .mi{font-size:1.6rem;line-height:1.2}
.mood-c b{font-size:.82rem}.mood-c small{font-size:.72rem;color:var(--muted)}
/* 対戦 */
.vs-card{border:2px solid var(--accent);background:var(--accent-soft)}
.vs-res{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0 10px;padding:10px;border-radius:12px;background:var(--surface2)}
.vs-res span:first-child{font-size:2rem}
/* 未来の新聞 */
.paper{background:#fbf8f0;color:#1b1b1b;border-radius:6px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.pp-head{text-align:center;border-bottom:3px double #1b1b1b;padding-bottom:6px}
.pp-name{font-size:2.2rem;font-weight:900;letter-spacing:.3em}
.pp-sub{font-size:.8rem}
.pp-note{font-size:.75rem;color:#555;margin:6px 0;border-bottom:1px solid #999;padding-bottom:6px}
.pp-cols{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.pp-cols{grid-template-columns:1fr 1fr}.pp-art.top{grid-column:1/-1}}
.pp-art{border-bottom:1px solid #bbb;padding-bottom:8px;position:relative}
.pp-art h3{font-size:1.1rem;font-weight:900;margin:2px 0}
.pp-art.top h3{font-size:1.45rem}
.pp-art p{margin:2px 0;font-size:.9rem}
.pp-kick{font-size:.72rem;color:#7a1f1f;font-weight:700}
.pp-my{display:inline-block;font-size:.75rem;border:1px solid #1b1b1b;padding:0 6px;margin-top:4px}
.pp-sec{margin:12px 0 6px;font-weight:900;border-top:3px double #1b1b1b;padding-top:6px}
.pp-stamp{position:absolute;right:0;top:0;border:2px solid;border-radius:50%;padding:6px 4px;font-size:.75rem;font-weight:900;transform:rotate(-12deg)}
.pp-stamp.hit{color:#c62828}.pp-stamp.miss{color:#455a64}.pp-stamp.part{color:#b26a00}
.pp-art.done h3{padding-right:52px}
.cap-lock{background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
/* もしも計算機 */
.if-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.if-row label{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.92rem}
.if-row input[type=number]{width:7em;font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.if-row input[type=range]{width:100%;accent-color:var(--accent)}
.if-out{font-size:1rem;background:var(--surface2);border-radius:10px;padding:6px 10px}
.if-out .up,.if-out .dn{font-size:inherit;font-weight:700}
/* 知ってた? */
.kstack{position:relative;height:150px;margin:10px 0;touch-action:pan-y}
.kcard{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(calc(var(--i)*6px)) scale(calc(1 - var(--i)*.03));transition:transform .3s,opacity .3s;cursor:grab;user-select:none}
.kcard b{font-size:1.02rem}.kcard .chip{align-self:flex-start}
.kcard.gone{opacity:0;pointer-events:none}.kcard.gone.r{transform:translateX(120%) rotate(12deg)}.kcard.gone.l{transform:translateX(-120%) rotate(-12deg)}
.kbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kbtn .fchip{padding:10px;font-size:.95rem;font-weight:700}
.kdone{display:grid;place-items:center;height:100%;text-align:center;font-weight:700}
/* 話のタネ */
.talk{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tk{border-left:5px solid var(--c);background:var(--surface2);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.tk small{color:var(--muted);font-size:.8rem}
/* ラジオ */
.radio{align-items:stretch;text-align:center}
.rd-moon{font-size:4.5rem;position:relative;margin:10px auto 0;animation:petIdle 4s ease-in-out infinite}
.rd-moon span{position:absolute;font-size:1rem;color:var(--accent);animation:twinkle 2.4s ease-in-out infinite}
.rd-moon span:nth-child(1){left:-30px;top:10px}.rd-moon span:nth-child(2){right:-26px;top:-4px;animation-delay:.8s}.rd-moon span:nth-child(3){right:-40px;bottom:6px;animation-delay:1.6s}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.rd-now{min-height:6.5em;font-size:1.05rem;line-height:1.8;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.rd-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.rd-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .6s}
.rd-btn{width:auto}

.wardrobe{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:6px 0}
.wd-i{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;cursor:pointer;color:var(--ink)}

.wd-i.on{border:2px solid var(--accent);background:var(--accent-soft)}
.wd-i:disabled{opacity:.6;cursor:default}
.wd-svg{height:46px;display:grid;place-items:center}.wd-lock{font-size:1.3rem}
.pet-big{position:relative}.pet-fr{position:absolute;right:calc(50% - 130px);bottom:0}
.room{position:relative;height:190px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.rm-wall{position:absolute;inset:0 0 35% 0;background:linear-gradient(#fde9c8,#f7dcae)}
.rm-floor{position:absolute;inset:65% 0 0 0;background:repeating-linear-gradient(90deg,#c9915a 0 34px,#bf8650 34px 36px)}
.rm-it{position:absolute;font-size:1.5rem;line-height:1}.rm-it.off{opacity:.35;font-size:1rem;color:#8a6a43}
.rm-pet{position:absolute;left:50%;bottom:4px;margin-left:-42px}
.rm-fr{position:absolute;left:calc(50% + 40px);bottom:6px}
.rm-win{position:absolute;right:10px;top:8px;font-size:1.6rem}
.diary{background:#fffdf3;color:#2a2116;border:1px solid #e9dcb6;border-radius:10px;padding:10px 12px;font-family:"Hiragino Maru Gothic ProN","Zen Kaku Gothic New",sans-serif;background-image:repeating-linear-gradient(transparent 0 27px,#efe4c4 27px 28px)}
.diary p{margin:4px 0}.dy-h{font-weight:800}.dy-h small{font-weight:400;color:#7a6a55}
/* ページのペット */
.mascot{display:flex;align-items:center;gap:8px}

.mascot-b{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:.88rem}
.mascot-b::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--line);border-left:0}
@media (max-width:420px){.top .wrap{gap:6px}.brand{font-size:1rem}.brand .dot{margin-right:30px;width:10px;height:10px;box-shadow:13px 0 0 var(--g-intl),26px 0 0 var(--g-eco)}.top .upd{font-size:.7rem}.top .iconbtn{min-width:36px;height:36px;padding:0 6px}}

.bell{position:relative}
.bell .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 2px var(--surface)}
.newtag{display:inline-block;background:#e5484d;color:#fff;font-size:.68rem;font-weight:800;border-radius:999px;padding:0 7px;vertical-align:middle}
.upd.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* 捜査ボード */
.bd-pet{display:flex;align-items:center;gap:8px}

.bd-bubble{position:relative;background:#fffbe8;color:#2a2116;border:2px solid #6b4a2b;border-radius:14px;padding:6px 10px;font-size:.88rem;display:flex;flex-direction:column}
.bd-bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#6b4a2b;border-left:0}
.bd-bubble b{font-size:.78rem;color:#6b4a2b}
.boardbox{padding:10px;display:flex;flex-direction:column;gap:8px}
.board-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:6;background:var(--surface);padding:4px 0}
.bd-msg{font-size:.85rem;color:var(--muted)}
.bd-msg.on{color:var(--ink);background:#fff4c2;border:1px solid #e9cf6a;border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#3a2a00}
.board-wrap{overflow:auto;max-height:62vh;border-radius:10px;-webkit-overflow-scrolling:touch;box-shadow:inset 0 0 0 6px #6b4a2b, inset 0 0 18px rgba(0,0,0,.45);overscroll-behavior:contain}
.bd-sizer{position:relative}
.board{position:absolute;left:0;top:0;transform-origin:0 0;background:#c49a62;background-image:radial-gradient(rgba(90,55,20,.35) 1px,transparent 1.6px),radial-gradient(rgba(255,240,210,.25) 1px,transparent 1.8px),radial-gradient(circle at 30% 20%,#d2a96f,#b88a52);background-size:9px 9px,13px 13px,100% 100%;background-position:0 0,4px 6px,0 0}
.bd-map,.bd-str{position:absolute;inset:0;pointer-events:none}
.bd-map path{fill:rgba(90,58,25,.16);stroke:rgba(90,58,25,.28);stroke-width:.6}
.bd-map .tie{stroke:rgba(40,30,20,.45);stroke-width:1;stroke-dasharray:3 3}.bd-map .spot{fill:#8b1d1d}
.bd-str{z-index:3}
.bd-str path{fill:none;stroke:#c1121f;stroke-width:2.6;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));transition:opacity .2s}
.bd-str .weak path{stroke:#7a4a1f;stroke-width:1.6;stroke-dasharray:5 4}.bd-str .weak text{stroke:#5a3410;font-size:10px}
.bd-str .mine path{stroke:#f5c400;stroke-width:3;stroke-dasharray:1 0}
.bd-str text{font-size:12px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#7a0e14;stroke-width:3px}
.bd-str .dim{opacity:.15}.bd-str .hot path{stroke-width:4.2}.bd-str .auto.hot path{stroke:#ff2d3d}

.note{position:absolute;display:flex;flex-direction:column;gap:2px;text-align:left;background:#fffbe8;color:#2a2116;border:0;border-top:6px solid var(--tape);border-radius:2px;padding:10px 8px 6px;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;font-size:12px;line-height:1.35;font-family:var(--f-body);transform:rotate(var(--r));overflow:hidden;touch-action:none}
.note b{font-size:13px}.note small{color:#7a6a55;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:auto}
.note span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.note.mine .mtx{-webkit-line-clamp:3;font-weight:700}
.note.on{outline:3px solid #ff2d3d;z-index:4;transform:rotate(0) scale(1.06)}
.note.mine.on{outline-color:#1e63d6}
.pinhead{position:absolute;top:-1px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#c1121f 60%,#7a0e14);box-shadow:0 2px 3px rgba(0,0,0,.45)}

.bd-detail .bd-card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

.gd-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:1.5rem;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}

.gd-msg{display:flex;flex-direction:column;gap:8px}
.gd-msg.me{align-items:flex-end}
.gd-q{background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:16px 16px 4px 16px;max-width:85%;font-weight:700}
.gd-a{background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:4px 16px 16px 16px;max-width:100%}

.gd-out:empty{display:none}
.gd-lk{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0 2px;font-size:.88rem}
.gd-deep{align-self:flex-start}
.gd-in{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 16px rgba(0,0,0,.12)}
</style>
</head>
<body>

  <div class="wrap">

(function(){
"use strict";
const D = window.NEWS_DATA;
const main = document.getElementById("main");
const GN = {pol:"政治",eco:"経済",soc:"社会・災害",it:"情報・IT",intl:"国際",spo:"スポーツ・科学",ent:"エンタメ",fas:"ファッション",home:"インテリア・DIY",food:"レシピ・料理",life:"ライフスタイル",trip:"旅行",pred:"予測の判定"};

const bold = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// 今日(日本時間)
function jstToday(){ const n=new Date(Date.now()+9*3600e3); return n.toISOString().slice(0,10); }
const TODAY = jstToday();
function md(iso){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d)); return {m, d, w:WD[dt.getUTCDay()], y}; }
function mdLabel(iso){ const x=md(iso); return `${x.m}/${x.d}(${x.w})`; }
function daysFrom(iso){ return Math.round((Date.parse(iso)-Date.parse(TODAY))/864e5); }
function relDay(iso){ const n=daysFrom(iso); return n===0?"今日":n===1?"明日":n===-1?"きのう":mdLabel(iso); }

document.getElementById("upd").innerHTML = `最終更新<br><b class="num">${esc(D.updatedLabel)}</b>`;

const STATS = { on:false, code:"" };
let gcReady=false; const gcQueue=[];
function track(path,title){ if(!STATS.on||!STATS.code) return; const ev={path:String(path).slice(0,80),title:String(title||path).slice(0,80),event:true};
  if(gcReady&&window.goatcounter&&window.goatcounter.count){ try{ window.goatcounter.count(ev); }catch(_){} } else gcQueue.push(ev); }

  sc.onload=()=>{ gcReady=true; try{ window.goatcounter.count({path:"/",title:"ひらいた"}); }catch(_){} gcQueue.splice(0).forEach(ev=>{ try{ window.goatcounter.count(ev); }catch(_){} }); }; document.head.appendChild(sc); }

  ["yellow","きいろ", "#a16207","#f8e49c","#faedc0","#fffcf0","#fdf5da","#e6d8a2", "#fcd34d","#3a3015","#17140a","#231f10","#2b2614","#433b20"],
  ["purple","むらさき","#7c3aed","#ddd0fc","#e7dcfc","#faf7ff","#f2ecfe","#cfc0f4", "#b794ff","#2e2150","#150f24","#1f1833","#271f40","#3a2f5c"],
  ["orange","オレンジ","#d9480f","#fcd2b8","#fde0cc","#fff7f1","#feeee2","#f0c6ab", "#ff9a4d","#45260f","#1c120a","#281a10","#312015","#4a3221"],
  ["pink","ピンク",   "#db2777","#f9c6dc","#fadbe9","#fff4f9","#fde9f2","#f0bdd3", "#ff7eb6","#4a1a33","#1d0e16","#2a1520","#331a28","#4d2a3d"],

// ===== 季節の飾り(期間中だけ自動で変わる。着せかえでオフにできる) =====
const BAT='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 16"><path d="M20 6c-1-3-3-3-3-3s0 2-1 3c-3-3-9-4-16-1 4 1 6 4 6 7 2-2 5-2 7 0 1-2 3-2 4-1 0-1 2-2 3-2s3 1 3 2c1-1 3-1 4 1 2-2 5-2 7 0 0-3 2-6 6-7-7-3-13-2-16 1-1-1-1-3-1-3s-2 0-3 3z" fill="#2b1840"/></svg>';

  { k:"halloween", name:"ハロウィン", icon:"🎃", from:"10-24", to:"10-31",

(function(){ const st=document.createElement("style"); let s="";

  const HWPAT=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 22" width="96" height="22"><g transform="translate(4 2) scale(.5)">${PUMP.replace(/^<svg[^>]*>|<\/svg>$/g,"")}</g><g transform="translate(46 4) scale(.6)">${BAT.replace(/^<svg[^>]*>|<\/svg>$/g,"").replace("#2b1840","#7a5aa8")}</g><circle cx="80" cy="6" r="1.4" fill="#f5b342"/><circle cx="34" cy="16" r="1" fill="#f5b342"/></svg>`;

function storyKeys(e){ if(!st) return; if(e.key==="Escape") closeStory(); if(e.key==="ArrowRight") show(st.i+1); if(e.key==="ArrowLeft") show(st.i-1); if(e.key===" "){e.preventDefault(); setPause(!st.paused);} }
function speak(txt){ try{ const s=window.speechSynthesis; if(!s) return; s.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang="ja-JP"; u.rate=1.05; s.speak(u);}catch(e){} }

function show(i){
  if(!st) return; if(i<0) i=0; if(i>=st.S.length){ closeStory(); return; }
  st.i=i; st.el=0; st.t0=performance.now();
  const stage=document.getElementById("stStage"); stage.querySelectorAll(".slide").forEach(s=>s.remove());
  const s=document.createElement("div"); s.className="slide"; s.innerHTML=st.S[i].h; stage.prepend(s);

  document.querySelectorAll("#story .bars b").forEach((b,k)=>b.style.width=k<i?"100%":"0");
  const cnt=s.querySelector("[data-count]"); if(cnt) countUp(cnt);

  cancelAnimationFrame(st.raf); if(!st.paused) tick();
}
function countUp(el){ const target=parseFloat(el.dataset.count); const dec=(el.dataset.count.split(".")[1]||"").length; const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; if(reduce){el.textContent=target.toFixed(dec);return;} const t0=performance.now(); const f=t=>{const p=Math.min(1,(t-t0)/1400); const e=1-Math.pow(1-p,3); el.textContent=(target*e).toFixed(dec); if(p<1) requestAnimationFrame(f);}; requestAnimationFrame(f); }
function tick(){ st.raf=requestAnimationFrame(now=>{ if(!st||st.paused) return; st.el=now-st.t0; const bar=document.querySelectorAll("#story .bars b")[st.i]; if(bar) bar.style.width=Math.min(100,st.el/DUR*100)+"%"; if(st.el>=DUR){ show(st.i+1); return; } tick(); }); }

const GTERMS = D.glossary.map(w=>({key:w[0].replace(/\(.*?\)/,""),w})).sort((a,b)=>b.key.length-a.key.length);
function glossify(html){
  const used=new Set();
  return html.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,text)=>{ if(tag) return tag; let t=text;
    GTERMS.forEach(({key},i)=>{ if(used.has(key)) return; const idx=t.indexOf(key); if(idx<0) return; used.add(key);
      t=t.slice(0,idx)+`\u0000${i}\u0001`+t.slice(idx+key.length); });
    return t.replace(/\u0000(\d+)\u0001/g,(_,i)=>`<button class="gl" data-gi="${i}">${esc(GTERMS[i].key)}</button>`); });
}

function animateFlow(){

  f.classList.add("anim"); items.forEach(x=>x.classList.remove("on","now"));
  items.forEach((x,i)=>setTimeout(()=>{ items.forEach(y=>y.classList.remove("now")); x.classList.add("on"); if(x.classList.contains("fstep")) x.classList.add("now"); if(i===items.length-1) setTimeout(()=>{x.classList.remove("now"); f.classList.remove("anim"); items.forEach(y=>y.classList.remove("on"));},1400); }, 300+i*650));

// ===== 案内係(サイトの中の情報から答える。外には何も送らない) =====
const GD_STOP = /(ってなに|って何|でしょうか|ですか|教えて|おしえて|について|知りたい|ください|どういうこと|って|とは|なの|なに|何|は$|の$|か$)/g;
const gdNorm = s => String(s||"").normalize("NFKC").toLowerCase().replace(/\*\*/g,"").replace(/[?？!！。、,.・「」『』()\s　:：〜~]/g,"");
function gdGrams(s){ const t=gdNorm(s).replace(GD_STOP," ").replace(/\s+/g," ").trim(); const g=new Set(); t.split(" ").forEach(w=>{ if(w.length===1 && /[一-鿿゠-ヿA-Za-z0-9]/.test(w)) g.add(w); for(let i=0;i<w.length-1;i++) g.add(w.slice(i,i+2)); }); return [...g]; }
function gdScore(qg,text){ if(!qg.length) return 0; const t=gdNorm(text); let hit=0; qg.forEach(x=>{ if(t.includes(x)) hit++; }); let ex=0; (qg.ex||[]).forEach(x=>{ if(t.includes(x)) ex++; }); return Math.min(1,(hit+Math.min(ex,2)*0.5)/qg.length); }
const GD_SYN=[[/いつ/,"月から 始まる 日に 年"],[/安く|安い|下が/,"下げる 軽く 減"],[/高く|高い|上が|値上/,"上がる 高値 値上がり"],[/なぜ|どうして|なんで|理由/,"ため 原因 理由"],[/だれ|誰/,"首相 選手 氏 政権"],[/どこ/,"場所 市 県 国 球場"],[/どうなる|これから|今後/,"次 予定 見通し 予測"]];
function gdQuery(q){ const g=gdGrams(q); const ex=new Set(); GD_SYN.forEach(([re,w])=>{ if(re.test(q)) w.split(" ").forEach(x=>{ if(x.length>=2) for(let i=0;i<x.length-1;i++) ex.add(x.slice(i,i+2)); }); }); g.ex=[...ex].filter(x=>!g.includes(x)); return g; }
let GD_DOCS=null;
function gdDocs(){ if(GD_DOCS) return GD_DOCS; const L=[];
  Object.entries(D.explainers).forEach(([k,e])=>{
    (e.faq||[]).forEach(([q,a])=>L.push({t:"faq",k,g:e.g,q,a,key:q+" "+q+" "+e.name,body:a}));
    const sent=[e.kid,...(e.more||[]),...(e.us||[]).map(u=>String(u).replace(/\*\*/g,"")),...(e.timeline||[]).map(t=>t.join(" ")),...(e.next||[]).map(t=>Array.isArray(t)?t.join(" "):String(t))].filter(Boolean).flatMap(x=>String(x).split(/(?<=。)/)).map(x=>x.trim()).filter(x=>x.length>4);
    L.push({t:"ex",k,g:e.g,q:e.name,a:e.kid,key:e.name+" "+e.name+" "+(e.now||""),body:"",sent});
  });
  D.glossary.forEach(w=>L.push({t:"word",g:w[4],q:w[0],a:w[2]+(w[3]?` (たとえば: ${w[3]})`:""),key:w[0]+" "+w[1],body:w[2],w:w[0].replace(/\(.*?\)/,"")}));
  GD_DOCS=L; return L; }
function gdIntent(q){ const n=gdNorm(q); return {
  today:/(今日|きょう).*(ニュース|話題|なに|何)|ニュース.*(今日|きょう)|いちばん|一番|トップ/.test(n),
  weather:/天気|傘|雨|気温|寒|暑|服/.test(n),
  market:/日経|株|円相場|ドル|原油|ガソリン/.test(n),
  when:/いつ|何日|予定|日程/.test(n) }; }
function guideFind(q,focus){
  const qg=gdQuery(q); const nq=gdNorm(q); const docs=gdDocs();
  const sc=docs.map(d=>{ let s=gdScore(qg,d.key)*1.0 + (d.body?gdScore(qg,d.body)*0.45:0);
    if(d.sent){ let bs=0,bx=null; const when=/いつ|何日|何月/.test(q); d.sent.forEach(x=>{ const v=gdScore(qg,x)+(when&&/\d+(月|年)/.test(x)?0.2:0); if(v>bs){bs=v;bx=x;} }); s+=bs*0.8; d.hit=bs>=0.3?bx:null; }
    if(d.t==="word" && d.w && d.w.length>=2 && nq.includes(gdNorm(d.w))){ const core=gdNorm(q).replace(GD_STOP,""); const r=d.w.length/Math.max(1,core.length); s+= r>=0.5 ? 1.2 : 0.3; }
    if(focus && d.k===focus) s+=0.25; if(d.t==="faq") s+=0.05; return {d,s}; }).sort((a,b)=>b.s-a.s);
  const I=gdIntent(q); const th=(I.weather||I.market||I.today)?0.75:0.45;
  const best = sc[0] && sc[0].s>=th ? sc[0] : null;
  const words = sc.filter(x=>x.d.t==="word" && x.s>=0.6 && (!best||x.d!==best.d) && nq.includes(gdNorm(x.d.w))).slice(0,2).map(x=>x.d);
  const news = NEWS.map(n=>({n,s:gdScore(qg,n.h+" "+(n.th||"")+" "+(n.s||""))})).filter(x=>x.s>=0.34).sort((a,b)=>b.s-a.s||b.n.d.localeCompare(a.n.d)).slice(0,3).map(x=>x.n);
  const plans = D.schedule.filter(s=>(s[1]||s[0])>=TODAY).map(s=>({s,v:gdScore(qg,s[3]+" "+(s[5]||""))})).filter(x=>x.v>=0.34).sort((a,b)=>b.v-a.v).slice(0,3).map(x=>x.s);
  return {best: best&&best.d, words, news, plans, intent:I};
}
function guideAnswerHTML(q,focus){
  const r=guideFind(q,focus); const parts=[];
  const I=r.intent;
  if(I.today){ parts.push(`<div class="gd-a"><b>今日のニュース 上位3つ</b><ol class="us" style="margin:4px 0 0">${D.top10.slice(0,3).map(n=>`<li>${n.icon} ${esc(n.title)}${n.ex?` <button class="gd-lk" data-gex="${n.ex}">解説 →</button>`:""}</li>`).join("")}</ol></div>`); }

  if(I.market){ const n=lastVal(1), y=lastVal(2), o=lastVal(3); parts.push(`<div class="gd-a"><b>📈 いちばん新しい数字</b><br>日経平均 ${n?n.v.toLocaleString("ja-JP")+"円("+mdLabel(n.d)+")":"—"} ・ 1ドル ${y?y.v.toFixed(2)+"円":"—"} ・ NY原油 ${o?o.v.toFixed(2)+"ドル":"—"} <button class="gd-lk" data-gtab="numbers">グラフ →</button></div>`); }
  if(r.best){ const d=r.best; const e=d.k&&D.explainers[d.k];

    parts.push(`<div class="gd-a"><b>${d.t==="word"?"📖 "+esc(d.q):d.t==="faq"?"Q. "+esc(d.q):"💡 "+esc(d.q)}</b><br>${esc(d.t==="ex"&&d.hit?d.hit:d.a)}<div class="hint">${from}${d.k&&d.k!==focus?` <button class="gd-lk" data-gex="${d.k}">解説を読む →</button>`:""}</div></div>`); }
  r.words.forEach(w=>parts.push(`<div class="gd-a"><b>📖 ${esc(w.q)}</b><br>${esc(w.a)}</div>`));
  if(r.plans.length && (I.when||!r.best)) parts.push(`<div class="gd-a"><b>📅 これからの予定</b><ul class="us" style="margin:4px 0 0">${r.plans.map(s=>`<li>${esc(mdLabel(s[0]))} ${esc(s[3])}</li>`).join("")}</ul></div>`);
  if(r.news.length) parts.push(`<div class="gd-a"><b>📰 関係するニュース</b><ul class="us" style="margin:4px 0 0">${r.news.map(n=>`<li>${esc(mdLabel(n.d))} ${esc(n.h)} ${n.ok?"✅":"⚠️"}</li>`).join("")}</ul></div>`);
  if(!parts.length) parts.push(`<div class="gd-a">このアプリの中には、ぴったりの答えが見つかりませんでした。ことばを短くして聞きなおすか、下のボタンでClaudeに聞いてみてください。</div>`);
  if(r.best&&r.best.g) learn(r.best.g,1);
  track("/ask/"+(r.best?(r.best.k||"word"):(I.today?"today":I.weather?"weather":I.market?"market":"none")),"案内係");
  return parts.join("")+`<button class="fchip gd-deep" data-deep="1">🤖 Claudeでもっと深く聞く(アプリの外で開きます)</button>`;
}
function bindGuideOut(el,q,focus){

(function(){ if(!ME.days.includes(TODAY)){ ME.days.push(TODAY); ME.days=ME.days.slice(-400); } saveMe(); })();
function streak(){ const set=new Set(ME.days); let c=0; let d=new Date(Date.parse(TODAY)); while(set.has(d.toISOString().slice(0,10))){ c++; d=new Date(d.getTime()-864e5); } return c; }
function bestStreak(){ const ds=[...ME.days].sort(); let best=0,cur=0,prev=null; ds.forEach(d=>{ cur = prev && Date.parse(d)-Date.parse(prev)===864e5 ? cur+1 : 1; best=Math.max(best,cur); prev=d; }); return best; }
// 新着(前回見たあとに増えたニュース)
const FIRST_VISIT = ME.seen.length===0;
const PREV_SEEN = new Set(ME.seen);
const NEW_KEYS = new Set(FIRST_VISIT?[]:NEWS.filter(n=>!PREV_SEEN.has(nkey(n))).map(nkey));
ME.seen = NEWS.map(nkey).slice(0,800); saveMe();
const isNew = n => NEW_KEYS.has(nkey(n));

function interestScore(g){ return (ME.interests[g]?5:0) + Math.min(4,(ME.auto[g]||0)/2); }
function learn(g,w){ if(!g) return; ME.auto[g]=(ME.auto[g]||0)+(w||1); saveMe(); }
function hasInterests(){ return Object.values(ME.interests).some(Boolean); }
// 予想ゲームの採点
function voteResults(){ let win=0, lose=0, half=0, open=0; const settled=[];
  Object.entries(ME.votes).forEach(([no,v])=>{ const p=PRED.find(x=>x.no===no); if(!p) return; if(p.r==="wait"){ open++; return; }
    const ok = p.r==="part" ? "half" : ((p.r==="hit")===(v.v==="yes") ? "win" : "lose");
    if(ok==="win") win++; else if(ok==="lose") lose++; else half++; settled.push({p,v,ok}); });
  return {win,lose,half,open,settled}; }

  return ME.days.length*2 + Object.keys(ME.readEx).length*3 + quizOK*2 + ME.words.length + vr.win*5 + vr.half*2; }

// ===== 1週間のふりかえり(スライド) =====
function buildWeekSlides(){
  const since=new Date(Date.parse(TODAY)-6*864e5).toISOString().slice(0,10);
  const W=NEWS.filter(n=>n.d>=since); const okW=W.filter(n=>n.ok);
  const glow = c => `<div class="glow" style="background:radial-gradient(circle at 30% 30%, ${c}, transparent 60%)"></div>`;
  const th={}; W.forEach(n=>(n.th||"").split(/[、,]/).filter(Boolean).forEach(t=>th[t]=(th[t]||0)+1));
  const topTh=Object.entries(th).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const gc={}; W.forEach(n=>gc[n.g]=(gc[n.g]||0)+1);
  const S=[];
  S.push({h:`${glow("#3b5bff")}<div class="kick an">1週間のふりかえり</div><h2 class="an d1">${mdLabel(since)}〜${mdLabel(TODAY)}</h2><p class="an d2">この1週間に記録したニュースは <b class="num">${W.length}件</b>。そのうち2社以上で確かめたものは <b class="num">${okW.length}件</b>。</p>`, say:`1週間のふりかえりです。記録したニュースは${W.length}件でした。`});
  if(topTh.length) S.push({h:`${glow("#ef4444")}<div class="kick an">よく出てきた話題</div><ol class="mini">${topTh.map(([t,c],i)=>`<li class="an d${i+1}"><b>${esc(t)}</b> … ${c}件</li>`).join("")}</ol><p class="an d4" style="opacity:.8">同じ話題が何日も続くと、流れが見えてきます。</p>`, say:"よく出てきた話題は、"+topTh.map(x=>x[0]).join("、")+"でした。"});
  const bars=GORDER.filter(g=>gc[g]).map(g=>`<div class="an d1" style="display:grid;grid-template-columns:7.5em 1fr 2.5em;gap:8px;align-items:center;font-size:.95rem"><span>${GN[g]}</span><span style="height:12px;border-radius:6px;background:var(--g-${g});width:${Math.max(6,gc[g]/Math.max(...Object.values(gc))*100)}%"></span><span class="num">${gc[g]}</span></div>`).join("");
  S.push({h:`${glow("#22a35a")}<div class="kick an">ジャンル別の数</div><div style="display:flex;flex-direction:column;gap:10px">${bars}</div>`, say:"ジャンル別の数です。"});
  const picks=GORDER.map(g=>okW.find(n=>n.g===g)).filter(Boolean).slice(0,5);
  if(picks.length) S.push({h:`${glow("#a855f7")}<div class="kick an">ジャンルごとの1本</div><ol class="mini">${picks.map((n,i)=>`<li class="an d${Math.min(4,i+1)}"><b>${GN[n.g]}</b> ${esc(n.h)}</li>`).join("")}</ol>`, say:picks.map(n=>n.h).join("。")});
  const myDays=ME.days.filter(d=>d>=since).length; const myEx=Object.values(ME.readEx).filter(d=>d>=since).length;
  S.push({h:`${glow("#f59e0b")}<div class="kick an">あなたの1週間</div><div class="huge an d1 num">${myDays}<span style="font-size:.4em"> 日</span></div><p class="an d2">開いた日 ${myDays}日 ・ 読んだ解説 ${myEx}本 ・ いま ${streak()}日連続</p><p class="an d3" style="opacity:.8">続けるほど、話題の「つながり」が見えるようになります。</p>`, say:`あなたは今週${myDays}日開きました。`});
  return S;
}

function seeded(seed){ let s=0; for(const c of seed) s=(s*31+c.charCodeAt(0))>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

  const cut=t=>{ const x=t.split("。")[0]; return x.length>40?x.slice(0,38)+"…":x; };
  return pool.slice(0,3).map((w,i)=>{ const others=W.filter(o=>o!==w).sort(()=>r()-.5).slice(0,3).map(o=>cut(o[2])); const a=Math.floor(r()*4); const o=[...others]; o.splice(a,0,cut(w[2])); return {q:`「${w[0].replace(/\(.*?\)/,"")}」の意味は?`,o,a,e:`${w[0]}: ${w[2]}`}; }); }

    const setZ=z=>{ const cx=(wrap.scrollLeft+wrap.clientWidth/2)/BD.z, cy=(wrap.scrollTop+wrap.clientHeight/2)/BD.z; BD.z=z; bd.style.transform=`scale(${z})`; sizer.style.width=BW*z+"px"; sizer.style.height=BH*z+"px"; wrap.scrollLeft=cx*z-wrap.clientWidth/2; wrap.scrollTop=cy*z-wrap.clientHeight/2;
      document.querySelectorAll("#bdTools [data-z]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.z===z))); };
    document.querySelectorAll("#bdTools [data-z]").forEach(b=>b.onclick=()=>setZ(+b.dataset.z));
    const show=()=>{ drawNotes(); drawStrings(); bindNotes(); detail(); };
    function centerOn(n){ wrap.scrollTo({left:(n.x+n.w/2)*BD.z-wrap.clientWidth/2, top:(n.y+n.h/2)*BD.z-wrap.clientHeight/2, behavior:"smooth"}); }
    function detail(){ const n=BD.sel&&find(BD.sel); if(!n){ det.innerHTML=`<p class="hint" style="margin:0">${groups.length}か所 ・ 赤い糸 ${auto.filter(e=>!e.weak).length}本${auto.some(e=>e.weak)?` ・ 茶色の点線(同じジャンル) ${auto.filter(e=>e.weak).length}本`:""}${B.links.length?` ・ 黄色い糸 ${B.links.length}本`:""}。メモをタップしてね。</p>`; return; }
      const links=[...auto,...B.links].filter(e=>e.a===n.id||e.b===n.id).map(e=>{ const o=find(e.a===n.id?e.b:e.a); return {o,t:e.t,mine:B.links.includes(e)}; }).filter(x=>x.o);
      const nm=o=>o.g?o.g.p[3]:"📝 "+(o.u.text||"メモ").slice(0,12);
      const linkHTML=links.length?`<div class="chips" style="margin-top:8px">${links.map(l=>`<button class="fchip" data-go="${esc(l.o.id)}">🧵 ${esc(nm(l.o))}${l.t?` ・ ${esc(l.t)}`:""}</button>`).join("")}</div>`:"";
      if(n.g){ det.innerHTML=`<div class="bd-card"><b>📌 ${esc(n.g.p[3])}(${n.g.list.length}件)</b><ul class="us" style="margin-top:4px">${n.g.list.slice(0,6).map(x=>`<li>${esc(mdLabel(x.d))} ${esc(x.h)} ${x.ok?"✅":"⚠️"}</li>`).join("")}</ul>${n.g.list.length>6?`<div class="hint">ほか${n.g.list.length-6}件</div>`:""}${linkHTML}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="fchip" data-linkfrom="${esc(n.id)}">🧵 ここから糸を引く</button><button class="fchip" data-clear="1">✕ 選ぶのをやめる</button></div></div>`; }
      else { det.innerHTML=`<div class="bd-card"><b>📝 あなたのメモ</b><textarea class="memo" id="bdTxt" rows="3" maxlength="120" placeholder="気づいたこと・つながりそうなこと">${esc(n.u.text||"")}</textarea>${linkHTML}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="fchip" data-linkfrom="${esc(n.id)}">🧵 ここから糸を引く</button><button class="fchip" id="bdDel">🗑 はがす</button><button class="fchip" data-clear="1">✕ とじる</button></div></div>`;
        const t=document.getElementById("bdTxt"); t.oninput=()=>{ n.u.text=t.value.slice(0,120); saveMe(); const el=bd.querySelector(`[data-id="${CSS.escape(n.id)}"] .mtx`); if(el) el.textContent=n.u.text||"(タップして書く)"; };
        document.getElementById("bdDel").onclick=()=>{ B.notes=B.notes.filter(x=>x.id!==n.id); B.links=B.links.filter(e=>e.a!==n.id&&e.b!==n.id); saveMe(); BD.sel=null; show(); }; }
      det.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ BD.sel=b.dataset.go; show(); centerOn(find(BD.sel)); });
      det.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{ BD.sel=null; show(); });
      det.querySelectorAll("[data-linkfrom]").forEach(b=>b.onclick=()=>{ BD.mode="link"; BD.from=b.dataset.linkfrom; msg.innerHTML="🧵 つなぎたいメモをタップしてね <button class=\"fchip\" id=\"bdCancel\">やめる</button>"; msg.classList.add("on"); document.getElementById("bdCancel").onclick=endLink; }); }
    function endLink(){ BD.mode=""; BD.from=null; msg.classList.remove("on"); msg.textContent="メモをタップすると、その糸が光ります。"; }
    function tapNote(id){ if(BD.mode==="link"){ if(!BD.from){ BD.from=id; msg.innerHTML="🧵 つぎに、つなぎたい相手のメモをタップ <button class=\"fchip\" id=\"bdCancel\">やめる</button>"; document.getElementById("bdCancel").onclick=endLink; return; }
        if(BD.from!==id && !B.links.some(e=>(e.a===BD.from&&e.b===id)||(e.a===id&&e.b===BD.from))){ B.links.push({a:BD.from,b:id}); saveMe(); toast("🧵 糸でつなぎました"); } endLink(); BD.sel=id; show(); return; }
      BD.sel = BD.sel===id ? null : id; show(); }
    function bindNotes(){ bd.querySelectorAll(".note").forEach(el=>{ const id=el.dataset.id; const u=B.notes.find(x=>x.id===id);
      if(!u){ el.onclick=()=>tapNote(id); return; }
      let st=null; el.onpointerdown=e=>{ st={x:e.clientX,y:e.clientY,ox:u.x,oy:u.y,moved:false}; el.setPointerCapture(e.pointerId); };
      el.onpointermove=e=>{ if(!st) return; const dx=(e.clientX-st.x)/BD.z, dy=(e.clientY-st.y)/BD.z; if(Math.abs(dx)+Math.abs(dy)>6) st.moved=true; if(!st.moved) return; e.preventDefault(); u.x=Math.max(4,Math.min(BW-134,st.ox+dx)); u.y=Math.max(14,Math.min(BH-82,st.oy+dy)); el.style.left=u.x+"px"; el.style.top=u.y+"px"; drawStrings(); };
      el.onpointerup=()=>{ if(!st) return; const mv=st.moved; st=null; if(mv) saveMe(); else tapNote(id); };
      el.onkeydown=e=>{ if(e.key==="Enter") tapNote(id); }; }); }
    document.getElementById("bdAdd").onclick=()=>{ const x=Math.max(4,Math.min(BW-134,(wrap.scrollLeft+wrap.clientWidth/2)/BD.z-65)), y=Math.max(14,Math.min(BH-82,(wrap.scrollTop+wrap.clientHeight/2)/BD.z-39));
      const u={id:"u:"+Date.now().toString(36),x,y,text:"",r:Math.round(Math.random()*6-3)}; B.notes.push(u); saveMe(); BD.sel=u.id; show(); setTimeout(()=>{ const t=document.getElementById("bdTxt"); if(t) t.focus(); },50); };
    document.getElementById("bdLink").onclick=()=>{ if(BD.mode==="link"){ endLink(); return; } BD.mode="link"; BD.from=null; msg.innerHTML="🧵 つなぎたいメモを2つ、順にタップしてね <button class=\"fchip\" id=\"bdCancel\">やめる</button>"; msg.classList.add("on"); document.getElementById("bdCancel").onclick=endLink; };
    bd.addEventListener("click",e=>{ if(e.target===bd||e.target.closest(".bd-map")){ if(BD.mode!=="link"&&BD.sel){ BD.sel=null; show(); } } });
    const petEl=document.getElementById("bdPet"); let hintI=0;
    const hints=()=>{ const H=[]; auto.forEach(e=>{ const A=find(e.a),Bn=find(e.b); if(A&&Bn&&A.g&&Bn.g) H.push(`「${e.t}」で、${A.g.p[3]}と${Bn.g.p[3]}がつながってる…あやしい!`); });
      H.push("気づいたことは📝メモに書いて、🧵糸でつないでみて!"); if(B.links.length) H.push(`黄色い糸が${B.links.length}本。いい推理だね、名探偵!`); const big=notes.slice().sort((a,b)=>b.g.list.length-a.g.list.length)[0]; if(big) H.push(`いちばん事件が多いのは「${big.g.p[3]}」。${big.g.list.length}件もある!`); return H; };
    const say=()=>{ const H=hints(); const st=petStage(); petEl.innerHTML=`<button class="bd-pet-av" aria-label="${esc(petName())}のヒント">${petSVG(st.i,"happy",null,64,"detective")}</button><div class="bd-bubble"><b>🔍 ${esc(petName())}探偵</b><span>${esc(H[hintI%H.length])}</span></div>`; petEl.querySelector("button").onclick=()=>{ hintI++; say(); }; };
    say();
    setZ(BD.z); show(); const j=jp||(isJ?notes.find(n=>n.g.p[3]==="東京"):null)||notes[0]; if(j&&!BD.sel){ wrap.scrollLeft=(j.x+j.w/2)*BD.z-wrap.clientWidth*.65; wrap.scrollTop=(j.y)*BD.z-wrap.clientHeight*.3; } else if(BD.sel&&find(BD.sel)) centerOn(find(BD.sel));
  }).catch(e=>{ try{ console.error(e); }catch(_){} const bd=document.getElementById("board"); if(bd) bd.innerHTML='<div class="empty">ボードを読み込めませんでした。通信状態を確かめて、開き直してください。</div>'; });
}
// ===== 写真(Unsplash・撮影者名つき) =====
const PHOTOS={
  saudi:["https://images.unsplash.com/photo-1516199423456-1f1e91b06f25?w=1000&q=70&auto=format&fit=crop","Zbynek Burival"],
  tax:["https://images.unsplash.com/photo-1681369738123-e8d551a9ecfd?w=1000&q=70&auto=format&fit=crop","Ishaq Robin"],
  sato:["https://images.unsplash.com/photo-1582650448629-3c854f356544?w=1000&q=70&auto=format&fit=crop","Mick Haupt"],
  series:["https://images.unsplash.com/photo-1784657258179-27f2e692b62e?w=1000&q=70&auto=format&fit=crop","Steve DiMatteo"],
  yokohama:["https://images.unsplash.com/photo-1785899472269-51981778ccbd?w=1000&q=70&auto=format&fit=crop","ITT CU"],
  past:["https://images.unsplash.com/photo-1435527173128-983b87201f4d?w=1000&q=70&auto=format&fit=crop","Eric Rothermel"]
};
function photoBlock(k){ const p=PHOTOS[k]; if(!p) return ""; return `<figure class="photo"><img src="${p[0]}" alt="" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>📷 イメージ写真: ${esc(p[1])} / <a href="https://unsplash.com/?utm_source=mainichi_news&utm_medium=referral" target="_blank" rel="noopener">Unsplash</a></figcaption></figure>`; }

// ===== 解説の読み上げ =====
function speakEx(k,btn){ const e=D.explainers[k]; if(!e) return; try{ const s=window.speechSynthesis; if(!s) return;
  if(s.speaking){ s.cancel(); btn.textContent="🔊 聞く"; return; }
  const txt=[e.name,"ひとことで言うと。",e.kid,e.more[0],e.more[1],"わたしたちへの影響。",...e.us.map(u=>u.replace(/\*\*/g,"")),...e.faq.map(([q,a])=>q+" "+a)].join("。 ");
  const u=new SpeechSynthesisUtterance(txt); u.lang="ja-JP"; u.rate=1.05; u.onend=()=>{ btn.textContent="🔊 聞く"; }; s.speak(u); btn.textContent="■ 止める"; }catch(_){} }

// 起動
document.getElementById("bellBtn").onclick=openUpdates; markBell();
document.getElementById("gdFab").onclick=openGuide;
const h=(location.hash||"").slice(1);
if(D.explainers[h]){ go("explain"); openEx(h); } else go(TABS.some(t=>t[0]===h)?h:"today");
try{ if(new URLSearchParams(location.search).get("play")==="1") setTimeout(openStory,300); }catch(_){}
})();
