<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2747c9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ニュース帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="毎日のニュースを、1分の動くスライド・検索・グラフ・解説・クイズで">
<title>まいにちニュース帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* 朝の掲示板: 1列のカード紙面 + 下のタブ。重要な数字だけ太い見出し書体で */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f6f8fa; --ink:#141b2d; --muted:#5a6478; --line:#d9dee6;
  --accent:#2747c9; --accent-soft:#e3e8fb; --warn:#c2410c; --warn-soft:#fdeee6; --ok:#15803d; --ok-soft:#e5f4ea;
  --g-pol:#2563c9; --g-eco:#17803f; --g-soc:#c25a0c; --g-it:#7c3aed; --g-intl:#c42b2b; --g-spo:#8a5a2b; --g-ent:#c0367a; --g-pred:#475569;
  --g-pol-s:#e4ecfa; --g-eco-s:#e4f3e9; --g-soc-s:#fbeadb; --g-it-s:#efe7fd; --g-intl-s:#fbe5e5; --g-spo-s:#f3eadf; --g-ent-s:#fbe4ef; --g-pred-s:#e9edf2;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --fs:16px; --radius:14px; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#171d2c; --surface2:#1d2436; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2a3247;
  --accent:#8ea4ff; --accent-soft:#232c4d; --warn:#fb923c; --warn-soft:#3a2416; --ok:#4ade80; --ok-soft:#163222;
  --g-pol:#7aa7ff; --g-eco:#5fd18a; --g-soc:#f59e5b; --g-it:#b794ff; --g-intl:#ff7b7b; --g-spo:#d6a46e; --g-ent:#ff8cc0; --g-pred:#a3b0c2;
  --on-accent:#0b1020; --g-pol-s:#1b2a48; --g-eco-s:#16301f; --g-soc-s:#352314; --g-it-s:#2a1f45; --g-intl-s:#3a1a1d; --g-spo-s:#33271b; --g-ent-s:#3b1a2b; --g-pred-s:#232a36;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#171d2c; --surface2:#1d2436; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2a3247;
  --accent:#8ea4ff; --accent-soft:#232c4d; --warn:#fb923c; --warn-soft:#3a2416; --ok:#4ade80; --ok-soft:#163222;
  --g-pol:#7aa7ff; --g-eco:#5fd18a; --g-soc:#f59e5b; --g-it:#b794ff; --g-intl:#ff7b7b; --g-spo:#d6a46e; --g-ent:#ff8cc0; --g-pred:#a3b0c2;
  --on-accent:#0b1020; --g-pol-s:#1b2a48; --g-eco-s:#16301f; --g-soc-s:#352314; --g-it-s:#2a1f45; --g-intl-s:#3a1a1d; --g-spo-s:#33271b; --g-ent-s:#3b1a2b; --g-pred-s:#232a36;
  color-scheme:dark}
:root[data-size="l"]{--fs:18px} :root[data-size="xl"]{--fs:20px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.7;margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:16px 0 0 var(--g-intl),32px 0 0 var(--g-eco);margin-right:34px}
.top .upd{font-size:.78rem;color:var(--muted);margin-left:auto;text-align:right;line-height:1.3}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;min-width:40px;height:40px;cursor:pointer;font-size:.9rem;padding:0 10px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding-block:6px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:10px;cursor:pointer;color:var(--muted);font-size:.7rem;min-width:0}
.tab .ti{font-size:1.25rem;line-height:1}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
@media (min-width:900px){
  body{padding-bottom:0}
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);z-index:19}
  .tab{flex-direction:row;justify-content:center;gap:6px;font-size:.88rem}
  .tab .ti{font-size:1rem}
}

main{padding-block:18px 32px}
.view{display:flex;flex-direction:column;gap:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.sec-h h2{font-size:1.2rem}
.sec-h .sub{font-size:.8rem;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--g-pred-s);color:var(--g-pred)}
.chip.pol{background:var(--g-pol-s);color:var(--g-pol)} .chip.eco{background:var(--g-eco-s);color:var(--g-eco)} .chip.soc{background:var(--g-soc-s);color:var(--g-soc)}
.chip.it{background:var(--g-it-s);color:var(--g-it)} .chip.intl{background:var(--g-intl-s);color:var(--g-intl)} .chip.spo{background:var(--g-spo-s);color:var(--g-spo)} .chip.ent{background:var(--g-ent-s);color:var(--g-ent)}
.badge-ok{color:var(--ok);font-size:.78rem;font-weight:700;white-space:nowrap}
.badge-one{color:var(--warn);font-size:.78rem;font-weight:700;white-space:nowrap}

/* hero row */
.hero{display:grid;grid-template-columns:1fr;gap:12px}
.play{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;cursor:pointer;border-radius:var(--radius);padding:16px 18px;background:var(--accent);color:var(--on-accent)}
.play .pi{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.2rem;flex:none}
.play b{display:block;font-size:1.08rem;color:inherit}
.play span{color:inherit}
.play span{font-size:.82rem;opacity:.9}

.weather{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.weather .big{font-family:var(--f-display);font-size:2rem;line-height:1;white-space:nowrap}
.weather .big small{font-size:.9rem;font-family:var(--f-body);color:var(--muted)}
.rainbar{display:flex;gap:6px;flex-wrap:wrap}
.rain{font-size:.8rem;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.weather .notes{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:8px 10px}

.three{display:grid;gap:10px}
.three .t{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px 16px;cursor:pointer;border-left:6px solid var(--g-pred)}
.three .t.pol{border-left-color:var(--g-pol)} .three .t.intl{border-left-color:var(--g-intl)} .three .t.spo{border-left-color:var(--g-spo)} .three .t.eco{border-left-color:var(--g-eco)}
.three .lab{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.three h3{font-size:1.08rem;margin:2px 0 4px}
.three p{margin:0;font-size:.9rem;color:var(--muted)}
.more{font-size:.82rem;color:var(--accent);font-weight:700}
@media (min-width:760px){.three{grid-template-columns:repeat(3,1fr)}}

.ten{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ten li{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ten .row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:12px 14px;width:100%;text-align:left;border:0;background:none;cursor:default}
.ten .row.link{cursor:pointer}
.rank{font-family:var(--f-display);font-size:1.25rem;line-height:1.2;color:var(--muted);text-align:center}
.ten .big .rank{color:var(--accent);font-size:1.6rem}
.ten h3{font-size:1rem;font-weight:700}
.ten .big h3{font-size:1.1rem}
.ten .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.ten p{margin:4px 0 0;font-size:.92rem}
.ten .pt{margin-top:6px;font-size:.88rem;background:var(--surface2);border-radius:8px;padding:6px 10px}

.bignum{display:flex;flex-direction:column;gap:6px}
.bignum .v{font-family:var(--f-display);font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.05;color:var(--g-eco)}
.bignum .v small{font-size:1.1rem}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mk .m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.mk .m .k{font-size:.74rem;color:var(--muted)}
.mk .m .val{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn{color:var(--g-intl);font-size:.8rem} .up{color:var(--g-eco);font-size:.8rem}

/* search */
.sbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px 6px 4px 14px}
.sbox:focus-within{border-color:var(--accent)}
.sbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:1.05rem;color:var(--ink);padding:10px 0;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .c{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.hist{display:flex;align-items:flex-end;gap:2px;height:46px;padding-top:4px}
.hist i{flex:1;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;min-height:2px}
.hist-l{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:14px}
.day h3{font-size:.9rem;color:var(--muted);margin-bottom:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);background:var(--bg);padding-block:4px;z-index:2}
.day ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .h{font-weight:700;font-size:.97rem}
.item .s{font-size:.78rem;color:var(--muted);margin-top:2px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
mark{background:#ffe066;color:#141b2d;border-radius:3px;padding:0 1px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.quick button{flex:none}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* personal */
:root{--map-sea:#dce8f3;--map-land:#f4f1ea;--map-jp:#fff;--map-line:#b9c4d2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--map-sea:#0f1a2c;--map-land:#26304a;--map-jp:#3a4766;--map-line:#41507a}}
:root[data-theme="dark"]{--map-sea:#0f1a2c;--map-land:#26304a;--map-jp:#3a4766;--map-line:#41507a}
.me-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ms{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;min-width:0;font-size:.78rem;line-height:1.25}
.ms b{display:block;font-size:.98rem}
.ms .mi{font-size:1.35rem}
.ms.new{border-color:var(--accent);background:var(--accent-soft)}
.newchip{background:var(--accent-soft);color:var(--accent)}
.result{border-color:var(--ok);background:var(--ok-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:rise .4s ease both;max-width:calc(100% - 32px);text-align:center}
.toast.out{opacity:0;transition:opacity .5s}
.lvrow{display:flex;gap:14px;align-items:center}
.lvbig{font-family:var(--f-display);font-size:2rem;color:var(--accent)}
.lvcard .bar{height:12px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.lvcard .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 6px}
.cal i{aspect-ratio:1;border-radius:6px;background:var(--surface2);border:1px solid var(--line)}
.cal i.on{background:var(--ok);border-color:var(--ok)}
.cal i.today{outline:2px solid var(--accent);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.bd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;background:var(--surface2);filter:grayscale(1);opacity:.45;text-align:center}
.bd span{font-size:1.6rem}.bd small{font-size:.72rem}
.bd.got{filter:none;opacity:1;background:var(--accent-soft)}
.vote{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.ics{margin-top:6px;font-size:.78rem;padding:3px 10px}
.mapbox{padding:8px}
.mapsvg svg{display:block;border-radius:10px}
.pin .pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(1.35);opacity:.05}}
.photo{margin:0}
.photo img{display:block;width:100%;aspect-ratio:12/6;object-fit:cover;border-radius:var(--radius);background:var(--surface2)}
.photo figcaption{font-size:.72rem;color:var(--muted);margin-top:4px}
@media (prefers-reduced-motion: reduce){.pin .pulse{animation:none}}

.lsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.lsum>div{background:var(--surface2);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.lsum b{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask .sbox{border-width:1px}

.ten li,.item{position:relative}
.pin-btn.abs{position:absolute;top:6px;right:6px;z-index:2;border:0;background:transparent;font-size:1.15rem;width:40px;height:40px;border-radius:10px;cursor:pointer;opacity:.55}
.pin-btn.abs[aria-pressed="true"]{opacity:1}
.ten .row,.item{padding-right:44px}
.pins{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.pinitem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.pinitem .h{font-weight:700}
.memo{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}

/* install */
.install{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.install img{width:48px;height:48px;border-radius:12px}
.install b{display:block}
.install .hint{display:block}
.offline{background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:.88rem}

/* illustrations */
.ill{border-radius:var(--radius);overflow:hidden;aspect-ratio:12/5;max-width:100%;border:1px solid var(--line)}
.excard .ico.ill{aspect-ratio:auto;width:56px;height:56px;border-radius:14px}
.ten .big .ill{margin:0 0 10px;aspect-ratio:12/4}
.story .ill{border:0;border-radius:16px;max-height:30vh}
.credit{font-size:.72rem;color:var(--muted);margin-top:4px}

/* quiz */
.quiz .qq{font-weight:700;font-size:1.02rem;margin:4px 0 10px}
.quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quiz .opt{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;cursor:pointer;font-weight:700;text-align:center}
.quiz .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz .opt.wrong{border-color:var(--g-intl);background:var(--g-intl-s)}
.quiz .exp{margin-top:10px;font-size:.92rem;background:var(--surface2);border-radius:10px;padding:8px 12px}
.quiz .qn{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.r{background:var(--ok)}.dots i.w{background:var(--g-intl)}.dots i.c{outline:2px solid var(--accent)}

/* explainers */
.exgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.exgrid{grid-template-columns:1fr 1fr}}
.excard{display:grid;grid-template-columns:56px 1fr;gap:12px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px;cursor:pointer;align-items:start}
.excard .ico{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;background:var(--surface2)}
.excard h3{font-size:1.02rem}
.excard p{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.st{font-size:.72rem;font-weight:700}
.st.live{color:var(--warn)} .st.done{color:var(--ok)}

.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .bar{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sheet .bar .wrap{display:flex;align-items:center;gap:10px;padding-block:8px}
.sheet .bar .ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .body{padding-block:16px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.kid{background:#fff6cc;color:#2a2410;border-radius:var(--radius);padding:16px 18px}
.kid .l{font-size:.78rem;font-weight:700;letter-spacing:.06em;opacity:.75}
.kid h2{font-size:1.25rem;margin-top:4px}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

let st=null;
function buildSlides(){

  S.push({c:"#0ea5e9", h:`${glow("#0ea5e9")}<div class="kick an">${esc(relDay(w.iso))}の${esc(w.place)}</div><div class="huge an d1 num">${w.hi}°<span style="font-size:.45em;opacity:.7"> / ${w.lo}°</span></div><h2 class="an d2" style="font-size:1.5rem">${esc(w.sky)}</h2><p class="an d3">☔ ${esc(w.umbrella)}</p>`, say:`${relDay(w.iso)}の東京は${w.sky}。最高${w.hi}度、最低${w.lo}度。${w.umbrella}。`});
  const tc={pol:"#2563eb",intl:"#ef4444",spo:"#c08443",eco:"#22a35a",soc:"#ea7a2a",it:"#8b5cf6",ent:"#e1508f"};
  D.three.forEach((x,i)=>S.push({c:tc[x.tone], h:`${glow(tc[x.tone])}<span class="tag an">${i+1} / 3 ・ ${esc(x.label)}</span>${ILL[x.ex]?`<div class="ill an d1">${ILL[x.ex]}</div>`:""}<h2 class="an d1">${esc(x.title)}</h2><p class="an d2">${esc(x.text)}</p>`, say:`${x.label}。${x.title}。${x.text}`}));
  S.push({c:"#22a35a", h:`${glow("#22a35a")}<div class="kick an">今日の数字</div><div class="huge an d1 num" data-count="${esc(D.number.value)}">0</div><div class="an d1" style="font-size:1.4rem;font-weight:700">${esc(D.number.unit)}</div><p class="an d2">${esc(D.number.caption)}</p>`, say:`今日の数字は${D.number.value}${D.number.unit}。${D.number.caption}`});
  const rest=t.slice(3,10);
  S.push({c:"#a855f7", h:`${glow("#a855f7")}<div class="kick an">ほかのニュース</div><ol class="mini" start="4">${rest.map((n,i)=>`<li class="an d${Math.min(4,i+1)}">${n.icon} ${esc(n.title)}</li>`).join("")}</ol>`, say:"ほかのニュースです。"+rest.map(n=>n.title).join("。")});
  S.push({c:"#3b5bff", h:`${glow("#3b5bff")}<h2 class="an">今日はここまで</h2><p class="an d1">くわしい解説やグラフは、下のタブから見られます。</p><p class="an d2" style="opacity:.7">次の更新: ${esc(D.nextLabel)}</p>`, say:"今日はここまでです。"});
  return S;
}
const DUR=7000;
function openStory(fn){
  const el=document.getElementById("story"); const S=(typeof fn==="function"?fn:buildSlides)();
  el.innerHTML=`<div class="bars">${S.map(()=>"<i><b></b></i>").join("")}</div>
    <div class="ctl"><span class="lbl" id="stLbl"></span><button class="sbtn" id="stVoice" aria-pressed="false">🔈 読み上げ</button><button class="sbtn" id="stPause" aria-label="一時停止">❚❚</button><button class="sbtn" id="stClose" aria-label="閉じる">✕</button></div>
    <div class="stage" id="stStage"><button class="tapl" aria-label="前へ"></button><button class="tapr" aria-label="次へ"></button></div>`;
  el.hidden=false; document.body.style.overflow="hidden";
  st={S,i:0,t0:0,el:0,paused:false,raf:0,voice:store.get("nw-voice")==="1"};
  el.querySelector("#stVoice").setAttribute("aria-pressed",String(st.voice)); el.querySelector("#stVoice").textContent=st.voice?"🔊 読み上げ中":"🔈 読み上げ";
  el.querySelector("#stClose").onclick=closeStory;
  el.querySelector("#stPause").onclick=()=>setPause(!st.paused);
  el.querySelector("#stVoice").onclick=e=>{st.voice=!st.voice; store.set("nw-voice",st.voice?"1":"0"); e.currentTarget.setAttribute("aria-pressed",String(st.voice)); e.currentTarget.textContent=st.voice?"🔊 読み上げ中":"🔈 読み上げ"; if(st.voice) speak(st.S[st.i].say); else stopSpeak();};
  el.querySelector(".tapl").onclick=()=>show(st.i-1);
  el.querySelector(".tapr").onclick=()=>show(st.i+1);
  document.addEventListener("keydown",storyKeys);
  show(0);
}
function storyKeys(e){ if(!st) return; if(e.key==="Escape") closeStory(); if(e.key==="ArrowRight") show(st.i+1); if(e.key==="ArrowLeft") show(st.i-1); if(e.key===" "){e.preventDefault(); setPause(!st.paused);} }
function speak(txt){ try{ const s=window.speechSynthesis; if(!s) return; s.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang="ja-JP"; u.rate=1.05; s.speak(u);}catch(e){} }
function stopSpeak(){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }
function setPause(p){ st.paused=p; const b=document.getElementById("stPause"); b.textContent=p?"▶":"❚❚"; b.setAttribute("aria-label",p?"再生":"一時停止"); if(!p){ st.t0=performance.now()-st.el; tick(); } else { cancelAnimationFrame(st.raf);} }
function show(i){
  if(!st) return; if(i<0) i=0; if(i>=st.S.length){ closeStory(); return; }
  st.i=i; st.el=0; st.t0=performance.now();
  const stage=document.getElementById("stStage"); stage.querySelectorAll(".slide").forEach(s=>s.remove());
  const s=document.createElement("div"); s.className="slide"; s.innerHTML=st.S[i].h; stage.prepend(s);
  document.getElementById("stLbl").textContent=`${i+1} / ${st.S.length}`;
  document.querySelectorAll("#story .bars b").forEach((b,k)=>b.style.width=k<i?"100%":"0");
  const cnt=s.querySelector("[data-count]"); if(cnt) countUp(cnt);
  if(st.voice) speak(st.S[i].say);
  cancelAnimationFrame(st.raf); if(!st.paused) tick();
}
function countUp(el){ const target=parseFloat(el.dataset.count); const dec=(el.dataset.count.split(".")[1]||"").length; const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches; if(reduce){el.textContent=target.toFixed(dec);return;} const t0=performance.now(); const f=t=>{const p=Math.min(1,(t-t0)/1400); const e=1-Math.pow(1-p,3); el.textContent=(target*e).toFixed(dec); if(p<1) requestAnimationFrame(f);}; requestAnimationFrame(f); }
function tick(){ st.raf=requestAnimationFrame(now=>{ if(!st||st.paused) return; st.el=now-st.t0; const bar=document.querySelectorAll("#story .bars b")[st.i]; if(bar) bar.style.width=Math.min(100,st.el/DUR*100)+"%"; if(st.el>=DUR){ show(st.i+1); return; } tick(); }); }
function closeStory(){ if(st) cancelAnimationFrame(st.raf); st=null; stopSpeak(); const el=document.getElementById("story"); el.hidden=true; el.innerHTML=""; document.body.style.overflow=""; document.removeEventListener("keydown",storyKeys); document.getElementById("playBtn")?.focus(); }

      ${histo}

        : `<div class="empty">見つかりませんでした。<br>ことばを短くするか、ジャンルの選択を外してみてください。</div>`}`;

const GTERMS = D.glossary.map(w=>({key:w[0].replace(/\(.*?\)/,""),w})).sort((a,b)=>b.key.length-a.key.length);
function glossify(html){
  const used=new Set();
  return html.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,text)=>{ if(tag) return tag; let t=text;
    GTERMS.forEach(({key},i)=>{ if(used.has(key)) return; const idx=t.indexOf(key); if(idx<0) return; used.add(key);
      t=t.slice(0,idx)+`\u0000${i}\u0001`+t.slice(idx+key.length); });
    return t.replace(/\u0000(\d+)\u0001/g,(_,i)=>`<button class="gl" data-gi="${i}">${esc(GTERMS[i].key)}</button>`); });
}

function animateFlow(){
  const f=document.getElementById("flow"); if(!f) return; const items=[...f.children];
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ f.classList.remove("anim"); return; }
  f.classList.add("anim"); items.forEach(x=>x.classList.remove("on","now"));
  items.forEach((x,i)=>setTimeout(()=>{ items.forEach(y=>y.classList.remove("now")); x.classList.add("on"); if(x.classList.contains("fstep")) x.classList.add("now"); if(i===items.length-1) setTimeout(()=>{x.classList.remove("now"); f.classList.remove("anim"); items.forEach(y=>y.classList.remove("on"));},1400); }, 300+i*650));
}

// ===== 長い期間のグラフ(history.json: FREDのデータを毎日自動で取得) =====
let HIST=null, lsState={s:"nikkei",r:"365"};
async function loadHist(){ if(HIST) return HIST; const r=await fetch("history.json",{cache:"no-cache"}); if(!r.ok) throw new Error("no"); HIST=await r.json(); return HIST; }
function longChart(){
  const box=document.getElementById("longBox"); if(!box||!window.Chart) return;
  box.querySelectorAll("#lsSer [data-s]").forEach(b=>b.onclick=()=>{ lsState.s=b.dataset.s; box.querySelectorAll("#lsSer [data-s]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); draw(); });
  box.querySelectorAll("#lsRng [data-r]").forEach(b=>b.onclick=()=>{ lsState.r=b.dataset.r; box.querySelectorAll("#lsRng [data-r]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); draw(); });
  box.querySelectorAll("#lsSer [data-s]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.s===lsState.s)));
  box.querySelectorAll("#lsRng [data-r]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.r===lsState.r)));
  let chart=null;
  function draw(){
    if(lsState.r==="tick"){ drawTicks(); return; }
    loadHist().then(H=>{
      const S=H.series[lsState.s]; if(!S) return;
      const useMonthly = lsState.r==="all" || lsState.r==="1825";
      let rows = useMonthly ? S.monthly : S.daily;
      if(lsState.r!=="all"){ const from=new Date(Date.parse(TODAY)-(+lsState.r)*864e5).toISOString().slice(0,useMonthly?7:10); rows=rows.filter(r=>r[0]>=from); }
      // このサイトで記録した最新の値もつなげる(FREDは数日遅れのため)
      if(!useMonthly){ const idx={nikkei:1,yen:2,oil:3}[lsState.s]; const last=rows.length?rows[rows.length-1][0]:""; D.markets.forEach(m=>{ if(m[idx]!=null && m[0]>last) rows.push([m[0],m[idx]]); }); }
      if(!rows.length){ document.getElementById("lsNote").textContent="この期間のデータがありません。"; return; }
      const first=rows[0][1], lastV=rows[rows.length-1][1], diff=lastV-first, pct=first?diff/first*100:0;
      const hi=rows.reduce((a,r)=>r[1]>a[1]?r:a), lo=rows.reduce((a,r)=>r[1]<a[1]?r:a);
      const f=v=> lsState.s==="nikkei"? Math.round(v).toLocaleString("ja-JP")+"円" : v.toFixed(2)+(S.unit);
      const lab=d=> d.length===7? d.replace("-","/") : `${+d.slice(5,7)}/${+d.slice(8,10)}`;
      document.getElementById("lsSum").innerHTML=`<div><span class="hint">期間の変化</span><b class="${diff>=0?'up':'dn'}" style="font-size:1.1rem">${diff>=0?"▲":"▼"}${Math.abs(pct).toFixed(1)}%</b></div><div><span class="hint">いちばん高い</span><b>${f(hi[1])}</b><small class="hint">${lab(hi[0])}</small></div><div><span class="hint">いちばん安い</span><b>${f(lo[1])}</b><small class="hint">${lab(lo[0])}</small></div>`;
      const col=css({nikkei:"--g-pol",yen:"--g-eco",oil:"--g-soc"}[lsState.s]);
      const cfg={type:"line",data:{labels:rows.map(r=>useMonthly?r[0].replace("-","/"):r[0].slice(5).replace("-","/")),datasets:[{data:rows.map(r=>r[1]),borderColor:col,backgroundColor:col+"22",fill:true,tension:.2,pointRadius:rows.length>60?0:2,pointHoverRadius:6,borderWidth:2}]},
        options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>{const r=rows[c[0].dataIndex][0]; return r.length===7? r.replace("-","年")+"月(月平均)" : r;},label:c=>f(c.raw)}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,autoSkip:true}},y:{grid:{color:css("--line")},ticks:{callback:v=>f(v)}}}}};
      if(chart){ chart.destroy(); } chart=new Chart(document.getElementById("cl"),cfg); charts.push(chart);
      document.getElementById("lsNote").innerHTML=`${esc(S.label)}。${useMonthly?"5年以上は月ごとの平均。":"1日ごとの値。"}出典: FRED(米セントルイス連銀)・毎日自動で取得、数日遅れ。いちばん新しい数日はこのサイトの記録でつないでいます。${lsState.s==="yen"?"円の値は米連銀の正午レートで、東京の夕方の値と少しちがいます。":""}`;
    }).catch(()=>{ document.getElementById("lsNote").textContent="長い期間のデータは準備中です(毎朝7時ごろに自動で取得します)。"; });
  }
  function drawTicks(){
    const note=document.getElementById("lsNote"), sum=document.getElementById("lsSum");
    if(lsState.s!=="yen"){ sum.innerHTML=""; if(chart){chart.destroy();chart=null;} note.textContent="数時間ごとの値は、いまは「1ドル(円)」だけです。日経平均と原油は、無料で取れる確かなデータが1日ごとのためです。"; return; }
    const T=(D.ticks||[]).filter(t=>Date.parse(t[0])>Date.now()-7*864e5);
    if(T.length<2){ sum.innerHTML=""; if(chart){chart.destroy();chart=null;} note.textContent="数時間ごとの記録を集めはじめたところです。1日4回(サイトの更新のたび)1点ずつ増えていきます。"; return; }
    const lab=t=>{ const d=new Date(Date.parse(t)+9*3600e3); return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${d.getUTCHours()}時`; };
    const first=T[0][1], last=T[T.length-1][1], diff=last-first;
    sum.innerHTML=`<div><span class="hint">この間の変化</span><b class="${diff>=0?'up':'dn'}">${diff>=0?"▲":"▼"}${Math.abs(diff).toFixed(2)}円</b></div><div><span class="hint">いま</span><b>${last.toFixed(2)}円</b><small class="hint">${lab(T[T.length-1][0])}</small></div><div><span class="hint">記録した点</span><b>${T.length}点</b><small class="hint">直近7日</small></div>`;
    const col=css("--g-eco");
    if(chart) chart.destroy();
    chart=new Chart(document.getElementById("cl"),{type:"line",data:{labels:T.map(t=>lab(t[0])),datasets:[{data:T.map(t=>t[1]),borderColor:col,backgroundColor:col+"22",fill:true,tension:.2,pointRadius:3,borderWidth:2}]},options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw.toFixed(2)+"円"}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:5}},y:{grid:{color:css("--line")},ticks:{callback:v=>v.toFixed(1)+"円"}}}}}); charts.push(chart);
    note.textContent="1ドルあたりの円(日本時間)。出典: Alpha Vantage のリアルタイムレート。サイトの更新(1日4回)のたびに1点ずつ記録しています。";
  }
  draw();
}

// ===== AIに聞く(Claudeを開いて質問) =====
function askAI(context,q){
  const prompt=`次のニュースの解説を読んで質問があります。中学生にもわかるやさしい日本語で、事実と推測を分けて答えてください。わからないことは「わからない」と答えてください。\n\n【解説】\n${context}\n\n【質問】\n${q}`;
  const url="https://claude.ai/new?q="+encodeURIComponent(prompt.slice(0,1800));
  const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
}
function askBlock(k){ const e=D.explainers[k]; const ex=[e.faq[0]&&e.faq[0][0],"わたしの生活にはどう関係する?","これから先、どうなりそう?"].filter(Boolean);
  return `<div class="blk card ask"><h3>🤖 AIに聞いてみる</h3><p class="hint" style="margin:0 0 8px">知りたいことを書くと、この解説の内容をつけてClaude(AI)が開きます。Claudeのアカウント(無料で作れます)が必要です。AIの答えはまちがうこともあるので、大事なことは出典で確かめてください。</p>
    <div class="chips" style="margin-bottom:8px">${ex.map(x=>`<button class="fchip" data-askq="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="sbox"><input id="askIn" type="text" placeholder="例: なぜ原油が上がるとガソリンも上がるの?" autocomplete="off"><button class="iconbtn" id="askGo" style="background:var(--accent);color:var(--on-accent);border-color:var(--accent)">聞く</button></div></div>`; }
function bindAsk(k){ const e=D.explainers[k]; const ctx=[e.name,"ひとことで: "+e.kid,e.more.join(" "),"流れ: "+e.timeline.slice(-5).map(t=>t.join(" ")).join(" / ")].join("\n");
  const go1=q=>{ if(q&&q.trim()) askAI(ctx,q.trim()); };
  document.getElementById("askGo").onclick=()=>go1(document.getElementById("askIn").value);
  document.getElementById("askIn").onkeydown=ev=>{ if(ev.key==="Enter") go1(ev.target.value); };
  document.querySelectorAll("[data-askq]").forEach(b=>b.onclick=()=>go1(b.dataset.askq)); }

// ===== 予定・予測 =====
const PRED = D.predictions.map(r=>({no:r[0],t:r[1],c:r[2],d:r[3],r:r[4],now:r[5],m:r[6]}));
const RL={hit:["✅ 当たり","res-hit"],miss:["❌ 外れ","res-miss"],part:["🔶 一部当たり","res-part"],wait:["⏳ 判定待ち","res-wait"]};
function renderPlan(){
  const up=D.schedule.filter(s=>(s[1]||s[0])>=TODAY).sort((a,b)=>a[0].localeCompare(b[0]));
  const past=D.schedule.filter(s=>(s[1]||s[0])<TODAY);
  const n={hit:0,miss:0,part:0,wait:0}; PRED.forEach(p=>n[p.r]++);
  const judged=n.hit+n.miss+n.part; const rate=judged?Math.round((n.hit*100+n.part*50)/judged):0;
  main.innerHTML=`<div class="view">
    <div class="sec-h"><h2>📅 これからの予定</h2><span class="sub">近い順</span></div>
    <ul class="plan">${up.map(s=>{ const dd=daysFrom(s[0]); const x=md(s[0]); const left= dd<=0? (s[1]&&s[1]>=TODAY?"いま":"今日") : dd===1?"明日":`あと${dd}日`;
      return `<li><div class="d"><div class="md num">${x.m}/${x.d}</div><div class="wd">${x.w}曜${s[1]?"〜":""}</div></div><div><span class="left">${left}</span> <span class="chip ${s[2]}">${GN[s[2]]||""}</span>${s[4]?` <span class="chip">🎯 ${esc(s[4])}</span>`:""}<div class="tx">${esc(s[3])}</div>${s[5]?`<div class="mm">${esc(s[5])}</div>`:""}<button class="fchip ics" data-i="${D.schedule.indexOf(s)}">📅 カレンダーに追加</button></div></li>`; }).join("") || '<li><div></div><div class="hint">登録された予定はありません</div></li>'}</ul>
    ${past.length?`<details class="faq"><summary>終わった予定(${past.length}件)</summary><ul class="us" style="margin:10px 0 12px">${past.map(s=>`<li>${mdLabel(s[0])} ${esc(s[3])}</li>`).join("")}</ul></details>`:""}
    <div class="sec-h" style="margin-top:6px"><h2>🎯 予測と、あなたの予想</h2><span class="sub">当たり100点・一部50点・外れ0点</span></div>
    <section class="card score">
      <div class="donut"><canvas id="dn" width="140" height="140" aria-label="予測の内訳"></canvas><div class="c"><div><b class="num">${rate}%</b><br><span>的中率(${judged}件)</span></div></div></div>
      <div class="tally"><span class="res-hit">✅ 当たり ${n.hit}</span><span class="res-miss">❌ 外れ ${n.miss}</span><span class="res-part">🔶 一部 ${n.part}</span><span class="res-wait">⏳ 判定待ち ${n.wait}</span><span class="hint" style="grid-column:1/-1">予測は「当たったかどうか」を後で正直に記録するためのものです。</span></div>
    </section>
    <div class="chips" id="pf"><button class="fchip" data-f="wait" aria-pressed="true">⏳ 判定待ち</button><button class="fchip" data-f="done" aria-pressed="false">決着した予測</button></div>
    <div class="pred" id="plist"></div>
    ${footer()}
  </div>`;
  bindFooter();
  const drawP=f=>{ const L=PRED.filter(p=>f==="wait"?p.r==="wait":p.r!=="wait").sort((a,b)=>(a.d||"9").localeCompare(b.d||"9"));
    document.getElementById("plist").innerHTML=L.map(p=>`<div class="pr"><span class="no">${esc(p.no)}</span><span><b>${esc(p.t)}</b></span>${p.r==="wait"?voteRow(p):ME.votes[p.no]?`<span class="r">あなたの予想: ${ME.votes[p.no].v==="yes"?"当たる":"外れる"}</span>`:""}<span class="r"><span class="${RL[p.r][1]}">${RL[p.r][0]}</span> ・ 確度: ${esc(p.c)} ・ 判定日: ${p.d?mdLabel(p.d)+(p.r==="wait"&&daysFrom(p.d)>=0?`(あと${daysFrom(p.d)}日)`:""):"次の発表時"}${p.now?" ・ いま "+esc(p.now):""}${p.m?`<br>${esc(p.m)}`:""}</span></div>`).join(""); };
  main.querySelectorAll("#pf [data-f]").forEach(b=>b.onclick=()=>{ main.querySelectorAll("#pf [data-f]").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); drawP(b.dataset.f); });
  drawP("wait");
  if(window.Chart){ charts.push(new Chart(document.getElementById("dn"),{type:"doughnut",data:{labels:["当たり","外れ","一部","判定待ち"],datasets:[{data:[n.hit,n.miss,n.part,n.wait],backgroundColor:[css("--ok"),css("--g-intl"),css("--warn"),css("--line")],borderWidth:0}]},options:{cutout:"70%",responsive:false,plugins:{legend:{display:false}}}})); }
}

function voteRow(p){ const v=ME.votes[p.no]&&ME.votes[p.no].v; return `<span class="r vote">あなたは? <button class="fchip" data-vote="yes" data-no="${esc(p.no)}" aria-pressed="${v==="yes"}">⭕ 当たる</button><button class="fchip" data-vote="no" data-no="${esc(p.no)}" aria-pressed="${v==="no"}">❌ 外れる</button></span>`; }

// ===== 一人ひとりの記録(見る人のスマホの中だけに保存) =====
const ME = (()=>{ let p={}; try{ p=JSON.parse(store.get("nw-me")||"{}")||{}; }catch(_){ p={}; }
  p.interests=p.interests||{}; p.auto=p.auto||{}; p.days=p.days||[]; p.readEx=p.readEx||{}; p.quiz=p.quiz||{}; p.words=p.words||[]; p.votes=p.votes||{}; p.seen=p.seen||[]; p.badges=p.badges||[]; p.notified=p.notified||{}; p.pins=p.pins||{};
  return p; })();
function saveMe(){ store.set("nw-me", JSON.stringify(ME)); }
const nkey = n => (n.d+"|"+n.h).slice(0,80);
// 訪問日と連続記録
(function(){ if(!ME.days.includes(TODAY)){ ME.days.push(TODAY); ME.days=ME.days.slice(-400); } saveMe(); })();
function streak(){ const set=new Set(ME.days); let c=0; let d=new Date(Date.parse(TODAY)); while(set.has(d.toISOString().slice(0,10))){ c++; d=new Date(d.getTime()-864e5); } return c; }
function bestStreak(){ const ds=[...ME.days].sort(); let best=0,cur=0,prev=null; ds.forEach(d=>{ cur = prev && Date.parse(d)-Date.parse(prev)===864e5 ? cur+1 : 1; best=Math.max(best,cur); prev=d; }); return best; }
// 新着(前回見たあとに増えたニュース)
const FIRST_VISIT = ME.seen.length===0;
const PREV_SEEN = new Set(ME.seen);
const NEW_KEYS = new Set(FIRST_VISIT?[]:NEWS.filter(n=>!PREV_SEEN.has(nkey(n))).map(nkey));
ME.seen = NEWS.map(nkey).slice(0,800); saveMe();
const isNew = n => NEW_KEYS.has(nkey(n));
// 関心(自分で選んだもの+読んだものから少しずつ学ぶ)
function interestScore(g){ return (ME.interests[g]?5:0) + Math.min(4,(ME.auto[g]||0)/2); }
function learn(g,w){ if(!g) return; ME.auto[g]=(ME.auto[g]||0)+(w||1); saveMe(); }
function hasInterests(){ return Object.values(ME.interests).some(Boolean); }
// 予想ゲームの採点
function voteResults(){ let win=0, lose=0, half=0, open=0; const settled=[];
  Object.entries(ME.votes).forEach(([no,v])=>{ const p=PRED.find(x=>x.no===no); if(!p) return; if(p.r==="wait"){ open++; return; }
    const ok = p.r==="part" ? "half" : ((p.r==="hit")===(v.v==="yes") ? "win" : "lose");
    if(ok==="win") win++; else if(ok==="lose") lose++; else half++; settled.push({p,v,ok}); });
  return {win,lose,half,open,settled}; }
// ポイントとレベル(続けるほど育つ)
const LEVELS=[[0,"ニュースの入り口"],[20,"ニュース好き"],[60,"話題の流れがわかる人"],[120,"家族に解説できる人"],[250,"ニュース博士"],[450,"ニュース名人"]];
function points(){ const vr=voteResults(); const quizOK=Object.values(ME.quiz).reduce((a,b)=>a+(+b||0),0);
  return ME.days.length*2 + Object.keys(ME.readEx).length*3 + quizOK*2 + ME.words.length + vr.win*5 + vr.half*2; }
function level(){ const pt=points(); let i=0; LEVELS.forEach((l,k)=>{ if(pt>=l[0]) i=k; }); const next=LEVELS[i+1]; return {pt,i,name:LEVELS[i][1],next,prog: next? (pt-LEVELS[i][0])/(next[0]-LEVELS[i][0]) : 1}; }
const BADGES=[
  ["first","🌱","はじめの一歩","はじめて開いた",()=>ME.days.length>=1],
  ["s3","🔥","3日連続","3日続けて開いた",()=>bestStreak()>=3],
  ["s7","🏅","1週間連続","7日続けて開いた",()=>bestStreak()>=7],
  ["s30","🏆","1か月連続","30日続けて開いた",()=>bestStreak()>=30],
  ["ex5","💡","解説5本","解説を5本読んだ",()=>Object.keys(ME.readEx).length>=5],
  ["quiz","🧠","クイズ満点","今日のクイズで満点",()=>Object.values(ME.quiz).some(v=>+v>=3)],
  ["w10","📖","ことば10個","ことばの意味を10個しらべた",()=>ME.words.length>=10],
  ["vote","🎯","予想的中","自分の予想が当たった",()=>voteResults().win>=1],
  ["vote5","🔮","予想名人","予想が5回当たった",()=>voteResults().win>=5]
];
function newBadges(){ const got=[]; BADGES.forEach(b=>{ if(!ME.badges.includes(b[0]) && b[4]()){ ME.badges.push(b[0]); got.push(b); } }); if(got.length) saveMe(); return got; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.innerHTML=msg; document.body.appendChild(t); setTimeout(()=>t.classList.add("out"),2600); setTimeout(()=>t.remove(),3200); }
function checkBadges(){ newBadges().forEach((b,i)=>setTimeout(()=>toast(`${b[1]} バッジ「${esc(b[2])}」を手に入れました`),400+i*1200)); }

// ピン留めとメモ
function pinAttrs(o){ return `data-pk="${esc(o.k)}" data-ph="${esc(o.h)}" data-pg="${esc(o.g||"")}" data-pd="${esc(o.d||"")}" data-pex="${esc(o.ex||"")}"`; }
function pinBtn(o,extraCls){ const on=!!ME.pins[o.k]; return `<button class="pin-btn ${extraCls||""}" ${pinAttrs(o)} aria-pressed="${on}" aria-label="${on?"保存をやめる":"保存する"}" title="あとで読む・メモ">${on?"📌":"📍"}</button>`; }
document.addEventListener("click",ev=>{ const b=ev.target.closest(".pin-btn"); if(!b) return; ev.preventDefault(); ev.stopPropagation();

// ===== 1週間のふりかえり(スライド) =====
function buildWeekSlides(){
  const since=new Date(Date.parse(TODAY)-6*864e5).toISOString().slice(0,10);
  const W=NEWS.filter(n=>n.d>=since); const okW=W.filter(n=>n.ok);
  const glow = c => `<div class="glow" style="background:radial-gradient(circle at 30% 30%, ${c}, transparent 60%)"></div>`;
  const th={}; W.forEach(n=>(n.th||"").split(/[、,]/).filter(Boolean).forEach(t=>th[t]=(th[t]||0)+1));
  const topTh=Object.entries(th).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const gc={}; W.forEach(n=>gc[n.g]=(gc[n.g]||0)+1);
  const S=[];
  S.push({h:`${glow("#3b5bff")}<div class="kick an">1週間のふりかえり</div><h2 class="an d1">${mdLabel(since)}〜${mdLabel(TODAY)}</h2><p class="an d2">この1週間に記録したニュースは <b class="num">${W.length}件</b>。そのうち2社以上で確かめたものは <b class="num">${okW.length}件</b>。</p>`, say:`1週間のふりかえりです。記録したニュースは${W.length}件でした。`});
  if(topTh.length) S.push({h:`${glow("#ef4444")}<div class="kick an">よく出てきた話題</div><ol class="mini">${topTh.map(([t,c],i)=>`<li class="an d${i+1}"><b>${esc(t)}</b> … ${c}件</li>`).join("")}</ol><p class="an d4" style="opacity:.8">同じ話題が何日も続くと、流れが見えてきます。</p>`, say:"よく出てきた話題は、"+topTh.map(x=>x[0]).join("、")+"でした。"});
  const bars=GORDER.filter(g=>gc[g]).map(g=>`<div class="an d1" style="display:grid;grid-template-columns:7.5em 1fr 2.5em;gap:8px;align-items:center;font-size:.95rem"><span>${GN[g]}</span><span style="height:12px;border-radius:6px;background:var(--g-${g});width:${Math.max(6,gc[g]/Math.max(...Object.values(gc))*100)}%"></span><span class="num">${gc[g]}</span></div>`).join("");
  S.push({h:`${glow("#22a35a")}<div class="kick an">ジャンル別の数</div><div style="display:flex;flex-direction:column;gap:10px">${bars}</div>`, say:"ジャンル別の数です。"});
  const picks=GORDER.map(g=>okW.find(n=>n.g===g)).filter(Boolean).slice(0,5);
  if(picks.length) S.push({h:`${glow("#a855f7")}<div class="kick an">ジャンルごとの1本</div><ol class="mini">${picks.map((n,i)=>`<li class="an d${Math.min(4,i+1)}"><b>${GN[n.g]}</b> ${esc(n.h)}</li>`).join("")}</ol>`, say:picks.map(n=>n.h).join("。")});
  const myDays=ME.days.filter(d=>d>=since).length; const myEx=Object.values(ME.readEx).filter(d=>d>=since).length;
  S.push({h:`${glow("#f59e0b")}<div class="kick an">あなたの1週間</div><div class="huge an d1 num">${myDays}<span style="font-size:.4em"> 日</span></div><p class="an d2">開いた日 ${myDays}日 ・ 読んだ解説 ${myEx}本 ・ いま ${streak()}日連続</p><p class="an d3" style="opacity:.8">続けるほど、話題の「つながり」が見えるようになります。</p>`, say:`あなたは今週${myDays}日開きました。`});
  return S;
}

async function shareImage(){
  const btn=document.getElementById("shareImg"); if(btn) btn.textContent="画像を作っています…";
  try{ await document.fonts.ready; }catch(_){}
  const W=1080,H=1350,c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
  const font=(w,s)=>`${w} ${s}px "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif`;
  x.fillStyle="#eef1f4"; x.fillRect(0,0,W,H);
  x.fillStyle="#2747c9"; x.fillRect(0,0,W,210);
  x.fillStyle="#fff"; x.font=`64px "Dela Gothic One","Hiragino Sans",sans-serif`; x.fillText("まいにちニュース帳",70,118);
  x.font=font(700,36); x.fillText(`${D.updatedLabel} の「今日の3行」`,70,175);
  const cols={intl:"#c42b2b",pol:"#2563c9",spo:"#8a5a2b",eco:"#17803f",soc:"#c25a0c",it:"#7c3aed",ent:"#c0367a"};
  const wrap=(t,max,size,w)=>{ x.font=font(w,size); const lines=[]; let cur=""; for(const ch of t){ if(x.measureText(cur+ch).width>max){ lines.push(cur); cur=ch; } else cur+=ch; } if(cur) lines.push(cur); return lines; };
  let y=260;
  D.three.forEach(t=>{ const tl=wrap(t.title,880,46,700).slice(0,2); const bl=wrap(t.text,880,32,400).slice(0,3);
    const hgt=60+tl.length*60+bl.length*46+30;
    x.fillStyle="#fff"; x.beginPath(); x.roundRect?x.roundRect(60,y,960,hgt,28):x.rect(60,y,960,hgt); x.fill();
    x.fillStyle=cols[t.tone]||"#475569"; x.fillRect(60,y,14,hgt);
    x.fillStyle="#5a6478"; x.font=font(700,28); x.fillText(t.label,100,y+48);
    x.fillStyle="#141b2d"; tl.forEach((l,i)=>{ x.font=font(700,46); x.fillText(l,100,y+108+i*60); });
    x.fillStyle="#3b4458"; bl.forEach((l,i)=>{ x.font=font(400,32); x.fillText(l,100,y+108+tl.length*60+i*46-10); });
    y+=hgt+28; });
  x.fillStyle="#5a6478"; x.font=font(400,28); x.fillText("2社以上で確かめたニュースだけ ・ まとめ: Claude(AI)",70,H-90);
  x.fillStyle="#2747c9"; x.font=font(700,32); x.fillText(location.host+location.pathname,70,H-44);
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  const file=new File([blob],`news-${TODAY}.png`,{type:"image/png"});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"まいにちニュース帳",text:"今日の3行 "+location.href.split("#")[0]}); if(btn) btn.textContent="🖼️ 画像にして送る"; return; } }catch(_){}
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
  if(btn) btn.textContent="✅ 画像を保存しました";
}

// ===== 予定をカレンダーへ(.ics) =====
function icsFor(s){
  const d=s[0].replace(/-/g,""); const endIso=s[1]||s[0]; const e=new Date(Date.parse(endIso)+864e5).toISOString().slice(0,10).replace(/-/g,"");
  const clean=t=>String(t).replace(/[\;,]/g,m=>"\\"+m).replace(/\n/g," ");
  const body=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//mainichi-news//JA","BEGIN:VEVENT",`UID:${d}-${Math.abs([...s[3]].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))}@news`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,`SUMMARY:${clean(s[3])}`,`DESCRIPTION:${clean((s[5]||"")+" (まいにちニュース帳)")}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const blob=new Blob([body],{type:"text/calendar"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=`yotei-${d}.ics`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
}

  [/トルコ/,32.86,39.93,"トルコ"],[/ジブチ/,43.15,11.59,"ジブチ"],[/グリーンランド/,-51.72,64.18,"グリーンランド"],[/ICC|オランダ/,4.3,52.07,"オランダ(ICC)"],[/MMX|火星/,130.97,30.4,"種子島(打ち上げ)"]
];
function placeOf(n){ for(const p of PLACES){ if(p[0].test(n.h+" "+(n.th||""))) return p; } return null; }
let mapState={view:"japan",sel:null};
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
let WORLD=null;
async function getWorld(){ if(WORLD) return WORLD; await loadScript("https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"); await loadScript("https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js");
  const topo=await (await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json")).json(); WORLD=topojson.feature(topo,topo.objects.countries); return WORLD; }
function renderMap(){
  const recentDays=[...new Set(NEWS.map(n=>n.d))].slice(0,7);
  main.innerHTML=`<div class="view">
    <div class="sec-h"><h2>🗺️ ニュースの地図</h2><span class="sub">直近7日分</span></div>
    <div class="chips"><button class="fchip" data-v="japan" aria-pressed="${mapState.view==="japan"}">🗾 日本</button><button class="fchip" data-v="world" aria-pressed="${mapState.view==="world"}">🌏 世界</button></div>
    <div class="card mapbox"><div id="map" class="mapsvg"><div class="empty">地図を読み込んでいます…</div></div></div>
    <p class="hint" style="margin:0">● をタップすると、その場所のニュースが下に出ます。点が大きいほどニュースが多い場所です。場所は見出しのことばから自動で決めた目安です。</p>
    <div id="mapList"></div>
    ${footer()}
  </div>`;
  main.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ mapState.view=b.dataset.v; mapState.sel=null; renderMap(); });
  const items=NEWS.filter(n=>recentDays.includes(n.d)).map(n=>({n,p:placeOf(n)})).filter(x=>x.p);
  const JP=[0,139.75,36.2,"日本(国内)"];
  const groups={}; items.forEach(x=>{ let pp=x.p; if(mapState.view==="world" && pp[1]>122 && pp[1]<147 && pp[2]>24 && pp[2]<46) pp=JP; const k=pp[3]; (groups[k]=groups[k]||{p:pp,list:[]}).list.push(x.n); });
  getWorld().then(world=>{
    const el=document.getElementById("map"); if(!el) return; const W=el.clientWidth||360, H=Math.round(W*(mapState.view==="japan"?1.05:0.62));
    const proj = mapState.view==="japan" ? d3.geoMercator().fitExtent([[10,10],[W-10,H-10]],{type:"MultiPoint",coordinates:[[123,24],[146,45.5]]}) : d3.geoNaturalEarth1().fitExtent([[6,6],[W-6,H-6]],{type:"Sphere"});
    const path=d3.geoPath(proj);
    const svg=d3.create("svg").attr("viewBox",`0 0 ${W} ${H}`).attr("width","100%").attr("role","img").attr("aria-label",mapState.view==="japan"?"日本の地図":"世界の地図");
    svg.append("rect").attr("width",W).attr("height",H).attr("fill","var(--map-sea)");
    svg.append("g").selectAll("path").data(world.features).join("path").attr("d",path).attr("fill",d=>d.id==="392"?"var(--map-jp)":"var(--map-land)").attr("stroke","var(--map-line)").attr("stroke-width",.6);
    const vis=Object.values(groups).filter(gp=>{ const xy=proj([gp.p[1],gp.p[2]]); return xy && xy[0]>=0 && xy[0]<=W && xy[1]>=0 && xy[1]<=H; });
    const g=svg.append("g");
    vis.forEach(gp=>{ const [x,y]=proj([gp.p[1],gp.p[2]]); const r=6+Math.min(12,gp.list.length*2.2); const col=css("--g-"+gp.list[0].g)||"#c42b2b";
      const node=g.append("g").attr("class","pin").attr("tabindex",0).attr("role","button").attr("aria-label",`${gp.p[3]} ${gp.list.length}件`).style("cursor","pointer");
      node.append("circle").attr("cx",x).attr("cy",y).attr("r",r+6).attr("fill",col).attr("opacity",.18).attr("class","pulse");
      node.append("circle").attr("cx",x).attr("cy",y).attr("r",r).attr("fill",col).attr("stroke","#fff").attr("stroke-width",2);
      node.append("text").attr("x",x).attr("y",y+4).attr("text-anchor","middle").attr("font-size",11).attr("font-weight",700).attr("fill","#fff").text(gp.list.length);
      const pick=()=>{ mapState.sel=gp.p[3]; drawList(); };
      node.on("click",pick).on("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); pick(); } }); });
    el.innerHTML=""; el.appendChild(svg.node());
    const others=Object.values(groups).filter(gp=>!vis.includes(gp));
    function drawList(){ const box=document.getElementById("mapList"); if(!box) return;
      const show = mapState.sel ? Object.values(groups).filter(gp=>gp.p[3]===mapState.sel) : vis.sort((a,b)=>b.list.length-a.list.length);
      box.innerHTML = `${mapState.sel?`<button class="fchip" id="mapAll" style="margin-bottom:8px">← すべての場所</button>`:""}${show.map(gp=>`<section class="day"><h3>📍 ${esc(gp.p[3])}(${gp.list.length}件)</h3><ul>${gp.list.map(n=>`<li class="item"><div class="meta"><span class="chip ${n.g}">${GN[n.g]}</span>${n.ok?'<span class="badge-ok">✅</span>':'<span class="badge-one">⚠️ 1社</span>'}<span class="hint">${mdLabel(n.d)}</span></div><div class="h">${esc(n.h)}</div></li>`).join("")}</ul></section>`).join("")}
        ${!mapState.sel&&others.length?`<p class="hint">この地図の外の場所: ${others.map(o=>`${esc(o.p[3])}(${o.list.length})`).join("・")} → 「${mapState.view==="japan"?"🌏 世界":"🗾 日本"}」に切り替えると見られます。</p>`:""}`;
      const all=document.getElementById("mapAll"); if(all) all.onclick=()=>{ mapState.sel=null; drawList(); }; }
    drawList();
  }).catch(()=>{ const el=document.getElementById("map"); if(el) el.innerHTML='<div class="empty">地図を読み込めませんでした。通信状態を確かめて、開き直してください。</div>'; });
}

main.addEventListener("click",ev=>{ const v=ev.target.closest("[data-vote]"); if(v){ ME.votes[v.dataset.no]={v:v.dataset.vote,at:TODAY}; saveMe(); v.parentElement.querySelectorAll("[data-vote]").forEach(x=>x.setAttribute("aria-pressed",String(x===v))); toast("🎯 予想を記録しました。結果が出たらお知らせします"); return; }
  const ic=ev.target.closest(".ics"); if(ic) icsFor(D.schedule[+ic.dataset.i]); });

const PHOTOS={
  saudi:["https://images.unsplash.com/photo-1516199423456-1f1e91b06f25?w=1000&q=70&auto=format&fit=crop","Zbynek Burival"],
  tax:["https://images.unsplash.com/photo-1681369738123-e8d551a9ecfd?w=1000&q=70&auto=format&fit=crop","Ishaq Robin"],
  sato:["https://images.unsplash.com/photo-1582650448629-3c854f356544?w=1000&q=70&auto=format&fit=crop","Mick Haupt"],

};
function photoBlock(k){ const p=PHOTOS[k]; if(!p) return ""; return `<figure class="photo"><img src="${p[0]}" alt="" loading="lazy" onerror="this.closest('figure').remove()"><figcaption>📷 イメージ写真: ${esc(p[1])} / <a href="https://unsplash.com/?utm_source=mainichi_news&utm_medium=referral" target="_blank" rel="noopener">Unsplash</a></figcaption></figure>`; }

// ===== 解説の読み上げ =====
function speakEx(k,btn){ const e=D.explainers[k]; if(!e) return; try{ const s=window.speechSynthesis; if(!s) return;
  if(s.speaking){ s.cancel(); btn.textContent="🔊 聞く"; return; }
  const txt=[e.name,"ひとことで言うと。",e.kid,e.more[0],e.more[1],"わたしたちへの影響。",...e.us.map(u=>u.replace(/\*\*/g,"")),...e.faq.map(([q,a])=>q+" "+a)].join("。 ");
  const u=new SpeechSynthesisUtterance(txt); u.lang="ja-JP"; u.rate=1.05; u.onend=()=>{ btn.textContent="🔊 聞く"; }; s.speak(u); btn.textContent="■ 止める"; }catch(_){} }

// 起動
const h=(location.hash||"").slice(1);
if(D.explainers[h]){ go("explain"); openEx(h); } else go(TABS.some(t=>t[0]===h)?h:"today");
try{ if(new URLSearchParams(location.search).get("play")==="1") setTimeout(openStory,300); }catch(_){}
})();
