name: 株・円・原油の長期データを更新
on:
  schedule:
    - cron: "15 22 * * *"   # 毎日 日本時間 朝7:15
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_history.py
      - name: 変わっていればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "長期データを更新" && git pull --rebase origin main && git push)
