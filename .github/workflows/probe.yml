name: probe (一時的な確認)
on: workflow_dispatch
permissions: {contents: write}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://api.p2pquake.net/v2/history?codes=561&limit=3" "https://api.p2pquake.net/v2/history?codes=9611&limit=2" "https://api.p2pquake.net/v2/history?codes=555&limit=1" \
            "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson" \
            "https://www.gdacs.org/gdacsapi/api/events/geteventlist/MAP" \
            "https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=7&limit=5" \
            "https://api.gdeltproject.org/api/v2/doc/doc?query=sourcelang:japanese&mode=artlist&maxrecords=3&format=json" \
            "https://api.gdeltproject.org/api/v2/geo/geo?query=flood&format=geojson&timespan=24h"; do
            echo "=== $u" >> out.txt; curl -s -m 25 -D h.txt -o b.txt -H "Origin: https://sunbike22.github.io" "$u"; echo "exit $?" >> out.txt; head -1 h.txt >> out.txt; grep -i 'access-control-allow-origin\|content-type' h.txt >> out.txt; wc -c < b.txt >> out.txt; head -c 2500 b.txt >> out.txt; echo >> out.txt; done
          git init -q; git config user.name probe; git config user.email probe@users.noreply.github.com
          git checkout -qb probe-out; git add out.txt; git commit -qm probe; git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
